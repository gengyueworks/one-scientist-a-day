当大的地方。如果只有我们，那未免是对空间的极大浪费。」\n>\n> ——卡尔·萨根，《接触》，1985年\n\n<!-- 本卡由自动补写引擎生成，事实与引语请人工核对 -->\n", "field": "天体生物"}, {"title": "一张纸，称出了爆炸的重量", "subtitle": "费米｜9月29日诞辰", "date": "09-29", "slug": "09-29-fermi", "file": "scientists/09/09-29-fermi.md", "content": "# 一张纸，称出了爆炸的重量\n\n## 费米｜9月29日诞辰\n\n1945 年 7 月 16 日清晨五点，内华达州的沙漠里没有风。曼哈顿计划的人挤在掩体后，等着人类第一颗原子弹点火。倒计时还没走完，费米掏出一张纸，撕成碎片，举过头顶松手，纸屑飘落。几秒钟后冲击波卷过，他又撕了一把，抛起来。第三次，是在爆炸结束后。\n\n他是在测威力。纸片被冲击波推出去多远，在地上位移多少，换算一下，核爆的能量就出来了。后来他算出的数字，和仪器实测落在同一个数量级。\n\n在场的人不意外。这个人被选作曼哈顿计划的负责人之一，靠的就是这种把理论揣进兜里、随手就能摸出答案的本事。\n\n## 懂理论的很多，能动手的很少\n\n费米厉害在哪儿，一句话说不完。物理学家通常分两种，一种是纸上推公式的，一种是钻进实验室拧螺丝的，他两个都干，而且都干到顶尖。\n\n别人研究原子核，用的是带正电的 α 粒子，撞来撞去撞不进去。费米先看出来：中性的中子没有电荷阻碍，反而更容易钻进球，轰出核裂变。为了控制反应速度，他发明用石墨给中子减速的办法；为了中子的来源不靠运气，他自己动手做实验，找出制造中子源的方法。1942 年，芝加哥大学的地下室里，人类第一个核反应堆在他手里开始工作。\n\n因为这一串中子研究，1938 年他拿到了诺贝尔物理学奖。\n\n## 二十四岁的深夜，和一个他起的名字\n\n费米的天才，早在他二十几岁就露了底。二十一岁拿物理学博士；二十四岁那年，他把泡利刚提出的不相容原理用在气体上，算出一套统计规律，比狄拉克早几个月。后来这套东西叫费米—狄拉克统计，遵守它的粒子，电子、夸克、微中子，今天统一叫费米子。微中子这个名字，也是他当年解释 β 衰变时取的。\n\n那年他才二十多岁，已经给半个粒子世界命了名。\n\n## 离开故土的人，带出了一片森林\n\n1938 年拿奖那阵子，费米已经在盘算离开意大利。原因很简单：妻子是犹太人，而墨索里尼正在向纳粹靠拢。他怕，于是带着全家去了美国，此后再没回头。\n\n在美国教书的年月，他带出七个诺贝尔奖学生，李政道和杨振宁都在其中。他的名字，挂进了将近三十个物理名词：费米能量、费米能阶、费米气体、费米黄金定则……他甚至留下一个让所有人睡不着的问题：宇宙这么大，为什么我们始终见不到外星文明？这个问句，后来叫费米悖论。他那种不靠数据、靠常识估算的本事，还成了求职面试的标准玩法，比如「芝加哥有多少名钢琴调音师」，这类题至今叫费米问题。\n\n一个物理学家，活着的时候改变了物理学，走了以后，还顺手定义了别人找工作。\n\n参考：PanSci《科学史上的今天》〈费米诞辰〉（本地素材：source_texts/09-29-费米.txt）\n", "field": "物理"}, {"title": "宇宙可能是个左撇子", "subtitle": "杨振宁｜10月1日诞辰", "date": "10-01", "slug": "10-01-yang", "file": "scientists/10/10-01-yang.md", "content": "# 宇宙可能是个左撇子\n\n## 杨振宁｜10月1日诞辰\n\n1956 年，物理学界面前摆着一桩怪案。实验里出现两种介子，θ 和 τ，自旋一样，质量一样，电荷一样，怎么看都是同一个粒子照镜子的样子。可它们的衰变方式，一个像往左拐，一个像往右拐，完全对不上。\n\n这桩矛盾让物理学家们寝食难安，一群人被这件事卡了三十年。没人愿意承认：同一件事物照出的两个镜像，居然会做出不一样的事。\n\n## 三十年没人敢碰的对称\n\n因为宇称守恒，在当时的物理学里，分量跟能量守恒、动量守恒、电荷守恒平起平坐。它的意思是：大自然不分左右，把一套物理实验整个翻成镜像，应该得到一模一样的结果。这几乎是「显然」的常识，是写在教科书底层的底牌。\n\n可 θ 和 τ 这两只「老鼠」，除了左右键调了个方向，其余一模一样，动起来却南辕北辙。所有人都看见了矛盾，但所有人都在给矛盾找补，没人敢去掀那张牌桌。\n\n## 敢掀牌桌的两个年轻人\n\n1956 年，杨振宁和李政道动手了。他们提出：宇称守恒也许只是看起来普遍，在弱相互作用里，它可能根本不成立。他们还贴心地在论文里写好了怎么用实验验证。\n\n学界一片哗然。要知道，宇称守恒在教科书里躺了几十年，无数实验为它背书，敢公开质疑它，等于把自己摆在整个物理界的对面。费曼觉得想法有意思，说可以试试，但掏出五十美元打赌宇称守不住这关；泡利更直接，说他可不相信上帝是个左撇子。\n\n结果，半年后，吴健雄用实验把这个「左撇子」钉死了。论文发表第二年，诺贝尔物理学奖就落到杨振宁和李政道头上。从发表到拿奖只隔一年，这在诺奖史上从来没有过。而自诺贝尔奖设立超过半个世纪以来，华人在物理奖上的长期缺席，也从这一年开始结束。\n\n## 另一颗被忽略的炸弹\n\n但真正让杨振宁站上物理学顶峰的，可能不是这次风光。1954 年，他和米尔斯一起发表杨-米尔斯规范理论，当年因为算不下去，没什么人当回事。谁能想到，它后来成了量子电动力学的骨架，一路长成了整个标准模型的基石。论分量，它不在宇称不守恒之下。\n\n## 一张牌桌，两个人散场\n\n可惜的是，两位合作十余年的搭档，没能把这份荣耀分享到底。论文的排名、功劳的归属，早就悄悄在两人之间划开裂缝，拿了奖之后，干脆互不往来，形同陌路。\n\n外人很难说清谁对谁错，只是免不了感叹：原来科学家在追求真理的时候，也是会追名逐利的。他们推翻了物理学的左右对称，却没守住自己之间的那份对称。\n\n参考：PanSci《科学史上的今天》〈杨振宁生日〉（本地素材：source_texts/10-01-杨振宁.txt）\n", "field": "物理"}, {"title": "他在厦门的蚊子身上，看见了一件没人相信的事", "subtitle": "万巴德｜10月3日诞辰", "date": "10-03", "slug": "10-03-", "file": "scientists/10/10-03-.md", "content": "# 他在厦门的蚊子身上，看见了一件没人相信的事\n\n## 万巴德｜10月3日诞辰\n\n1877年，厦门。一间简陋的诊室里，帕特里克·万巴德（Patrick Manson）正盯着显微镜目镜，屏住呼吸。镜头下，一只刚吸过象皮病患者血液的蚊子，体内有什么东西在动——是丝状幼虫，活的，正在蠕动。他把这一刻写进笔记，却没法告诉任何人，因为最近的欧洲同行远在数千英里之外，而他身边的人根本不知道他在兴奋什么。\n\n## 一个苏格兰医生在中国南方独自做实验，没有实验室，没有同事\n\n万巴德1844年生于苏格兰阿伯丁郡，23岁就被派往台湾打狗港（今高雄）做海关医官，后来转到厦门。他在那里一待就是将近二十年，没有大学实验室，没有研究经费，只有一台自己的显微镜和大量的病人。\n\n厦门沿海一带象皮病（淋巴丝虫病）极为普遍，患者的腿肿得像树干，皮肤粗糙如象皮。当时医学界完全不知道病因。万巴德用自己的病人做观察，发现血液里存在微丝蚴，但这些幼虫只在夜间大量出现在外周血液里，白天几乎消失。这个规律本身就是一个谜。\n\n他开始怀疑蚊子是传播媒介。这个想法在1877年之前，几乎没有人认真提出过。他雇了一个患有丝虫病的工人，让蚊子在他身上叮咬，然后逐批解剖蚊子，追踪幼虫在蚊体内的发育过程。整个实验持续数月，他一个人完成了解剖、染色、记录的全部工作。\n\n1878年，他向英国医学期刊投稿，正式提出蚊子是丝虫的中间宿主。这是人类历史上第一次用实验证明昆虫可以传播寄生虫病。编辑们没有拒绝他，但也没有多少人真的相信这件事有多重要。\n\n## 他把这个想法送给了别人，别人拿走了诺贝尔奖\n\n1894年，万巴德回到伦敦，在那里遇见了年轻的军医罗纳德·罗斯（Ronald Ross）。罗斯对疟疾的传播机制一无所知，万巴德把自己的蚊子传播理论告诉他，并且明确建议：去印度，解剖疟疾病人血液喂过的蚊子，找疟原虫。\n\n罗斯在印度的实验条件同样恶劣。万巴德通过书信持续指导他，告诉他用什么蚊种，如何分辨不同阶段的原虫。1897年，罗斯在蚊子胃壁上找到了疟原虫的卵囊，1898年完整证明了传播链。\n\n1902年，罗纳德·罗斯获得诺贝尔生理学或医学奖。\n\n万巴德没有得奖。他当时已经是伦敦热带医学院的创始人，被称为「热带医学之父」，但诺贝尔委员会的那枚奖章不在他手里。他本人对此没有留下公开的愤懑记录，但他的学生和后来的传记作者一再指出，如果没有万巴德在厦门的那些年，罗斯不会知道从哪里开始找。\n\n他付出的代价还不止这一个。长年在热带工作，他自己也感染过疟疾，视力因为长期伏案做显微镜工作而严重受损。他在中国的岁月几乎与整个欧洲医学界隔绝，发表的论文要等数月才能收到任何反馈。他的妻子随他在厦门生活多年，那里没有欧洲式的社交圈，没有剧院，没有图书馆。\n\n1922年，万巴德在伦敦去世，享年77岁。他创立的伦敦卫生与热带医学院至今仍在运转。\n\n## 他说过\n\n> \"Medicine in the tropics is not a branch of medicine; it is medicine itself.\"\n\n（热带地区的医学不是医学的一个分支，它就是医学本身。）\n\n<!-- 本卡由自动补写引擎生成，事实与引语请人工核对 -->\n", "field": "医学/热带医学"}, {"title": "那十天，从日历上消失了", "subtitle": "格里高利历｜10月5日事件", "date": "10-05", "slug": "10-05-", "file": "scientists/10/10-05-.md", "content": "# 那十天，从日历上消失了\n\n## 格里高利历｜10月5日事件\n\n1582年10月4日，罗马天主教世界的人们睡下去，第二天早上醒来，日历上写的是10月15日。中间那十天，没有人经历过，也没有人会经历。不是魔法，是一道教皇令：格里高利十三世签署《教皇诏书》，强行切除了历史上的十天，让地球重新跟上太阳的脚步。\n\n## 误差积了1600年，才有人动手算清楚\n\n问题不是突然出现的。公元前46年，凯撒推行儒略历，规定每四年一个闰年，每年平均365.25天。这个数字看起来很精确，但真正的回归年是365.2422天，两者相差约11分钟。\n\n11分钟听起来微不足道。但乘以1600年，误差就累积成了将近13天。\n\n最直接的麻烦落在复活节上。教会规定复活节要在春分后第一个满月后的星期日庆祝，但儒略历的春分日已经从3月21日悄悄漂移到了3月11日。信徒们以为自己在正确的时间祈祷，其实整个仪式都偏了将近两周。这让教会高层坐立不安了几个世纪。\n\n真正推动改历的，是一位那不勒斯的医生兼天文学家阿洛伊修斯·利利乌斯。他在去世前（约1576年）留下了一份历法改革方案，由他的兄弟呈交给教皇委员会。方案的核心是两个调整：把1582年的日历直接跳过十天，补回积累的误差；同时修改闰年规则，规定整百年份不闰，但能被400整除的例外。这样算下来，每年平均长度是365.2425天，与真实回归年的误差缩小到每3300年才差一天。\n\n## 教皇签了令，新教徒说：我们不认\n\n格里高利十三世在1582年2月颁布诏书，要求天主教国家立刻执行。意大利、西班牙、葡萄牙、波兰在10月完成了切换。但这道令只在天主教世界有效。\n\n新教国家拒绝了。理由不是天文，是政治。承认教皇的历法改革，等于承认教皇的权威。英国直到1752年才跟上，整整晚了170年，那一年英国人也经历了自己的「消失的十一天」，从9月2日直接跳到9月14日。据说有人因此上街抗议，要求「还我们十一天」，不过历史学家对这场抗议是否真实发生仍有争议。\n\n东正教世界更晚。俄国直到1918年苏联革命后才切换，希腊是1923年。所以俄国的「十月革命」在格里历上其实发生在11月。\n\n## 那十天里，没有人出生，也没有人死亡\n\n从法律文件的角度看，1582年10月5日到14日这十天，在曾经使用格里历的国家里，确实不存在。没有出生证明标注这些日期，没有合同在这段时间内生效，没有人在这十天里过生日。\n\n这是人类历史上最大规模的一次时间重置，靠的不是任何新技术，只是一道命令和一个决定：承认错误，然后把错误切掉。\n\n今天我们用的就是这套历法。它不完美，但它让地球上大多数人用同一套时间说话。下次你在手机上看到日期，那个数字背后，是1600年的误差、一位医生的遗稿、一位教皇的印章，和从历史上蒸发的十天。\n\n<!-- 本卡由自动补写引擎生成，事实与引语请人工核对 -->\n", "field": "天文/历法"}, {"title": "他带着一幅地图敲开了紫禁城的门", "subtitle": "利玛窦｜10月6日诞辰", "date": "10-06", "slug": "10-06-", "file": "scientists/10/10-06-.md", "content": "# 他带着一幅地图敲开了紫禁城的门\n\n## 利玛窦｜10月6日诞辰\n\n1601年，一个意大利人站在北京的街道上，手里捧着两件礼物：一架自鸣钟，一幅世界地图。他等了整整十八年，才等到这次觐见明神宗的机会。那幅地图上，中国不在世界的边缘，而在正中央，他特意把经线调整过，就为了让这件事在政治上说得通。这个人叫利玛窦，1552年10月6日生于意大利马切拉塔。\n\n## 他用中文写出了一个新世界的轮廓\n\n利玛窦到中国不是为了征服，而是为了进入。他很早就明白，穿着僧袍在广东街头晃荡没有用，中国人不尊重和尚，他们尊重读书人。于是他换掉了耶稣会的黑袍，穿上了儒生的青衫，开始学四书五经，练毛笔字，背汉字。\n\n他的汉语不是随便学的。他用一套记忆宫殿的方法，把汉字一个一个存进脑子里，据说能在初见一串汉字后，倒背如流。这个技巧让他在中国士大夫圈子里一炮而红，因为那个年代，记忆力本身就是学问的象征。\n\n他在肇庆、韶州、南昌、南京辗转了将近二十年，每到一地都建立小教堂，但他更重要的工作是和当地士人谈天。他把欧几里得的《几何原本》翻译成中文，和徐光启一起，两个人对坐，一个念拉丁文，一个写汉字，把命题一条条捋清楚。这本书1607年刻印出来，是中国第一次见到系统的西方数学。\n\n## 进了北京，却永远出不去了\n\n1601年抵达北京之后，利玛窦获准留居，但他没有自由。他住在一座由皇帝赐予的宅子里，理论上随时可能被驱逐，实际上哪儿也去不了。他成了朝廷的一个展示品，自鸣钟坏了就叫他去修，西洋仪器有问题就叫他去解释。\n\n他一直没能见到万历皇帝本人。皇帝躲在深宫里，派太监传话，利玛窦的那些书信和礼物经过层层转手，最终石沉大海还是产生了影响，他自己也不确定。\n\n他死于1610年，在北京，距他第一次踏上中国土地已经过了二十七年。按照规定，外国人死后不能葬在北京，但万历皇帝破例，赐给他一块墓地。这是他在中国得到的最后一个特权，也是唯一一次皇帝主动给他的回应。\n\n他留下的东西是具体的：汉语版的《几何原本》前六卷，第一张标注了中文地名的世界地图，以及一批亲手培养出来的中国天主教徒，其中包括徐光启、李之藻、杨廷筠，后人称他们为「圣教三柱石」。\n\n他没能让中国改宗，也没能让西方科学在明朝生根成林。但他打开了一道缝，让两种文明的人有机会坐下来，对着同一张纸，认真讨论一件事该怎么证明。\n\n## 他说过\n\n> 吾人入中国，非为别事，惟求灵魂得救耳。\n\n这句话是他写给耶稣会上级的，说的是传教目的。但他实际做的事情，比这句话复杂得多。\n\n<!-- 本卡由自动补写引擎生成，事实与引语请人工核对 -->\n", "field": "文化交流"}, {"title": "一根融化的巧克力棒，改变了人类的厨房", "subtitle": "微波炉｜10月8日诞辰", "date": "10-08", "slug": "10-08-", "file": "scientists/10/10-08-.md", "content": "# 一根融化的巧克力棒，改变了人类的厨房\n\n## 微波炉｜10月8日诞辰\n\n1945年的某一天，美国雷神公司的工程师珀西·斯潘塞走过一台正在运行的磁控管旁边，停下来。他口袋里的花生糖条融化了。不是因为天热，是因为磁控管发出的微波悄悄穿透了他的口袋。斯潘塞没有骂一句脏话走开，他站在那里想了很久。\n\n## 他没有去找更好的雷达，他去找了爆米花\n\n斯潘塞当时的本职工作是替二战盟军改良雷达磁控管的生产效率。他在雷神公司主导的磁控管月产量，从战前的每天17台提升到了每天2600台，这件事让他在工程界颇有分量。\n\n但他的注意力在那根融化的糖条之后彻底跑偏了。他找来一袋爆米花玉米粒，放到磁控管旁边，玉米粒全部爆开。第二天，他带来一颗鸡蛋，鸡蛋在实验过程中爆炸，炸到了旁边同事的脸。\n\n他用的不是精密仪器，不是实验室里的标准流程，就是口袋里的糖、食堂的玉米、一颗普通的鸡蛋。1945年，雷神公司为这个发现申请了专利，斯潘塞是发明人。\n\n## 第一台微波炉有将近两米高，卖给了饭店和军队\n\n专利申请下来之后，问题才真正开始。第一台商用微波炉「雷达炉」在1947年推出，高约1.7米，重约340公斤，售价大约是3000美元，折合今天的购买力超过4万美元。这东西只有饭店、军队食堂、远洋客轮的厨房才买得起，普通家庭连看都没见过。\n\n斯潘塞拿到的专利奖金是雷神公司的惯例奖励：两美元。公司规定，员工在职期间的发明专利归公司所有，奖金是象征性的两美元。他没有提出异议，也没有离职去自立门户，他继续在雷神工作，后来升到了高级副总裁。\n\n真正走进家庭厨房的微波炉，是1967年才出现的，那一年雷神旗下的Amana品牌推出了台式家用版本，售价495美元，体积终于缩小到了普通人能放在厨房台面上的尺寸。距离那根融化的糖条，已经过去了22年。\n\n## 他说过\n\n> 「如果我们只做我们知道该怎么做的事，我们就永远不会有任何进展。」\n\n这句话是斯潘塞在谈到自己的工作方法时留下的，他一生没有接受过正式的大学教育，十二岁开始在工厂打工，靠自学掌握了电气工程的核心知识。他在雷神公司拥有超过300项专利，微波炉只是其中一项，却是唯一一项让全世界每天早上都能在厨房里感受到他存在的那一项。\n\n<!-- 本卡由自动补写引擎生成，事实与引语请人工核对 -->\n", "field": "工程"}, {"title": "战壕里算出来的那个解，让宇宙出现了一个洞", "subtitle": "史瓦西｜10月9日诞辰", "date": "10-09", "slug": "10-09-karl-schwarzschild", "file": "scientists/10/10-09-karl-schwarzschild.md", "content": "# 战壕里算出来的那个解，让宇宙出现了一个洞\n\n## 史瓦西｜10月9日诞辰\n\n1915年12月，卡尔·史瓦西正蹲在俄国前线的战壕里。他是德国炮兵部队的一名军官，负责计算炮弹弹道。夜里炮声停歇时，他把爱因斯坦刚发表的广义相对论论文翻出来读，然后开始在纸上演算。他用不到一个月，算出了广义相对论方程的第一个精确解。\n\n## 爱因斯坦本人都没想到能算出精确解\n\n爱因斯坦在1915年11月发表广义相对论时，自己也只给出了近似解。他认为这组方程太复杂，精确解几乎不可能得到。\n\n史瓦西在战场上，针对最简单的情形，也就是一个静止的、球对称的质量体周围的时空，硬是把方程解了出来。他在1916年1月把论文寄给爱因斯坦，爱因斯坦回信说，他没想到有人能用这么简洁的形式得到精确解，并亲自在普鲁士科学院宣读了这篇论文。\n\n这个解里藏着一个奇怪的数值，后来被称为「史瓦西半径」。把任何质量压缩到这个半径以内，时空就会弯曲到连光都跑不出来。太阳的史瓦西半径约为3公里，地球的约为9毫米。当时没人认真对待这件事，觉得那不过是数学上的奇点，现实里不会存在。\n\n## 他只剩四个月，却还寄出了第二篇论文\n\n史瓦西在战壕里染上了天疱疮，这是一种皮肤自身免疫疾病，在当时几乎无药可治。1916年3月，他从前线被送回国内。5月，他去世，年仅42岁。\n\n他死前还完成了第二篇论文，处理的是均匀密度球体内部的时空解。两篇论文，前后相差不过几周，都是在他生命最后几个月里写成的。\n\n他没能看到后来发生的事。1960年代，物理学家们重新认真对待史瓦西解，「事件视界」这个概念被正式提出，人们开始相信黑洞真的存在。2019年，事件视界望远镜拍下了第一张黑洞照片。那个边界，就是用史瓦西半径描述的那条线。\n\n史瓦西在战壕里花了几个星期算出来的东西，人类用了一百年才真正看见它长什么样。\n\n## 他说过\n\n> 如你所见，尽管战争的炮火在四周肆虐，这片战场依然允许我从这些思想的国度里漫步其中，并做出这个发现。\n\n（此为史瓦西在寄给爱因斯坦的信中所写，1916年1月）\n\n<!-- 本卡由自动补写引擎生成，事实与引语请人工核对 -->\n", "field": "物理/天文"}, {"title": "他用一根扭丝，把地球放上了天平", "subtitle": "卡文迪许｜10月10日诞辰", "date": "10-10", "slug": "10-10-henry-cavendish", "file": "scientists/10/10-10-henry-cavendish.md", "content": "# 他用一根扭丝，把地球放上了天平\n\n## 卡文迪许｜10月10日诞辰\n\n1797年的某个深夜，英格兰克拉彭的一栋私宅里，一个老人趴在窗外，用望远镜盯着屋内一根细细的银色扭丝。他不能进去，因为他的脚步会带来震动，震动会毁掉整个实验。他就这样，在寒风里，等那根丝停止颤抖。\n\n## 他把自己锁在实验室外面，只为不打扰地球的重量\n\n约翰·米歇尔设计了这套装置，但没活着看到它完成。卡文迪许接手了这套仪器，并在1797年到1798年间，独自在一间专门搭建的小屋里完成了全部测量。\n\n装置的核心是一根悬挂的扭丝，两端各挂一个铅球。他把两个更大的铅球靠近小铅球，大球的引力会让扭丝微微转动。转动的角度极小，小到必须用望远镜从屋外读数，任何人走进屋内都会引入干扰。\n\n他做了17组测量，历时将近一年。每次调整，都要等扭丝重新静止，有时要等上好几个小时。他一个人，反复读数，反复记录。\n\n## 一个不爱说话的人，算出了牛顿没能算出的数\n\n卡文迪许极度回避人群。有记录说，他在皇家学会的聚会上，如果有陌生人走过来跟他搭话，他会直接转身走掉。他的管家接到命令，不得在走廊里与他对视。他把与女仆的沟通全部改成书面便条，只是为了不必开口说话。\n\n这样一个人，却在1798年发表了那篇论文，把牛顿万有引力定律里那个悬空了一百多年的常数G，第一次用实验填了进去。他没有直接说自己测出了G，他说他测出了地球的密度。但那是同一件事。\n\n他的结果是：地球的平均密度约为水的5.48倍。换算成今天的数值，相当于引力常数G约为6.74×10⁻¹¹立方米每千克每平方秒。现代测量值是6.674×10⁻¹¹，他的误差不到1%。\n\n## 他死后，那笔钱才开始说话\n\n卡文迪许去世时留下了约175万英镑的遗产，是当时英格兰最富有的人之一。他把大量财产捐给了科学机构，但他活着的时候，几乎没人知道他做了多少研究。\n\n他的手稿在他死后被束之高阁，直到1879年，麦克斯韦整理出版了他的电学研究笔记，学界才发现，卡文迪许早在18世纪就独立得出了欧姆定律、库仑定律的结论，只是从未发表。\n\n他不在乎发表。他做实验，记录结果，然后把笔记塞进抽屉。他的同时代人不知道他发现了什么，他本人似乎也不特别在意这件事。\n\n剑桥大学后来用他家族的名字命名了那座著名的物理实验室。那是1874年的事，距离他去世已经过去了64年。\n\n## 他说过\n\n> 「我的实验结果表明，地球的平均密度是水的5.48倍。」\n\n<!-- 本卡由自动补写引擎生成，事实与引语请人工核对 -->\n", "field": "物理/化学"}, {"title": "如果宇宙无限大，夜空为什么不是一片白光？", "subtitle": "奥伯斯佯谬｜10月11日事件", "date": "10-11", "slug": "10-11-", "file": "scientists/10/10-11-.md", "content": "# 如果宇宙无限大，夜空为什么不是一片白光？\n\n## 奥伯斯佯谬｜10月11日事件\n\n1823年，德国天文学家海因里希·奥伯斯坐在书桌前，盯着一张白纸。他要写的不是新发现，而是一个困扰他很久的问题：如果宇宙无限大、星星无限多，那么无论你朝哪个方向看，视线最终都会落在某颗恒星上。整片天空应该亮如白昼。可他推开窗，外面是漆黑的夜。这说不通。\n\n## 这个问题本来不是他第一个想到的\n\n奥伯斯不是第一个被这个问题困住的人。开普勒在1610年就注意到了它，英国天文学家哈雷在18世纪初也写过相关文章，瑞士天文学家德谢索在1744年甚至给出了相当接近现代答案的推理。但这个问题最终挂上了奥伯斯的名字，原因很简单：他在1823年把它写得足够清晰，足够让后人反复引用。\n\n他的推导逻辑本身是严格的。把宇宙想象成一层一层的球壳，每往外一层，星星的数量按距离平方增加，而每颗星的亮度按距离平方衰减。两者正好抵消。结论是：每一层球壳贡献的光量相同。无限多的球壳叠加，亮度应当是无限大。\n\n奥伯斯自己给出的解释是：星际空间存在某种吸收光线的物质。这个答案错了。后来的物理学指出，如果真有这样的介质，它迟早会被加热到与恒星一样的温度，然后自己发光，问题还是没解决。\n\n## 真正的答案藏在宇宙的年龄里\n\n这个佯谬真正的出路，直到20世纪才变得清晰。\n\n1929年，哈勃发现宇宙在膨胀。遥远的星系正在高速远离我们，它们发出的光被拉伸成红外线，甚至微波，人眼根本看不见。这是一部分原因。但更根本的一条是：宇宙有年龄。\n\n宇宙大约诞生于138亿年前。光速是有限的，所以我们能看到的宇宙有一个边界，叫「可观测宇宙」，半径约465亿光年。边界之外的光还没来得及到达我们这里。宇宙存在的时间不够长，还没有足够多的光填满夜空。\n\n换句话说，夜空是黑的，不是因为宇宙有边界，而是因为宇宙还太年轻。\n\n这个答案在1848年就被爱伦·坡在一篇散文《我发现了》（*Eureka*）里以诗人的直觉触碰到了。他写道：背景的黑暗，是因为宇宙的深度还不足以让光填满每一个方向。物理学家们用了将近一个世纪才追上这个直觉。\n\n## 一个问题比一个答案更有生命力\n\n奥伯斯本人是业余天文学家，职业是医生。他白天在不来梅出诊，夜里在自家屋顶架着望远镜观测。他发现了多颗小行星，计算过彗星轨道，但这些具体的发现都没有让他的名字活到今天。\n\n让他被记住的，是一个他自己没能解决的问题。\n\n「奥伯斯佯谬」这四个字现在出现在每一本宇宙学教材里，作为一道入门题。它的厉害之处在于：只需要肉眼看一眼夜空，再加上几行中学数学，你就能逼出宇宙膨胀和宇宙年龄这两个20世纪最重要的宇宙学结论。\n\n一个好问题，有时候比一百个答案更能推动科学往前走。\n\n<!-- 本卡由自动补写引擎生成，事实与引语请人工核对 -->\n", "field": "天文"}, {"title": "他用两把钥匙，分别打开了蛋白质和DNA的门", "subtitle": "桑格｜10月15日事件", "date": "10-15", "slug": "10-15-frederick-sanger", "file": "scientists/10/10-15-frederick-sanger.md", "content": "# 他用两把钥匙，分别打开了蛋白质和DNA的门\n\n## 桑格｜10月15日事件\n\n1958年的斯德哥尔摩，弗雷德里克·桑格第一次站上诺贝尔颁奖台。他拿到的是化学奖，理由是搞清楚了胰岛素的氨基酸序列。台下的人大概没想到，这个安静的英国人22年后还会再来一次，拿走第二块奖牌，理由换成了测定DNA序列的方法。两次，同一个人，同一个奖项。整个诺贝尔历史上，这只发生过四次。\n\n## 胰岛素不肯说话，他就一段一段地撬\n\n1943年，桑格加入剑桥大学的生物化学实验室，导师给了他一个题目：搞清楚胰岛素是什么。那时候科学界连蛋白质有没有固定结构都还在争，有人觉得蛋白质只是一团随机的化学物质，根本没有确切的序列可言。\n\n桑格不管这些争论，他直接动手。他用二硝基氟苯标记蛋白质链的末端，再用酸把胰岛素切成碎片，一段一段地分析。这个过程重复了将近十年。胰岛素分子量才5800道尔顿，在蛋白质里算极小的，但光是把51个氨基酸的排列顺序搞清楚，他就花了1951年到1955年整整四年做最后的拼图。\n\n结果出来了：蛋白质有确定的氨基酸序列，不是随机的。这个结论听起来简单，但它重新定义了整个分子生物学的起跑线。\n\n## 他在50岁时决定把方法再造一次\n\n拿了诺贝尔奖之后，很多人会守着已有的成就过日子。桑格没有。1960年代，他把目标转向了RNA和DNA的测序，这是比蛋白质更难啃的问题。\n\n他先花了几年时间摸索RNA的测序，方法繁琐，产出有限。真正的突破发生在1970年代中期。1977年，桑格发表了「双脱氧链终止法」，也就是后来被称为「桑格测序法」的那套方案。原理是在DNA复制过程中混入经过改造的核苷酸，这种核苷酸一旦被掺入，复制就停下来，由此产生一系列长度不同的片段，通过电泳读出序列。\n\n同年，他用这个方法测完了噬菌体φX174的全部基因组，共5375个碱基。这是人类第一次完整读出一个生命体的遗传信息。\n\n这套方法后来被放大、自动化，成为人类基因组计划的核心工具。1990年到2003年，30亿个碱基对的人类基因组，走的就是这条路。\n\n## 他说过\n\n> 科学研究在很大程度上是一种手工艺，需要通过实践来学习。\n\n桑格在1980年第二次获得诺贝尔化学奖后不久，选择从剑桥医学研究委员会分子生物学实验室退休，回家种花。他拒绝了爵士头衔，理由是不喜欢被人叫「弗雷德爵士」，觉得听起来别扭。\n\n他在2013年去世，享年95岁。实验室的工作台、凝胶电泳的图谱、几十年用坏的移液管，这些才是他真正留下的东西。\n\n<!-- 本卡由自动补写引擎生成，事实与引语请人工核对 -->\n", "field": "生物化学"}, {"title": "他们第一次让人在刀下睡着", "subtitle": "麻醉手术｜10月16日事件", "date": "10-16", "slug": "10-16-", "file": "scientists/10/10-16-.md", "content": "# 他们第一次让人在刀下睡着\n\n## 麻醉手术｜10月16日事件\n\n1846年10月16日，波士顿麻省总医院的手术剧场里，阶梯座位上挤满了医生和学生。他们来看的不是手术本身，而是一个牙医的承诺：人可以在毫无知觉的情况下被切开，然后活着醒来。这个承诺在当时听起来像是把戏。\n\n## 那个牙医把自己的名声押了进去\n\n威廉·莫顿（William T. G. Morton）在台上等待的时候，已经没有退路了。\n\n他在此之前做过无数次私下试验。他用乙醚让自己的狗失去意识，让牙科椅上的病人在不知痛的情况下拔掉牙齿。他知道这东西有用，但在一座挤满怀疑者的手术剧场里公开演示，是另一回事。\n\n主刀医生约翰·沃伦（John Collins Warren）已经等得不耐烦，冷冷说了一句话，大意是：你的魔术师在哪里？\n\n莫顿迟到了，因为他在赶制一套新的吸入装置，直到最后一刻才赶到。他让病人爱德华·阿博特（Edward Gilbert Abbott）吸入乙醚蒸气，几分钟后，阿博特沉沉睡去。沃伦拿起手术刀，在他颈部切开，切除了一个血管瘤。阿博特没有挣扎，没有喊叫。\n\n手术结束后，阿博特醒来，说感觉像是皮肤被划了一下。沃伦转向观众，说出了那句后来被反复引用的话：「先生们，这不是骗局。」\n\n## 胜利之后，他用余生去争那份荣誉，什么都没争到\n\n问题从手术成功的那一刻就开始了。\n\n莫顿想把乙醚的配方申请专利，他甚至给这种气体起了个商业名字，试图掩盖它的真实成分。化学家查尔斯·杰克逊（Charles T. Jackson）跳出来说，是他最先告诉莫顿乙醚可以用于麻醉的，功劳应该归他。与此同时，另一位牙医克劳福德·朗（Crawford W. Long）拿出了他早在1842年就用乙醚做手术的记录，说他才是第一人。\n\n三个人争了几十年。美国国会曾经讨论过给发现者颁发奖金，最后什么都没发，因为没人能裁定谁是真正的第一。\n\n莫顿把大量时间和金钱花在了游说和诉讼上。他的牙科诊所荒废了，财务状况越来越糟。1868年，他在纽约街头突然发病，死的时候49岁，几乎身无分文。\n\n他的墓碑上刻着一段话，是他的朋友们写的，大意是：他发现并向世界证明了吸入麻醉剂可以消除手术的疼痛，在他之前，手术是一种折磨，在他之后，科学征服了痛苦。\n\n但争议没有随着他的死亡结束。直到今天，医学史界对「第一个使用麻醉的人」仍然没有完全统一的说法。\n\n## 那一天被留下来，是因为有人选择了公开\n\n克劳福德·朗的手术发生在1842年，比莫顿早四年，记录也是真实的。但他没有发表，没有公开演示，只是在乡村诊所里悄悄用了几次，然后等了好几年才写成论文。\n\n10月16日之所以成为「乙醚日」，后来又被称为「世界麻醉日」，不是因为莫顿第一个想到了这件事，而是因为他第一个站在一屋子怀疑者面前，把它做给所有人看。\n\n公开，本身就是一种选择。而这个选择让他赢得了历史，却输掉了生活。\n\n## 他说过\n\n> 先生们，这不是骗局。\n\n——约翰·沃伦，1846年10月16日手术结束后（这句话通常被归于沃伦，是当天现场留存下来最可靠的引语）\n\n<!-- 本卡由自动补写引擎生成，事实与引语请人工核对 -->\n", "field": "医学"}, {"title": "那一天，城市里的灯光第一次由铀点亮", "subtitle": "核电厂商业运行｜10月17日事件", "date": "10-17", "slug": "10-17-", "file": "scientists/10/10-17-.md", "content": "# 那一天，城市里的灯光第一次由铀点亮\n\n## 核电厂商业运行｜10月17日事件\n\n1954年10月17日，苏联奥布宁斯克，一座外表朴素得像工厂仓库的建筑里，工程师们盯着仪表盘，等待一个数字稳定下来。反应堆功率：5兆瓦。这点电量放在今天，连一个小型购物中心都撑不住。但这是人类第一次把铀裂变产生的热，变成送进电网的电。外面的居民不知道发生了什么，灯还是那盏灯，亮度没有任何变化。\n\n## 从炸弹到电网，苏联工程师走了九年\n\n1945年广岛的蘑菇云让全世界知道了裂变的威力，但把同样的能量用来烧水、驱动涡轮，是一件完全不同的事。炸弹要的是瞬间失控，电站要的是永远不失控。\n\n苏联物理学家库尔恰托夫带领的团队从1945年开始研究反应堆，他们要解决的问题是：怎么让链式反应慢下来、稳下来，而不是快到爆炸。他们选择了石墨作为中子减速剂，用普通水冷却，把整个系统压缩进一个可以连续运行的结构里。这个选择后来被称为RBMK型反应堆的原型，但1954年的奥布宁斯克版本，比切尔诺贝利那台要小得多，也谨慎得多。\n\n整个建造过程在严格保密中进行。参与项目的工程师不能对家人提起自己在做什么，图纸分散保管，没有任何一个人能看到全貌。这种保密的代价是：出了问题，很难快速找到原因，因为知道完整系统的人太少了。\n\n## 5兆瓦，一个刻意被压低的数字\n\n奥布宁斯克核电站的设计功率是5兆瓦电功率，这个数字在当时其实是被刻意保守设定的。工程师们不确定长期运行会出现什么问题，所以宁可把功率压低，先跑起来，再慢慢观察。\n\n电站从1954年6月开始并网测试，到10月17日正式宣布商业运行，中间四个月的时间里，操作员们轮班守在控制台，每隔几小时记录一次数据，观察中子通量有没有异常波动，冷却水温度有没有偏离预期。有几次出现了意外的功率波动，团队紧急停堆检查，最后发现是燃料棒局部过热导致的形变。他们换掉了那批燃料棒，重新启动。\n\n这座电站一直运行到1959年，随后进行了多次升级改造，最终在2002年正式退役，服役将近半个世纪。\n\n## 它证明了可能，也埋下了一个问题\n\n奥布宁斯克之后，英国、美国、法国相继建起自己的商业核电站，全球核电装机容量在1960至1970年代急速攀升。到2020年代，全球约有440座核反应堆在运行，提供了全球约10%的电力。\n\n但奥布宁斯克真正留下的遗产是一个还没有完全解决的问题：核废料放在哪里。1954年的工程师们知道乏燃料会产生高强度辐射，他们把它暂时储存在电站附近的水池里，等待「以后」的人想出办法。\n\n七十年过去了，「以后」还没有完全到来。全球核电站产生的高放射性废料，大多数仍然储存在临时设施里，等待一个深地质处置库的最终答案。芬兰的奥尔基卢奥托正在建造人类第一座永久核废料地下储存库，预计2025年前后开始接收废料。\n\n1954年点亮奥布宁斯克的那批铀，分裂时释放的能量已经散进了苏联的电网。但它留下的另一部分，还在某个储存池的水下，安静地衰变，等待一个没人说得准的未来。\n\n<!-- 本卡由自动补写引擎生成，事实与引语请人工核对 -->\n", "field": "核能"}, {"title": "世界不是伴着巨响结束的", "subtitle": "钱德拉塞卡｜10月19日诞辰", "date": "10-19", "slug": "10-19-chandrasekhar", "file": "scientists/10/10-19-chandrasekhar.md", "content": "# 世界不是伴着巨响结束的\n\n## 钱德拉塞卡｜10月19日诞辰\n\n1930 年夏天，一艘从印度开往英国的轮船上，一个年轻人半夜走上甲板。头顶是密密麻麻的星，他要去剑桥读博士。书上说，所有恒星烧完燃料后，归宿都一样：塌缩成一颗白矮星，安静地熄灭。\n\n可那天晚上，他盯着星空，算出了一个书本上没有的答案。他怀里抱着一本天文学权威爱丁顿的书，那是他在印度参加物理竞赛赢的奖品。他盘算着到了剑桥，一定要找机会当面请教这位老先生。\n\n## 一个没人要的答案\n\n他学得快，三年读完博士，成了三一学院研究员，也如愿认识了爱丁顿。1935 年 1 月，皇家天文学会的会场，他要把自己多年的心血当众宣读：一颗质量超过太阳 1.44 倍的恒星，不会停在那里当白矮星，它会在自己的引力下继续塌缩，缩到半径只剩几公里。\n\n在 1935 年，这说法近乎妖言惑众。那几公里，今天有个名字叫黑洞。\n\n## 晚宴上那只神秘的笑容\n\n会议的种种都准备好了。会前他突然发现，爱丁顿的演讲排在他后面，题目一模一样。可这几个月他几乎每周都和爱丁顿见面，从没听对方提起过一个字。晚宴上他想问，张了张嘴又咽回去。爱丁顿倒是带着一种神秘的笑，鼓励他第二天畅所欲言。\n\n第二天，他战战兢兢读完论文。接着爱丁顿上台，把他那套理论批得一文不值：他相信一定有条自然法则，会阻止恒星按钱德拉塞卡那种荒谬的方式演化。说完，当着所有人的面，把论文撕成两半。笑声轰然而起。\n\n很多年后他依然记得自己当时脱口而出的话：世界就是这样结束的，不是伴着一声巨响，而是伴着一声呜咽。\n\n## 一场迟到了三十年的欢呼\n\n天文学界的最高权威敲下了锤子，这个话题从此没人敢碰。他那个大胆的答案，被雪藏了三十多年，直到天文学家发现脉冲星，确认中子星真的存在，才被翻出来郑重对待。1.44 倍太阳质量，被写进每一本教科书，叫钱德拉塞卡极限。1983 年，他拿到诺贝尔物理学奖，这时离船上那个夜晚，已经过了半个多世纪。他去世四年后，以他命名的钱德拉 X 射线太空望远镜升空，传回大量黑洞观测数据。\n\n当年他不得不放弃黑洞研究，远走芝加哥。晚年他终于回头，隔着岁月看那场羞辱，说得异常平静。\n\n## 他说过\n\n> 如果爱丁顿当时承认了黑洞理论，黑洞的许多性质将会提前二三十年被发现，这对天文学是有益的。但我不认为对我个人有益。赞美会根本改变我的地位，我确实不知道，在那份诱惑面前我会怎么样。毕竟，有多少年轻人在功成名就之后，还能长久保有青春活力呢？\n\n参考：PanSci《科学史上的今天》〈钱德拉塞卡诞辰〉（本地素材：source_texts/10-19-钱德拉塞卡.txt）\n", "field": "天体物理"}, {"title": "别哭，我需要全部的勇气", "subtitle": "伽罗瓦｜10月25日诞辰", "date": "10-25", "slug": "10-25-galois", "file": "scientists/10/10-25-galois.md", "content": "# 别哭，我需要全部的勇气\n\n## 伽罗瓦｜10月25日诞辰\n\n1832 年 5 月 31 日，巴黎郊外的清晨，一个二十岁的年轻人捂着腹部倒在地上。前一天他与人决斗，腹部中了一枪。临死前，他转过头对守在身边的弟弟说：别哭，阿弗莱德，我需要全部的勇气，才能在二十岁死去。第二天，他就走了。\n\n他叫伽罗瓦，死的时候，手里攥着一整套当时整个数学界都读不懂的思想。\n\n## 一个没能进名校的少年\n\n伽罗瓦在家受启蒙，中学时代换了个新数学老师，才开始对数学着迷。那阵子，另一位数学天才阿贝尔也正在巴黎，两个世纪级的头脑只隔着几公里，半年里始终没有碰面。有些遗憾，是历史替他留下的。\n\n他那时已开始啃数学经典原著，高中就敢去挑战五次方程式的公式解。自己试出来的解法发现有错，他没退缩，反而下了更狠的决心：这一题，非解开不可。\n\n## 他造出了一个数学里没有的词\n\n阿贝尔已经证明，五次方程没有通用的简单公式解。但「没有通用解」不代表「每个都解不了」，欧拉等人就找出过一些特殊类型的公式解。伽罗瓦盯上了更狠的问题：怎么判断任意一个五次方程，到底有没有公式解？\n\n他没有沿着旧路走，而是自己发明了一个全新的概念——群。诀窍在对称性：把方程的根互相置换，看结果变不变。在他的眼里，方程不再按几次方分家，而是按「能保持对称的置换有几种」来分。用置换群、子群一通运算，五次以及更高次方程的判别问题，被他干净利落地解决。\n\n后世数学家看到这套东西，几乎不敢相信出自一个高中生之手，说它足以媲美广义相对论。\n\n## 命运在塌方\n\n可这个天才的少年，人生在现实里一路塌方。考巴黎综合理工，口试惨败；两篇论文先后寄给科学院，石沉大海；第二年，父亲被保守派逼到自杀，他还是没考上，只能去管理严格的师范学院。\n\n亲眼见过这些不公，他成了激进的共和派，跟保守派的校长针锋相对。1831 年初，他被学校除名，干脆加入了主张推翻政权的共和派军队，为此两度入狱。\n\n## 最后一夜，三封信\n\n他没死在狱中。出狱后，一场决斗找上门来。起因是谁，对手是谁，至今没有定论，只知道他极不情愿。\n\n决斗前夜，他像是预见了结局，写了三封遗书，其中一封里夹着三篇论文。他简述了内容，在末尾用潦草的字迹写道：可是我……没有时间了，而对那个浩瀚的领域，我还有些不成熟的想法。\n\n第二天早上，他死在决斗场上。那三篇急就章，后来被人整理成伽罗瓦理论，成了群论的源头，又一路长成粒子物理标准模型与超弦理论的地基。他临死前说「不成熟」的那些想法，至今仍在被后人一遍遍开采。\n\n## 他说过\n\n> 别哭，阿弗莱德！我需要全部的勇气，才能在二十岁死去。\n\n参考：PanSci《科学史上的今天》〈伽罗瓦诞辰〉（本地素材：source_texts/10-25-伽罗瓦.txt）\n", "field": "数学"}, {"title": "她把自己也搭了进去", "subtitle": "玛丽·居里｜11月7日诞辰", "date": "11-07", "slug": "11-07-curie", "file": "scientists/11/11-07-curie.md", "content": "# 她把自己也搭了进去\n\n## 玛丽·居里｜11月7日诞辰\n\n一张一百多年前的老照片，玛丽·居里站在实验室里，围裙上沾着灰尘，眼睛盯着手里的试管。她的目光里没有一丝笑意，只有一种接近固执的专注。看照片的人很难想象，这个沉默的女人，是人类历史上第一个拿两次诺贝尔奖的人——而且是物理、化学两个不同领域各拿一次，至今无人复制。\n\n但照片里没有笑，或许因为她的路，从来都不是一条被祝福的路。\n\n## 六年的家庭教师，换一张大学的入场券\n\n1867 年，玛丽·斯克沃多夫斯卡出生在波兰华沙。她的母亲在她出生后不久感染了肺结核，为了不传染给女儿，刻意与她保持距离。玛丽一辈子没怎么得到过母亲的拥抱。11 岁那年母亲病逝，三年之前，她刚目睹大姊死于伤寒。\n\n命运没有打算放过她。当时华沙被俄国占领，女人不许上大学。家里穷，也供不起她出国。于是她跟二姊立了个约定：她先去当家庭教师赚钱，供二姊去巴黎读医学院；等二姊毕业了，再回头资助她读大学。\n\n这一等，就是六年。她当了六年家庭教师，白天教课，夜里自学。24 岁那年，她终于攒够钱去了巴黎。六年的中断没有摧毁她——她只花两年就拿到了物理学学位，又用一年拿下了数学学位。\n\n1894 年，她遇见了一个叫皮埃尔·居里的年轻人。第二年，他们结婚。她从此成为玛丽·居里。\n\n## 从沥青里，刨出两种新元素\n\n1896 年，法国物理学家贝克勒发现铀盐能发出一种神秘射线。居里夫妇决定搞清楚：这射线到底从哪来。\n\n答案不是查资料查出来的，是刨出来的。他们买来成吨的沥青铀矿，在一个漏雨的棚屋里，日复一日地煮沸、过滤、沉淀、结晶。那是世界上最笨重的实验——没有助手，没有资金，只有两口大锅和一个不断欠债的家。皮埃尔后来写道，那几年他们「像牛马一样工作」。\n\n两年多以后，他们从几吨矿石里，刨出了两种全新元素。一种命名为钋，纪念她的祖国波兰；一种命名为镭。更重要的发现是：辐射来自原子本身，而不是来自什么化学变化。世界第一次知道，原子内部藏着一座随时可能释放能量的火山。\n\n1903 年，他们与贝克勒共同获得诺贝尔物理学奖。\n\n## 丈夫去世后，她一个人把镭提了出来\n\n那是她人生里最好的两年半：功成名就，家庭圆满，经济宽裕。然后，1906 年 4 月的一天，皮埃尔过马路时被一辆马车撞死。\n\n玛丽·居里没有停下来。她接下了丈夫在索邦大学的教席——成为法国第一位女教授——继续做一件所有人都觉得不可能的事：把镭从化合物里分离出纯金属。因为当时的科学界还在质疑：你发现的镭，真的是元素吗？\n\n她又用了四年，在丈夫留下的实验室里，一个人完成了分离。1911 年，她独自获得诺贝尔化学奖。\n\n## 她把生命也献给了放射线\n\n一战爆发时，她组装了一批 X 光车开往前线，为医生诊断伤员提供设备。那时的她并不知道，自己研究了一辈子的辐射，正在慢慢杀死自己。\n\n她做实验从不做防护——没有人警告过她。数十年接触放射性物质，让她视力严重受损、血液病变，直到 1934 年 7 月 4 日，她在病床上停止了呼吸，享年 66 岁。她没来得及看到第二年，长女伊雷娜和女婿也一起获得诺贝尔化学奖——居里家族成为科学史上最传奇的家族。\n\n她研究辐射，被辐射照亮，最后也被辐射带走。她的笔记本到今天仍然带有放射性，被锁在铅盒里，需要穿防护服才能翻阅。\n\n## 他说过\n\n> 没有什么值得惧怕的，只有需要去理解的东西。现在该增加理解的，是更多的东西。\n", "field": "物理/化学"}, {"title": "漂流四万年的瓶中信", "subtitle": "卡尔·萨根｜11月9日诞辰", "date": "11-09", "slug": "11-09-sagan", "file": "scientists/11/11-09-sagan.md", "content": "# 漂流四万年的瓶中信\n\n## 卡尔·萨根｜11月9日诞辰\n\n2013 年，航海家一号正式飞出了太阳系。此后它每年前进 5.4 亿公里，扑向未知的星际空间。如果一切顺利，四万年后它会抵达 17.6 光年外的 Gliese 445，下一个行星系。\n\n它身上戴着一块金唱片。里面收着不同民族的问候语和音乐，收着大自然与动物的声音，收着人类生命的图像和地球的位置。那是我们投进宇宙大海的一封瓶中信，赌有一天，某个路过的外星文明会把它捞起来，读懂上面的信息，知道宇宙里曾经有过我们。\n\n这样的瓶子其实一共有四封，分别搭着航海家二号、先锋十号、先锋十一号，朝着不同方向漂。而出这个主意的人，正是美国天文学家卡尔·萨根。\n\n## 地面上，还有一群听了三十年的人\n\n就在瓶子漂流的同时，萨根还推动了另一件事。SETI，也就是搜寻地外智慧生命计划，用地面的无线电望远镜，听了整整三十年的太空，就盼着哪一天，电波里混进一个来自其他文明的信号。\n\n他深信我们并不孤单。亿万颗星球之间，不可能只有地球这一盏灯亮着。\n\n## 一个认真的怀疑者\n\n但萨根绝不是只会幻想外星人的人。他骨子里是怀疑论者，那句被说烂了的「超乎寻常的主张，需要超乎寻常的证据」，正是他在节目里反复念叨，才传遍世界的。\n\n当美国民众相信金星上气候宜人、住着金星人，他第一个站出来：金星表面又干又热，人根本待不住。对那些信誓旦旦说见过飞碟的，他从不留情面，一句「一派胡言」打发掉。\n\n一个人越是渴望宇宙里不孤单，就越要先学会对证据斤斤计较。\n\n## 五亿人看过的宇宙\n\n萨根写了二十多部著作，发表过六百多篇论文与文章。1980 年，他制作并主持的电视节目《宇宙》开播，先后在六十多个国家播出，观众超过五亿。\n\n他讲宇宙，从来不只为讲知识。从星球到恒星到银河，他层层讲下去，落到最后总是一个问题：人类，你这个宇宙尘埃里的小点，你到底是谁？在他眼里，寻找外星文明就是探索宇宙，也是探索人类这个物种在宇宙里的自我定位。人越是抬头看星空，越该低头重新认识自己。\n\n多年以后，那封金唱片还在飞。四万年，是一代人的文明听不见的距离。但萨根大概从没怀疑过一件事：该把它投出去。\n\n## 他说过\n\n> 我们身在宇宙之中，就像漂浮在尘埃里的一颗微粒。而我相信，人类的未来会如何，端看我们对宇宙的了解有多透彻。\n\n参考：PanSci《科学史上的今天》〈卡尔·萨根诞辰〉（本地素材：source_texts/11-09-卡尔·萨根.txt）\n", "field": "天文/科普"}, {"title": "一次测不准的会面", "subtitle": "海森堡｜12月5日诞辰", "date": "12-05", "slug": "12-05-heisenberg", "file": "scientists/12/12-05-heisenberg.md", "content": "# 一次测不准的会面\n\n## 海森堡｜12月5日诞辰\n\n1941 年 9 月，纳粹德国占领丹麦已经快一年半。德国物理学家海森堡踏进哥本哈根大学的校园，来见玻尔。\n\n这个校园他太熟了，十九年前，他在这里度过了改变一生的一年。可这次不一样。此刻的海森堡，是德国原子弹计划的负责人，而玻尔，多半已经对他失望透顶。会面结束，海森堡沮丧地告辞，心里清楚，那位亦师亦友的老先生，从此跟自己恩断义绝。\n\n## 改变一生的一学年\n\n十九年前，海森堡还是个博士生，跟着老师去哥廷根听玻尔讲学，就此结识了这位物理巨擘。他给玻尔留下的印象显然不错，两年后，玻尔专程通知他，有一笔奖学金，可以来哥本哈根接受他一年的指导。\n\n就是这一学年。海森堡把玻尔的氢原子模型翻来覆去地想：教科书说电子像行星一样，沿特定轨道绕行，可轨道到底多宽、存不存在，谁也没见过。人能观测到的，只有电子跃迁前后的能量差，以及发出的电磁波频率。他干脆主张：把行星轨道这种假设扔掉，只用观测到的能量和频率来描述粒子。\n\n回到德国，在玻恩和约尔丹的帮助下，1925 年，他用矩阵把这一套算了出来。矩阵力学诞生，量子力学正式开张。\n\n## 玻尔浇下来的那盆冷水\n\n第二年，玻尔力邀他来哥本哈根讲课、做助理。1927 年，他抛出更让古典物理坐不住的东西，测不准原理：粒子的位置和动量，不可能同时被确定。\n\n他讲得很通俗：想知道位置，就得用更短波长的光去照，波长越短能量越大，越会撞乱粒子的动量，所以永远顾此失彼。玻尔却给他当头一棒：你这个说法，等于承认粒子本来有位置、有动量，只是量不出来，这还是古典物理的老脑筋。真相是，粒子本来就没有什么精确的位置和速度。\n\n海森堡豁然开朗：不确定性不是测量的误差，而是万物的本质。问客观事实是什么毫无意义，只有观测者量到的结果才有意义。从此它改名「不确定性原理」，成为哥本哈根学派的地基，他和玻尔并列为学派的创立者。1932 年，他拿到诺贝尔物理学奖，前途一片光明，直到纳粹崛起。\n\n## 留下的人\n\n纳粹上台后，他的科学家朋友们各奔东西：有的为保命，有的不愿给纳粹卖命。海森堡却出于爱国情结留了下来，后来还接受征召，主持了德国原子弹计划。为此，许多科学家唾弃他，其中就有玻尔。\n\n他 1941 年飞去丹麦，为的就是当面解释。但玻尔不接受，从此再没有见他。那场谈话的具体内容，两人都没有多说。海森堡是来向玻尔讨教、突破原子弹的研发瓶颈？还是来告诉玻尔「我绝不会让原子弹成功」，求一份谅解？到今天，科学家和历史学家仍然各执一词。\n\n一桩悬案，像极了他最著名的原理：有些真相，也许永远测不准。\n\n参考：PanSci《科学史上的今天》〈海森堡诞辰〉（本地素材：source_texts/12-05-海森堡.txt）\n", "field": "物理"}, {"title": "机器还没造出来，程序已经写好了", "subtitle": "爱达·勒芙蕾丝｜12月10日诞辰", "date": "12-10", "slug": "12-10-lovelace", "file": "scientists/12/12-10-lovelace.md", "content": "# 机器还没造出来，程序已经写好了\n\n## 爱达·勒芙蕾丝｜12月10日诞辰\n\n2014 年 12 月 8 日，美国总统奥巴马在镜头前现学现写，用 JavaScript 在屏幕上画了一个色块，成了史上第一位写代码的美国总统。编程，就这样成了我们这个时代最显赫的本事。\n\n可全世界第一个写出程序的人，比这场秀早了一百多年。她叫爱达·勒芙蕾丝，一位两百年前出生的英国女性，一辈子没进过大学。\n\n## 一台永远没完工的机器\n\n故事得从一台造不出来的机器说起。1822 年，英国发明家巴贝奇设计了差分机：全凭齿轮带动，反复计算多项式的差值，再反推出函数的近似值。用机器代替人力算数，省时间，还不会出错。可这台机器要用两万多个零件，每个都得磨到极高精度，做了十年，只完成七分之一。资助它的英国政府终于没了耐心，断了钱。\n\n巴贝奇的梦没有死，因为他遇见了爱达。\n\n## 拜伦的女儿，从没见过父亲\n\n爱达本来姓拜伦，对，就是诗人拜伦的女儿。可她从没见过父亲。母亲在她出生后不久，就受够了拜伦的喜怒无常和不负责任，带着她离开。她遗传了母亲的数学天赋，从小显露头角。\n\n十七岁那年，爱达在巴贝奇那里看到差分机的半成品，当场就被吸住了。两人开始密集通信，讨论这台机器的未来。巴贝奇从她的信里得到灵感，决定设计一台更强大的「分析机」。\n\n## 两万字的一篇注脚\n\n巴贝奇构想的分析机，用蒸汽驱动，用打孔纸带输入不同的程序，还有存放数据的寄存器，说白了，这就是现代电脑的雏形。为了拉资金，巴贝奇跑到欧陆宣讲。一位意大利数学家把他的构想写成一篇八千字的法文报告，介绍给欧洲科学界。\n\n爱达把这份报告翻译成英文，然后在译文里加上自己的注解。结果，注解比原文还长，整本变成两万字的小书。就在注解里，她做了一件惊人的事：为了让分析机算出一串无限数列，也就是伯努利数，她一个步骤一个步骤地写下了指令。这些指令一环扣一环，会自己循环算下去。\n\n这就是程序。后人说，世界上第一支计算机程序，写在一个从未运行过的机器上，出自一位从未上过大学的女性之手。\n\n## 从未运行，却写进了历史\n\n分析机最终因为太过庞大复杂，从来没有被造出来，那两万字也就只能躺在纸上。可爱达依然被公认为第一位程序员。\n\n在那个女性进不了大学的时代，她是两个孩子的母亲，靠书信和自学，把别人想都不敢想的东西想清楚了。可惜她的人生太短：三十七岁患上宫颈癌，医生用当时流行的放血疗法给她治病，结果失血过多，要了她的命。\n\n她写下的程序，注定跑不了，因为那台机器从来不存在。可她的眼光比机器早了一百多年：机械不只是用来算数，它可以按人给的一串指令，自己一步步走完全程。这正是后来所有电脑在做的事。\n\n参考：PanSci《科学史上的今天》〈爱达·勒芙蕾丝诞辰〉（本地素材：source_texts/12-10-爱达·勒芙蕾丝.txt）\n", "field": "计算机"}, {"title": "七十个圆，一条椭圆", "subtitle": "开普勒｜12月27日诞辰", "date": "12-27", "slug": "12-27-kepler", "file": "scientists/12/12-27-kepler.md", "content": "# 七十个圆，一条椭圆\n\n## 开普勒｜12月27日诞辰\n\n1577 年，一颗明亮的彗星突然划破欧洲的夜空。德国有个六岁的小男孩，在母亲的指引下仰头看那颗星。与此同时，丹麦的天文学家第谷，正把望远镜对准同一个方向。两个素不相识的人，视线在一颗彗星上相遇。他们谁也不知道：二十三年后，他们的人生轨道也将短暂叠合，而人类看清宇宙的方式，将从此改变。\n\n那个小男孩，就是开普勒。\n\n## 用正多面体搭宇宙的人\n\n开普勒研究星星，是为了更了解上帝。只是他心里的上帝，跟教会讲的不太一样，他笃信哥白尼的日心说。二十五岁那年，他出版《宇宙的奥秘》：太阳在中心，当时已知的六大行星绕行，它们的轨道是六个嵌套的圆球，而这些圆球之间，恰好能严丝合缝地放进五种正多面体，一层套一层。他相信，完美对称的几何，才是上帝给宇宙的礼物。\n\n他把这本书寄给了第谷。第谷回了信，邀请他去布拉格新建的天文台。\n\n## 捂得最紧的一抽屉数据\n\n开普勒求之不得，因为第谷手里握着全世界最丰富、最精确的观星资料。但他到了布拉格才发现，第谷把这批数据看得比命还重，处处设防。直到第二年第谷病逝，那些记录才全部落到开普勒手上。\n\n于是，整个宇宙的秘密，在一堆堆数字里等着他去翻。\n\n## 七十个圆，一条椭圆\n\n开普勒一开始也戴着「圆才配得上上帝」的枷锁。他对着火星，先后试了七十种圆形轨道，拿去和第谷的数据比对，没有一种对得上。\n\n他终于醒悟：答案不是圆，是椭圆。1609 年，他发表了行星运动的前两条定律：行星沿椭圆轨道绕太阳运行，太阳位于椭圆的一个焦点；行星与太阳的连线，在相同时间里扫过相同的面积，所以行星离太阳远时走得慢，近时走得快。他又埋头十年，找到了第三条：公转周期的平方，等于椭圆轨道半长轴的立方。人类第一次，用一条简洁的数学公式，精确描述了大自然的运行。\n\n## 被磨坏的人生\n\n他小时候感染天花，视力和双手都受了损，按说根本不适合研究天文。可他就是凭一股劲，独自一人，前前后后花了十八年，从第谷积累的二十年观测数据里，把三条定律一点点抠出来。\n\n而他的命，一直很苦。挚友被人谋杀，六岁的儿子死于天花，妻子死于伤寒，母亲被诬为女巫、受尽拷打。他站出来为母亲辩护，把人救了出来，母亲却在半年后也去世了。可就是这样一个人，依然相信上帝打造的世界拥有和谐之美。\n\n他晚年流离失所，病死在异乡。但愿他闭上眼睛的那一刻，心里还抱着那句话。\n\n## 他说过\n\n> 让我们蔑视回荡在这片高贵土地上的野蛮叫嚣，重新唤起我们对和谐的了解与期盼。\n\n参考：PanSci《科学史上的今天》〈开普勒诞辰〉（本地素材：source_texts/12-27-开普勒.txt）\n", "field": "天文"}, {"title": "电脑搬进神殿的那年夏天", "subtitle": "冯·诺依曼｜12月28日诞辰", "date": "12-28", "slug": "12-28-von-neumann", "file": "scientists/12/12-28-von-neumann.md", "content": "# 电脑搬进神殿的那年夏天\n\n## 冯·诺依曼｜12月28日诞辰\n\n1946 年 6 月，一堆机械和金属零件陆续运进普林斯顿高等研究院，经过一楼爱因斯坦的办公室，搬进地下室。院里的学者们看着，直皱眉头。这里是让人安静思考的圣地，爱因斯坦这样的天才，只需要纸笔和黑板，搞台电脑进来，算怎么回事？\n\n话是这么说。可提出要造这台电脑的，是建院时和爱因斯坦一起被请来的四位教授之一。再说了，谁能拒绝冯·诺依曼？\n\n## 被误认成研究生的天才\n\n他不是靠资历压人。那年他不过四十出头，当年刚出现在研究院时，还被人误认成研究生。他只是天赋太吓人：六岁能心算八位数除法，八岁就会微积分；过目不忘，读过的书全记得，连电话簿都能背下来；别人向他请教，他五分钟内抓住问题关键，见解常常比提问者还深。\n\n二十二岁，他拿到数学博士，去柏林大学任教，成了这所学校有史以来最年轻的教授，三年发表了三十二篇数学论文。而在四十岁之前，他已经把好几门学问都趟了一遍：用希尔伯特空间证明矩阵力学与波动方程等价，给刚出生的量子力学铺上严谨的数学骨架；又把数学系统地搬进经济学，给赛局理论立起第一套模型，后世尊他「赛局理论之父」。\n\n## 一台让他昏倒的机器\n\n好吧，物理和经济学再怎么说都沾着数学的边。那电脑呢？\n\n1944 年 8 月，冯·诺依曼听说军方正在造世界第一台通用电脑 ENIAC，兴冲冲跑去看。结果差点昏倒：机器又大又费电不说，每次换一个程序，要重新设上千个开关、插拔上百条电缆。他回去动了动脑，第二年就发表了一篇里程碑论文：把电脑的硬件分成五大组件，同时定义了软件的逻辑结构。现代电脑的基本架构，就这么定了下来。于是他的头衔里，又多了一个「电脑之父」。\n\n## 从不纸上谈兵\n\n冯·诺依曼显然不想只写论文。他坚持让学校真把电脑造出来，这正是 1946 年那批零件搬进地下室的原因。而在他找来的同事赶工的时候，他又把兴趣转向了一个更疯狂的方向：自我复制的机器。\n\n他设想：一台机器从漂浮的零件堆里挑出合适的零件，拼出和自己一样的硬件，再把自己的软件拷进后代，于是每个后代都能再复制自己，数目按指数疯长。四年之后，华生和克里克揭开了 DNA 的秘密，生命繁衍的方法，跟他构想的竟然不谋而合。也就是说，这个数学家在造计算机的空当，顺手把生命的复制原理提前想了一遍。\n\n可惜他走得太早。五十三岁，骨癌。化疗期间，他正在研究怎么让电脑学会人脑的思考方式。要是没有病魔，也许他的名字后面，又要多挂一个「某之父」的头衔了。\n\n参考：PanSci《科学史上的今天》〈冯·诺依曼诞辰〉（本地素材：source_texts/12-28-冯·诺依曼.txt）\n", "field": "计算机/数学"}]
</script>

<script>
const ARTICLES = JSON.parse(document.getElementById('articles-data').textContent);
const POOL = JSON.parse(document.getElementById('pool-data').textContent);
const FIELDS = ["AI", "人类学", "信息论", "化学", "医学", "发明", "哲学", "地理", "天体物理", "天体生物", "天文", "宇宙学", "工程", "心理学", "数学", "文化交流", "核能", "物理", "生物", "生物化学", "生理", "神经科学", "科学", "科技", "航天", "计算机"];

document.getElementById('stat-n').textContent = ARTICLES.length;
document.getElementById('stat-f').textContent = FIELDS.length;
document.getElementById('stat-m').textContent = new Set(ARTICLES.map(a=>a.date.slice(0,2))).size;

/* ---------- 今日科学家 ---------- */
function todayString() {
  const d = new Date();
  return ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function renderToday() {
  const t = todayString();
  const a = ARTICLES.find(x => x.date === t);
  const el = document.getElementById('today-content');
  const kicker = document.getElementById('today-kicker');
  if (a) {
    kicker.textContent = '今天 · ' + a.date.slice(0,2) + '月' + a.date.slice(3) + '日';
    el.innerHTML = `<div class="today-card today-done" data-slug="${a.slug}">
      <div class="today-left">
        <p class="today-name">${esc(a.subtitle.split('｜')[0])}</p>
        <h3>${esc(a.title)}</h3>
        <p class="today-desc">${esc(a.subtitle)}</p>
        <span class="today-cta">点开，读他的一生 →</span>
      </div>
      <div class="today-right">
        <span class="today-bigdate">${a.date.slice(3)}</span>
        <span class="today-month">${a.date.slice(0,2)}月</span>
      </div>
    </div>`;
    el.querySelector('.today-card').onclick = () => openArticle(a.slug);
  } else {
    const p = POOL.find(x => x.date === t.replace('-','/'));
    kicker.textContent = '今天 · ' + aDateCN(t);
    if (p) {
      const ty = {'birth':'诞辰','death':'忌日','event':'事件'}[p.type] || '';
      el.innerHTML = `<div class="today-card today-preview">
        <div class="today-left">
          <p class="today-name">${esc(p.person)}</p>
          <h3>${esc(p.one_line)}</h3>
          <p class="today-desc">${esc(p.field)} · ${ty}</p>
          <span class="today-cta muted">今天这篇还在写，明天见</span>
        </div>
        <div class="today-right">
          <span class="today-bigdate">${t.slice(3)}</span>
          <span class="today-month">${t.slice(0,2)}月</span>
        </div>
      </div>`;
    } else {
      el.innerHTML = `<div class="today-card today-preview">
        <div class="today-left"><p class="today-name">今天</p><h3>没有特别的日子</h3>
        <p class="today-desc">但科学每天都在发生</p></div>
        <div class="today-right"><span class="today-bigdate">${t.slice(3)}</span><span class="today-month">${t.slice(0,2)}月</span></div>
      </div>`;
    }
  }
}
function aDateCN(t) { return t.slice(0,2) + '月' + t.slice(3) + '日'; }
renderToday();

/* ---------- 名人堂 ---------- */
const HALL = [
  "01-04","02-12","03-14","04-15","05-11","06-23","07-10","08-26","09-22","10-25","11-07","12-27"
];
function renderHall() {
  const grid = document.getElementById('hall-grid');
  const people = HALL.map(d => ARTICLES.find(x => x.date === d)).filter(Boolean);
  grid.innerHTML = people.map((a,i) => {
    const name = a.subtitle.split('｜')[0];
    return `<article class="hall-card" data-slug="${a.slug}" style="--n:${i+1}">
      <span class="hall-num">0${i+1}</span>
      <h3>${esc(name)}</h3>
      <p>${esc(a.title)}</p>
      <span class="hall-date">${a.date.slice(0,2)}月${a.date.slice(3)}日</span>
    </article>`;
  }).join('');
  grid.querySelectorAll('.hall-card').forEach(c => c.onclick = () => openArticle(c.dataset.slug));
}
renderHall();

const nav = document.getElementById('field-nav');
const allBtn = document.createElement('button');
allBtn.textContent = '全部';
allBtn.className = 'active';
allBtn.onclick = () => render();
nav.appendChild(allBtn);
FIELDS.forEach(f => {
  const b = document.createElement('button');
  b.textContent = f;
  b.onclick = () => render(f);
  nav.appendChild(b);
});

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function mdToHtml(text) {
  const lines = text.split('\n');
  let out = [];
  for (let ln of lines) {
    if (ln.startsWith('# ')) continue;
    if (ln.startsWith('## ')) { out.push('<h3>' + esc(ln.slice(3)) + '</h3>'); }
    else if (ln.startsWith('> ')) { out.push('<blockquote>' + esc(ln.slice(2)) + '</blockquote>'); }
    else if (ln.trim() === '') { out.push('<br>'); }
    else if (ln.startsWith('参考')) { }
    else { out.push('<p>' + esc(ln) + '</p>'); }
  }
  return out.join('\n');
}

function render(field) {
  const gal = document.getElementById('gallery');
  const list = ARTICLES.filter(a => !field || a.field.split('/')[0] === field);
  let months = {};
  list.forEach(a => {
    const mm = a.date.slice(0,2);
    (months[mm] = months[mm] || []).push(a);
  });
  const mmKeys = Object.keys(months).sort();
  gal.innerHTML = mmKeys.map(mm => {
    const cards = months[mm].map(a => {
      return `<article class="card" data-slug="${a.slug}">
        <div class="card-date">${a.date.slice(5)}</div>
        <h2>${esc(a.title)}</h2>
        <p class="card-sub">${esc(a.subtitle)}</p>
        <span class="tag">${esc(a.field)}</span>
      </article>`;
    }).join('');
    return `<section class="month" id="m${mm}"><h2 class="month-head">${mm} 月</h2><div class="cards">${cards}</div></section>`;
  }).join('');
  gal.querySelectorAll('.card').forEach(c => c.onclick = () => openArticle(c.dataset.slug));
}

function openArticle(slug) {
  const a = ARTICLES.find(x => x.slug === slug);
  if (!a) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const color = 'var(--ink)';
  overlay.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <button class="close">×</button>
    <p class="modal-date">${a.date}</p>
    <h1>${esc(a.title)}</h1>
    <h2 class="modal-sub">${esc(a.subtitle)}</h2>
    <div class="modal-body">${mdToHtml(a.content)}</div>
  </div>`;
  overlay.onclick = () => overlay.remove();
  overlay.querySelector('.close').onclick = () => overlay.remove();
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

render();
</script>
