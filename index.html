[{"title": "一个不肯开口的天才", "subtitle": "牛顿｜1月4日诞辰", "date": "01-04", "slug": "01-04-newton", "file": "scientists/01/01-04-newton.md", "content": "# 一个不肯开口的天才\n\n## 牛顿｜1月4日诞辰\n\n如果把科学史看作一部人类接力赛，牛顿是那个接棒之后一口气冲到终点的人。微积分、三大运动定律、万有引力、光的色散，每一项都是推倒重来级别的发现，而他几乎一个人完成了。但很多人不知道的是：这些革命性的东西，没有一样是他主动发表的。\n\n牛顿一生最古怪的地方，不是他的天才，而是他对「说出来」这件事的抗拒。他仿佛坚信，真理只要自己知道就够了，说出来反而是种污染。\n\n## 卢卡斯讲座教授，却从不写论文\n\n1643 年牛顿出生在英格兰林肯郡，父亲在他出生前三个月去世。他从小孤僻，在学校独来独往，上大学后除了读书几乎不参加任何活动。但天才掩盖不住：24 岁他就成了剑桥大学最年轻的教授，两年后又接任了崇高的卢卡斯讲座教授——这个位置后来由霍金坐了两百多年。\n\n他在课堂上讲出了当时没人想到过的东西：日光不是白色，而是由不同颜色的光组成的。这是他前所未有的发现，但他讲完就完了。他不整理、不发表、不宣传。对他而言，研究科学是自己的事，是「他和上帝之间的事」。他那些发现，不过是为了证明自己有资格理解上帝的设计——而全世界只有他一个人有这个资格。\n\n所以他宁可让发现烂在抽屉里，也不愿意拿出来给「那些对数学一知半解的人」看。\n\n## 哈雷三催四请，《原理》才面世\n\n1684 年，天文学家哈雷去剑桥拜访牛顿，问了一个困扰当时科学界的问题：如果行星受到的引力与距离的平方成反比，轨道会是什么形状？牛顿淡淡地回答：椭圆。\n\n哈雷问他怎么知道的。牛顿说，我算过了。\n\n哈雷愣住了——他没想到牛顿早就用三大运动定律和万有引力定律，把开普勒的行星运动定律整个推演了一遍。这本来是人类认知史上最重大的成就之一，却被牛顿当成一件私人小事随手放着。是哈雷一遍遍去求他，承诺自己出钱付印刷费，牛顿才终于在 1687 年把《自然哲学的数学原理》整理出来。\n\n而即便如此，他仍故意把书写得晦涩难懂。他的原话是：「免得被那些对数学一知半解的人纠缠不清。」\n\n## 天才的妒恨：与莱布尼兹的微积分之争\n\n牛顿可以不在意全世界的庸才，但无法容忍有人动他的地盘。\n\n虎克指责他剽窃了万有引力的思路，牛顿怀恨一生。皇家天文台长弗兰斯蒂德不肯把自己辛苦观测的数据无偿给他，牛顿就在《原理》里故意删掉他的贡献。更著名的，是与莱布尼兹持续到死的微积分归属权之争。\n\n莱布尼兹独立发明了微积分，且先于牛顿发表。牛顿认定对方是剽窃自己未公开手稿的小偷，动用自己在英国科学界至高无上的地位，不断打击莱布尼兹，直到他 1716 年去世。这场争斗的代价远超个人恩怨：英国学者为了立场，拒绝使用莱布尼兹那套更清晰的微积分记号，整整五十年闭门造车，英国的数学就此逐渐落后于欧陆。\n\n牛顿的好斗，还让光学研究付出了三十年的代价。因为虎克在光学上与他有争论，牛顿宁可把《光学》锁进抽屉，等虎克 1703 年去世后才出版。\n\n## 一个矛盾的遗产\n\n所以牛顿给我们留下了两种东西。\n\n一种是科学本身：一套能解释天上与地上所有运动的定律，一套人类此后两百多年反复验证都纹丝不动的力学体系。这是无价的。\n\n另一种，是关于人如何对待知识、对待同行的拷问。他那种「真理是我的私事」的执念，让无数本可更早惠及世人的发现被锁在暗处；他那份不容置疑的骄傲，让科学进程为了一个人的意气付出了几十年。\n\n天才的孤独成就了牛顿，也困住了牛顿。他推开了一扇门，却一生不肯站在门口让别人进去。直到今天，人们依然会想：如果牛顿愿意开口，人类科学史的起点，会不会比现在早三十年？\n\n## 他说过\n\n> 如果我比别人看得更远，那是因为我站在巨人的肩膀上。\n", "field": "物理/数学"}, {"title": "黑洞也会死", "subtitle": "霍金｜1月8日诞辰", "date": "01-08", "slug": "01-08-hawking", "file": "scientists/01/01-08-hawking.md", "content": "# 黑洞也会死\n\n## 霍金｜1月8日诞辰\n\n1942 年 1 月 8 日，一个婴儿在英国牛津出生。三百年前的这一天，伽利略在意大利闭上了眼睛。这个巧合后来被无数人谈起，仿佛某种传承的暗号：前一位窥见宇宙的人走了，后一位正来到人间。\n\n婴儿长大后叫史蒂芬·霍金。他研究的，也是天体——但比伽利略见过的任何东西都更远、更黑、更不可见：黑洞。\n\n## 医生判他只剩两年\n\n1963 年，21 岁的霍金刚进剑桥读研究所第一年，被诊断出肌萎缩侧索硬化症——俗称渐冻症。医生告诉他，最多还能活两年。\n\n他那时当然万念俱灰。把他拉回来的，是女友简。她没有转身离开，而是立刻跟他结了婚，照顾他起居。霍金后来承认：「没有简，我不可能活下去，也不会有意愿再活下去。」——尽管三十年后他们还是离了婚。\n\n病情没有像医生预言那样夺走他的命。身体越来越不听使唤，但霍金反而像被逼出了某种倔强：身体能困住的范围越小，他就越想往边界之外的地方跑。他选了一个当时没人敢碰的方向：宇宙的起点。\n\n## 认真对待那个\"无限大\"\n\n1965 年，彭罗斯从广义相对论里得出一个结论：恒星向内塌陷成黑洞后，中心会留下一个密度无限大的「奇异点」。对大多数物理学家来说，「无限大」只是一个概念，几何学里的点，不是真实的东西。\n\n只有霍金当真了。\n\n那一年正好发现宇宙背景辐射，大爆炸理论得到印证。霍金把奇异点理论从恒星推广到整个宇宙，与彭罗斯共同证明：宇宙大爆炸的源头，就是一个奇异点。时空在那一瞬间坍缩，一切从这里开始。\n\n这个证明，让霍金在学术圈一战成名。\n\n## 从反驳别人，到推翻自己\n\n后来霍金研究黑洞研究得入迷，跟同事一起给黑洞立了四条「热力学定律」。按其中一条，黑洞只能吞东西，永远不吐。\n\n有一天，另一位物理学家提出一个观点，恰好违背了这条定律。霍金本想驳倒他，结果辩着辩着自己先松动了——他发现对方可能是对的。为了证明对方错，他反而推翻了自己原本的主张，得出了一个震惊学界的结论：\n\n**黑洞并不黑。**\n\n黑洞虽然吞噬一切，但它会发出辐射，一点一点蒸发，最后消失。这个结论把广义相对论和量子力学——两个原本各管各的尺度、互不搭界的理论——强行拧在了一起。自此，霍金被视为当代物理第一人。他为此被后人称作「霍金辐射」，这是物理学史上少有的、以一个人名字命名的现象。\n\n讽刺的是，也正是因为黑洞至今无法直接观测，「霍金辐射」只有间接证据，霍金始终与诺贝尔奖无缘。但他的历史地位早已不需要那枚奖章来确认——《星际迷航》里，他本人客串出演，跟牛顿、爱因斯坦坐在一起打桥牌。那是大众给他的最高礼遇。\n\n## 他说过\n\n> 我的目标很简单：完全理解宇宙——它为什么是这个样子，以及它为什么存在。\n", "field": "宇宙学"}, {"title": "他把天上的火，接到了手里", "subtitle": "富兰克林｜1月17日诞辰", "date": "01-17", "slug": "01-17-franklin", "file": "scientists/01/01-17-franklin.md", "content": "# 他把天上的火，接到了手里\n\n## 富兰克林｜1月17日诞辰\n\n1752 年一个暴风雨的日子，美国的一间谷仓里，一个中年男人攥着风筝线，望着头顶翻滚的雷云。他手里这只风筝，线尾系着一把钥匙，钥匙下连着一只刚发明没几年、原本只被用来做娱乐表演的莱顿瓶。他赌的是：天上那道劈下来的闪电，跟人们用毛皮擦玻璃蹭出来的静电，是同一样东西。\n\n这场赌局，让一个十岁就辍学的印刷商，成了英国皇家学会的院士。\n\n## 四十岁，放下生意，从头学电\n\n富兰克林的前半生跟科学几乎搭不上边。他办印刷厂、出报纸、编年鉴，是个精明的生意人，直到 1748 年从自己一手创办的印刷事业里退出来。别人退休是为了享清福，他退休是为了回去琢磨那些没人想明白的问题。\n\n那时候人们对于电的全部认识，还停在「摩擦生电」这一步，甚至以为摩擦玻璃和摩擦树脂生出来的是两种完全不同的电。富兰克林埋头研究，给出一个干净利落的解释：静电来自电荷的转移，数量守恒，根本没有两种电，只有正负之分。他给它们取名叫正电、负电。这两组名字一直沿用至今，却顺带埋下一个小小的代价：他当初想当然地以为电流是正电荷在流动，后人为不推翻这个约定俗成的说法，只好把电子定为带负电。\n\n## 一道赌上天空的实验\n\n1752 年，他在雷暴天把风筝放上天。闪电顺着湿透的风筝线攀到钥匙上，一路导进莱顿瓶，被稳稳地贮存起来。雷电真的是电，而且能被传导、被保存。\n\n这个实验让印刷商富兰克林一跃成了皇家学会院士。他由此想到，给房子装一根尖尖的引雷铁棒，让雷电顺着它乖乖钻进地里，而不是劈开屋顶，这就是避雷针。他还顺手发明了双焦眼镜、安全壁炉、里程表，研究过光学、热学和气象，做过人口统计，追查过墨西哥湾暖流的走向。\n\n## 从不申请专利的发明家\n\n最特别的是：这位发明家从来没为自己的任何一项发明申请过专利。他的理由朴素得不像话，既然我们都在享受别人的发明带来的便利，那么自己的发明有机会帮到别人，就该打心底里高兴，就该慷慨。\n\n这种慷慨一路伸进了公共生活：他筹办了美国第一家医院、第一座公共图书馆、第一支消防队，还参与了《独立宣言》的起草。一个没上过几年学的人，靠自学读遍当时能读到的书，最后被人称作「美国第一人」。\n\n## 他说过\n\n> 当我们享受他人的发明带来的便利，我们应该为自己的发明有机会服务他人感到高兴，因此当然应该无私慷慨的去做。\n", "field": "物理/政治"}, {"title": "一个没资格开店的人", "subtitle": "瓦特｜1月19日诞辰", "date": "01-19", "slug": "01-19-watt", "file": "scientists/01/01-19-watt.md", "content": "# 一个没资格开店的人\n\n## 瓦特｜1月19日诞辰\n\n关于瓦特，流传最广的故事是这样一个画面：他小时候坐在炉子边，看着烧开水的壶盖被蒸汽顶得噗噗响，忽然灵光一闪，发明了蒸汽机。\n\n全错。他既没有在那个瞬间得到灵感，蒸汽机也早就被人造出来了。他做的所有事，不过是「改良」两个字。可偏偏就是这两个字，把人类送进了工业时代。\n\n## 一个连店都开不了的年轻人\n\n瓦特生在苏格兰，从小体弱多病，头痛一直纠缠他到中年。十八岁那年，他去伦敦当了一年学徒，学的是制造仪器的手艺。回到家乡格拉斯哥，他想开一家自己的店，却因为没做满行规要求的七年学徒，资格不够，店开不成。\n\n机会藏在一批坏掉的仪器里。格拉斯哥大学刚进了一批天文仪器，一路颠簸过来，多数已经没法用了，正缺一个懂行的人来修。1757 年，瓦特进了大学，白天修仪器，夜里在校园里开起一间小店。他在这里结识了发现二氧化碳的布拉克教授，还有日后写出《国富论》的经济学家亚当·斯密。布拉克教他物理理论和实验方法，一位学数学和机械的大学生罗宾逊，则一个劲儿地鼓动他去研究蒸汽机。\n\n## 一台五十年没人敢动的机器\n\n1763 年，大学把一台纽科门蒸汽机的模型交给他修理。这种蒸汽机问世整整五十年，除了给矿坑抽水，别的什么也干不了。瓦特修着修着，看出了名堂：蒸汽推着活塞往上走之后，得等汽缸里的蒸汽自己凉下来，活塞才会掉回去，重新开始下一轮。这么一冷一热的，动作又慢又断断续续，四分之三的热能全被白白浪费掉了。\n\n他花了两年，才想出那个答案：在汽缸外面另接一个独立的冷凝器，让蒸汽单独到冷凝器里去变回水，汽缸就能一直保持滚烫，活塞一刻不停地上下运动。\n\n## 八年的测量员生涯\n\n从图纸到真机，中间隔着一道叫「钱」的坎。造一台真正的蒸汽机要一大笔经费，布拉克帮他找来了出资人，可那个年代工匠手艺糙，机器造了又坏，坏了再造。出资人的钱眼看要烧完，瓦特只好把改良的事暂时搁下，出去兼差当测量员，一干就是八年，靠着这份收入养家，也养着他心里那个冷凝器。\n\n直到新的金主接手，1776 年，第一台能真正投入商业运转的新型蒸汽机才终于落地。后来他又在合伙人的建议下，让原本只会来回直线上动的蒸汽机学会了转圆圈，还发明了双向汽缸，效率又往上抬了一大截。\n\n瓦特终究没能把店开在格拉斯哥的街上，却把整个世界开进了工业时代。蒸汽火车和轮船从他修好的那条路上出发，世界的距离被一下子拉近了。而这一切，起初不过是一个连开店资格都没有的年轻人，蹲在大学角落里，替一台老掉牙的机器看诊。\n", "field": "工程"}, {"title": "一朵变红的紫罗兰", "subtitle": "波以耳｜1月25日诞辰", "date": "01-25", "slug": "01-25-boyle", "file": "scientists/01/01-25-boyle.md", "content": "# 一朵变红的紫罗兰\n\n## 波以耳｜1月25日诞辰\n\n那是个万物都由风、火、水、土四种元素构成的年代，真正的化学还不存在，有的只是炼金术，用玄学与神学熬出来的一锅浑水。波以耳做的事，是把化学从这锅浑水里捞出来，安上自己的家。\n\n## 追随两盏灯火的少年\n\n他起步时，靠的是伽利略和海尔蒙特这两盏灯光的指引。1657 年，他读到马德堡市长格里克那场著名的「马德堡半球实验」，两个铜半球紧紧扣在一起，抽掉空气之后，十几匹马都拉不开。波以耳对「真空」顿时来了兴致。他雇了一个比他小八岁的年轻人做助手，此人叫虎克，手艺极好，替他打造出一套抽真空效果绝佳的器材。\n\n靠着这套器材，他证明：没有空气，蜡烛点不着，声音传不过去，可磁力照样能穿过真空。他还指出，空气那股往回压的劲儿，也就是它的弹性，会随体积的大小而变化。\n\n## 一条被法国人逼出来的定律\n\n「空气的弹性随体积变化」这个说法，法国科学家不服，因为他们照着做，死活做不出同样的结果。其实问题出在他们自己身上，活塞做太紧，卡死了，自然弹不回来。\n\n波以耳没有急着争辩，而是把实验做得更严谨，一组一组地数出压力和体积的对应关系，得出那个著名的结论：温度不变时，气体的压力与体积成反比。1662 年，这条波以耳定律发表，成了人类有史以来第一条科学定律。它不是从四元素那套玄学里推演出来的，是关起门来，一厘米一厘米、一杯水一杯水量出来的。\n\n## 一朵紫罗兰，一张试纸\n\n波以耳跟化学的缘分，还藏在一朵花里。有一次，紫罗兰的汁液溅上盐酸，花瓣当场变成了红色。他干脆把各种花草挨个拿来试，最后发现石蕊地衣的效果最好，遇酸变红，遇碱变蓝，于是有了石蕊试纸，这玩意儿到今天还摆在每一间化学实验室里。\n\n他还最先发现硝酸银一照光就变黑，尽管他当时误以为那是跟空气起了反应。这个带着误会的发现，后来成了照相底片的先导。\n\n波以耳到老仍在给比他小十六岁的牛顿写信，神神秘秘地讨论炼金术。但他的元素定义和那条定量定律，已经替化学安好了家。他反复强调：化学不是医学或药学的婢女，也不是工坊和冶金的仆人，它本身就是一门独立地探索宇宙奥秘的科学。\n\n## 他说过\n\n> 化学决不是医学或药学的婢女，也不应甘当工艺和冶金的奴仆，化学本身作为自然科学中的一个独立部分，是探索宇宙奥秘的一个方面。化学，必须是追求真理的化学。\n", "field": "化学"}, {"title": "一百亿滴雨里，找一滴不同的", "subtitle": "丁肇中｜1月27日诞辰", "date": "01-27", "slug": "01-27-ting", "file": "scientists/01/01-27-ting.md", "content": "# 一百亿滴雨里，找一滴不同的\n\n## 丁肇中｜1月27日诞辰\n\n1974 年秋天，丁肇中领导的小组对着同步加速器撞出来的数据，越看越不对劲。电子和正子对撞之后，在某个能量点上出现的衰变模样，跟已知的任何粒子都对不上号。那个能量值，是 31 亿电子伏特。\n\n如果他们没看错，手里就握着一个此前从没有人见过的粒子。\n\n## 粒子动物园里的一个怀疑\n\n那会儿高能物理刚刚热起来，新粒子一个接一个被撞出来，物理学家们互相打趣，说自己的实验室都快成「粒子动物园」了。在这个动物园里，丁肇中手里这个新粒子格外扎眼，如果它真的存在，就意味着夸克不止三种。\n\n当时解释绝大多数粒子，只需要上、下、奇三种夸克就够了，而且多数科学家还只把这些夸克当成数学里的纸面符号，并不真信它们存在。要在这样的氛围里宣布「我发现了第四种夸克」，风险有多大，他比谁都清楚。\n\n## 八年前的那一课\n\n八年前，丁肇中重做了别人做过的测量电子大小的实验，结果当场把原来的科学家给比了下去。他不想在同一个坑里再摔一次。\n\n所以当组员们兴冲冲地催他公布时，他硬是把这股兴奋按下来，让所有人把数据翻来覆去地查、再查，直到再也挑不出一丝纰漏，才点头说，可以了。\n\n## 11 月 11 日：两个名字\n\n1974 年 11 月 11 日，他召开记者会，宣布发现「J 粒子」。就在同一天，里克特率领的另一支团队也宣布发现了同一个粒子，只不过他们管它叫「ψ」。两支完全独立的团队，在同一天交出同一个发现，这在科学史上绝无仅有，后来被称作「十一月革命」。\n\n更有意思的是，两边谁也不肯抢这个名分，反倒都改用对方起的名字来称呼它。于是这个粒子有了两个字母叠在一起的叫法，J/ψ 介子，到今天都是唯一一个顶着两个字母的基本粒子。1976 年，丁肇中和里克特一起站上了诺贝尔物理奖的领奖台。\n\n后来，丁肇中又带着三百人的国际团队，找到了把夸克拴在一起的胶子。如今他的实验早已离开粒子加速器，搬上了太空站，用阿尔法磁谱仪，从宇宙射线里寻找反物质的踪迹。\n\n## 他说过\n\n> 在一个城市中下起倾盆大雨，每秒有一百亿个雨滴落下，试图从中找出一颗与众不同的雨滴。\n", "field": "物理"}, {"title": "他发明了发明家", "subtitle": "爱迪生｜2月11日诞辰", "date": "02-11", "slug": "02-11-edison", "file": "scientists/02/02-11-edison.md", "content": "# 他发明了发明家\n\n## 爱迪生｜2月11日诞辰\n\n「发明大王」四个字，几乎就是爱迪生的代名词。反过来，一提起发明，大多数人最先想到的也是他。他一生在美国拿到的专利超过一千项，电灯泡、留声机、电影摄影机，每一件都搅动了无数人的生活。\n\n但「发明家」只是他的一半身份，另一半，是企业家。历史学家甚至有句点评：是爱迪生，发明了「发明家」这个职业。\n\n## 灯泡，不是他发明的\n\n先说他最出名的灯泡。灯泡在爱迪生之前就有人造出来了，只是寿命短得可怜，成本又贵得离谱，谁也没法真正用它。爱迪生的不一样，不在于他躲在实验室里跟灯丝较劲，而在于他先拿到了银行家的投资，开了一家「爱迪生电灯公司」，雇上一批人，成规模地做实验。折腾了上千次，1879 年，他终于找到碳化竹丝当灯丝，又耐用、又便宜。\n\n这一步，迈的是老板的步子，不是发明家的步子。\n\n## 三家公司，点亮一座城\n\n灯泡试出来的第二年，他成立了专门的灯泡公司，负责大批量生产。同一年拿下纽约市的发电站建造合约，他又开了一家电力照明公司，去造供电系统。灯泡、厂房、发电站、输电网，一条龙，被他一家一家公司给铺齐了。\n\n所以爱迪生对电灯的真正贡献，不在「发明」灯泡本身，而在给整座城市端上一份完整的照明方案。而这一切能成，靠的是他用商人的方式，经营自己的发明。\n\n## 商场如战场\n\n当起企业家的爱迪生，把商场当战场，下手毫不留情。曾在他手下干过的特斯拉，坚持交流电比他的直流电更适合供电，爱迪生便百般抹黑、处处打压，最后特斯拉在孤独中离世。生意和名声，爱迪生都赢了。\n\n他赢得更彻底的，还有后来的历史。只受过三个月学校教育、当过报童、卖过糖果、白手起家的成长故事，加上那句「天才是百分之一的灵感，百分之九十九的汗水」，实在太符合美国梦的配方。所以教科书里最终挤进去的，是爱迪生，不是特斯拉。\n\n他把自己活成了另一种发明，一套关于怎么把点子变成产品、把产品变成生意的方法。电灯亮了，留声机转了，他那间把工程师和商人的椅子摆在一起的实验室，成了后来无数科技公司的样板。发明大王这个头衔，说到底是他自己造出来的。\n\n## 他说过\n\n> 天才是百分之一的灵感，百分之九十九的汗水。\n", "field": "发明"}, {"title": "锁在抽屉里的答案", "subtitle": "达尔文｜2月12日诞辰", "date": "02-12", "slug": "02-12-darwin", "file": "scientists/02/02-12-darwin.md", "content": "# 锁在抽屉里的答案\n\n## 达尔文｜2月12日诞辰\n\n1858 年，年近半百的达尔文收到一封来信，寄信人是个比他小十四岁的探险家，叫华莱士。华莱士刚在亚马逊流域和婆罗洲一带考察了一圈，写信来汇报心得。达尔文起先只当是某个读过他作品的后辈，来请他指教。\n\n可读到最后，他心头一紧。信末关于新物种如何产生的猜想，怎么跟他埋在心底十几年、从不敢跟人提起的理论，一模一样？\n\n## 小猎犬号上的五年\n\n这一切要从 1831 年说起。那一年达尔文登上「小猎犬号」，一漂就是五年。他在各大洲收集动植物、敲打岩石、翻掘化石，看得越多，越没法相信「上帝已经造好了万物」这种说法。再配上莱尔的《地质学原理》和马尔萨斯的《人口论》带来的冲击，「物竞天择」的念头，开始在他脑子里成形。\n\n## 写完就锁起来\n\n1844 年，他开始动笔。到 1845 年 7 月，一份 189 页的草稿已经写完。他请人把草稿誊抄成工整的手抄本，然后锁进抽屉，旁边放了一封非正式的遗愿：等他死后，再出版。\n\n他不是谦虚，是害怕。物种从哪来，这个问题的答案，足以掀翻教会的屋顶。\n\n## 他赢了，也输了\n\n如今华莱士眼看就要把这颗「震撼弹」抢先丢出去，达尔文不能再拖了。1859 年，《物种源始》出版，后果跟他当初担心的分毫不差：教会震怒自不必说，地球不是宇宙中心也就罢了，可《圣经》白纸黑字写着人是按上帝的形象造的，现在居然说人是猿猴的后代；舆论的嘲笑铺天盖地，谁愿意承认自己跟猴子沾亲；连科学界也纷纷质疑他的演化机制。更讽刺的是，连华莱士本人都没站住脚，十年后反过来宣称，人脑绝不可能是靠自然选择演化出来的。\n\n直到数十年后，遗传学发展成熟，更多化石陆续出土，人们才普遍相信达尔文是对的。这本书成了影响范围最广、也最深远的科学著作，可演化论也成了最容易被利用的理论，优生学、帝国主义、种族灭绝，都有人拿它当遮羞布。到今天，仍有创造论者换上「智慧设计论」的外衣继续较劲。这一切，都是达尔文当年对着那只抽屉犹豫时，怎么也料想不到的。\n\n他当初最怕的，是答案会动摇信仰；到头来，被彻底动摇的，是人类对自己的想象。那本被锁了十多年的书，终究锁不住了。\n", "field": "生物"}, {"title": "两个球，同时落地", "subtitle": "伽利略｜2月15日诞辰", "date": "02-15", "slug": "02-15-galileo", "file": "scientists/02/02-15-galileo.md", "content": "# 两个球，同时落地\n\n## 伽利略｜2月15日诞辰\n\n二十六岁的伽利略站在比萨斜塔的顶层，双手各握一只球，一重一轻。他要把两只球同时放开，在楼下围观的人群面前，检验一个统治欧洲一千多年的说法。亚里士多德讲过，物体下落的速度和它的重量成正比，越重，落得越快。\n\n他松手。大约三秒之后，两只球同时落到了地上。\n\n## 一个可能没做过的实验\n\n后人考证来考证去，怀疑伽利略也许根本没爬过那座斜塔。因为他根本不必爬，用脑子推一推就够：把一轻一重两只球绑在一起，按亚里士多德的理论，轻的会拖累重的，整体该比单独的重球慢；可两球加在一起更重了，又该比单独的重球快。同一个前提，推出两个互相矛盾的结论，那就说明前提错了。\n\n倒是斜面上的实验，他是真做过的。他让小球沿着斜面滚下去，发现物体在不受外力改变运动状态时，会保持原来的状态，这是惯性定律的雏形；他还发现加速运动的距离跟时间的平方成正比，并且头一回把运动拆成水平方向和垂直方向来看。这几步，替牛顿的力学搭好了地基。\n\n## 第一次把望远镜举向夜空\n\n伽利略戳破的另一个千年迷思，是关于宇宙的。1609 年起，他一遍遍改良从荷兰人那儿学来的望远镜，成了人类第一个看清天体长相的人。他看见月球表面坑坑洼洼，太阳上布着「黑麻子」，所谓天体的完美无瑕，全是假的；他看见木星身边有四颗卫星在转圈，地球并不是唯一的心；他还观测到金星像月亮那样有盈有亏，证明金星是绕着太阳走的。\n\n哥白尼一百年前画下的那张日心说草图，到他这儿，终于有了看得见的证据。\n\n## 一纸悔过书，十年的软禁\n\n他把自己看到的东西写成书出版，教廷立刻重申：日心说是异端，不得公开谈论。伽利略闭了嘴，直到好友乌尔班八世当上新任教皇，他才又壮着胆子，在 1632 年出版了《关于托勒密和哥白尼两大世界体系的对话》，替日心说辩护。\n\n代价来得很快。他被押上宗教法庭，被迫低头，当众撤回自己的主张。据说他退下来的时候，嘴里还在小声嘟囔：可是地球依然在转啊。\n\n此后他被软禁在家，一关就是十年。他在这段日子把过去四十年的研究整理成《两门新科学的对话》，留给后人。直到 1992 年，教宗若望·保禄二世才正式承认当年的错误。而牛顿、爱因斯坦、霍金这些一代巨擘，早早就尊称他为「现代科学之父」了。\n", "field": "物理/天文"}, {"title": "病床前，那本书终于来了", "subtitle": "哥白尼｜2月19日诞辰", "date": "02-19", "slug": "02-19-copernicus", "file": "scientists/02/02-19-copernicus.md", "content": "# 病床前，那本书终于来了\n\n## 哥白尼｜2月19日诞辰\n\n想象你是个中世纪的人，每天看着月亮东升西落，星星一夜一夜绕着转，你当然会得出一个天经地义的结论：地球一动不动地待在宇宙正中央，所有天体都在围着它转。就算你爱看星星，注意到行星偶尔会倒着走的怪现象，公元二世纪的托勒密也早用「周转圆」和「偏心圆」那套旋转咖啡杯式的模型，给你安排得明明白白。再加上教会在背后大力背书，地心说稳稳当当地统治了人类一千多年。\n\n直到十六世纪初，一个波兰人开口说：错了。\n\n## 一个替教会铺路的孩子\n\n哥白尼十二岁丧父，由当主教的舅舅一手拉扯大。舅舅给他铺好了路，送他去意大利念书，将来回教会做教士。他老老实实地拿到了教会法规的博士学位，还学了医学，可他的心思，半道上全溜到天上去了。他在意大利遇到几位顶尖的天文学家，重新拾起少年时的天文爱好。后来他回到波兰，接下舅舅安排的职位，仍利用一切闲暇抬头看星星。\n\n## 他的灵感，不在望远镜里\n\n有意思的是，哥白尼其实没花多少时间守夜观测。他的天文知识主要来自书本，真正给他灵感的，是哲学和数学。托勒密那套系统算出来的日子，跟实际天文现象常常要差上好几天，显然不对；更让他受不了的，是那一堆圈圈套圈圈、各自绕着不同轴心转的复杂模型，配不上他心里那个简洁、美丽的宇宙。\n\n于是他说出了近乎大逆不道的话：不是天体绕着地球转，是地球和其他行星，一起绕着太阳转。\n\n## 完美的圆，困住了他\n\n可这份对「简单完美」的执着，反过来绊了他一跤。他坚信行星的轨道必然是完美的圆形，而真实的轨道偏偏是椭圆。为了硬凑，他只好跟托勒密一样，往自己的模型里也塞周转圆，塞完一看，跟人家一样复杂，算出来的误差也没好到哪去。还有人拿他答不上的问题来堵他：地球这么重，凭什么绕着太阳飞？地球转得这么快，怎么没把我们甩出去，我们又为什么一点感觉都没有？\n\n从 1514 年左右，他就把理论印成小册子，在朋友间传阅，却始终没有公开发行。与其说是怕教会的压力，不如说是他自己清楚，这理论还千疮百孔，圆不了自己的话。呕心沥血写出来的东西，偏偏不合自己最看重的「简洁美丽」，那份沮丧，只有他自己咽得下去。\n\n## 临终前，书终于到了\n\n直到风烛残年，他才把学说整理成《天体运行论》付印。据说刚印好的书送到他床前时，他已经快不行了，伸手抚摸着封面，安详地离开了。\n\n他没能活着等到自己的理论被证明。七十年后，一直力挺他的开普勒，把圆形轨道改成了椭圆形，日心说的这笔账，才算真正算清。\n", "field": "天文"}, {"title": "黑板上的最后一道题", "subtitle": "爱因斯坦｜3月14日诞辰", "date": "03-14", "slug": "03-14-einstein", "file": "scientists/03/03-14-einstein.md", "content": "# 黑板上的最后一道题\n\n## 爱因斯坦｜3月14日诞辰\n\n1962 年秋天的哥本哈根，阳光很淡。七十七岁的玻尔站在研究室的黑板前，一笔一笔画出一个装置的草图。那是爱因斯坦为他留下的最后一道难题，一座名叫「光盒」的思想实验，用来反驳他和海森堡共同主张的量子理论。画完最后一笔，他盯着图形看了很久。第二天清晨，他因心脏衰竭在家中去世。\n\n留在黑板上的，成了玻尔最后的笔迹。而在那之前，这道题已经折磨了他整整一夜——他用尽办法想找出破绽，最后发现，答案竟然藏在爱因斯坦自己的相对论里。\n\n爱因斯坦和玻尔，是二十世纪物理学最响亮的两个名字，也是吵得最久的一对朋友。\n\n## 一辆坐过站的电车\n\n故事要从四十年前说起。当时爱因斯坦来哥本哈根拜访玻尔，玻尔亲自到车站迎接这位仰慕已久的大师。两人搭上电车回家，在车上讨论得太投入，坐过了站；下车搭返程的电车，又过了头。来回几次，谁也没在意，因为实在谈得太投机了。\n\n那一年，他们一起领取诺贝尔物理奖。玻尔拿到的是 1922 年当年的奖，爱因斯坦补领的是前一年的奖——原本就该颁给他，却因为委员会里有人作梗，拖了一年。也正因如此，爱因斯坦才在回程时顺道拜访了哥本哈根。\n\n两人得奖的研究，其实出自同一个家族。玻尔正是吸收了普朗克和爱因斯坦的光量子理论，才在 1913 年提出量子跃迁，挽救了老师卢瑟福那套摇摇欲坠的原子模型——否则，绕行的电子该一边辐射一边坠向原子核，现实中的世界却并没有因此塌掉。爱因斯坦盛赞他的发现是「思考层次最高境界的美妙音乐」。\n\n## 一个不肯信骰子的人\n\n分歧出现在量子力学真正长成之后。玻尔和年轻的物理学家们彻底拥抱了这个新世界：并不存在一个客观独立的真实，真实只对观测者有意义，观测这个动作本身，就会改变真实如何呈现。这套由玻尔和海森堡领衔提出的「哥本哈根诠释」，让整个物理学界吵翻了天。\n\n可爱因斯坦笃信因果律和决定论。他无法接受一个会「掷骰子」的世界——掷不掷、掷出几点，居然要看有没有人看。两人为此争论了几十年，成了量子力学与古典物理两个阵营各自的旗手。\n\n立场水火不容，情谊却一分没减。爱因斯坦说「上帝不会掷骰子」，玻尔回敬一句：「爱因斯坦，别再告诉上帝该怎么做了！」那语气，是老朋友才有的调侃。物理学家斯诺后来评价：在人类思考的历史上，再没有比这更深奥的知性辩论了。\n\n## 光盒与最后一夜\n\n爱因斯坦晚年最狠的一招，就是那个光盒。它设计得精妙，让玻尔当场说不出话。可那一夜，玻尔终于想通了：破绽出在爱因斯坦自己身上——他忽略了自己的相对论效应。\n\n天亮了，老人没有把答案告诉任何人，只是把它留在黑板上，连同那段谁也说服不了谁、却彼此敬重的岁月。七年前爱因斯坦先他而去，玻尔嘴上不说，心里却觉得空了一块。\n\n世界终究是要掷骰子的，这一点，爱因斯坦没能等到承认。但他那个固执的问题，让量子理论从此不敢含糊；他留下的每一道题，直到今天还有人接着答。\n\n## 他说过\n\n> 上帝不会掷骰子。\n", "field": "物理"}, {"title": "一场瘟疫，和一个被拔掉的把手", "subtitle": "约翰·斯诺｜3月15日诞辰", "date": "03-15", "slug": "03-15-snow", "file": "scientists/03/03-15-snow.md", "content": "# 一场瘟疫，和一个被拔掉的把手\n\n## 约翰·斯诺｜3月15日诞辰\n\n1854 年九月初，伦敦苏活区的霍乱已经闹到第四天，死了 127 人，还在往外蔓延。牧师怀海德被请进医师斯诺的办公室时，斯诺正皱着眉头，盯着墙上的一幅地图。\n\n斯诺开门见山：「牧师，我知道你和大多数人一样，相信瘴气说。」\n\n「是啊，我们那片地方脏乱，到处是臭味，这次的霍乱，肯定是坏空气闹的。」\n\n## 他不信坏空气\n\n斯诺不信。他提醒牧师：八年前那次霍乱，医护人员天天和病人密切接触，却没有一个人被感染——如果凶手是空气，他们早该先倒下。何况病人从发病起就不停腹泻，病菌更像是从口进入、在肠胃里发作，最可能的媒介，是被病人粪便污染的水。\n\n牧师半信半疑：「你有什么根据？」\n\n斯诺站起身，指向墙上的地图。那是苏活区的街道图，上面涂着一个一个黑点，全是病患的住所。黑点密密麻麻，簇拥在一起，而它们围住的正中心，是布罗德大街的一具抽水帮浦。\n\n「住在这附近的居民，饮用水都来自它。我想，这就是霍乱的源头。」\n\n## 地图不会说谎\n\n牧师凑近细看，越看越觉得蹊跷，指着图上两处数字质问：「那感化院五百三十五人里，怎么只有五个病例？这间啤酒厂七百零二个员工，居然一个都没得霍乱？」\n\n斯诺等的就是这个问题。「你突破盲点了。这正是我请您来帮忙调查的原因。」\n\n他们顺着线索一路查下去：感化院和啤酒厂都有自己的独立水井，不喝大街帮浦的水，所以安然无恙。帮浦取水区以外也有十个病例，其中五个是偏爱这里的水、专程跑来取水的，还有三个，是过来上学的孩童。水顺着人的腿脚流动，病也跟着流动——每一笔都对得上。\n\n九月八日，斯诺把调查结果呈给地方首长，说服他们拆下了那具帮浦的把手。疫情随即平息。那一场霍乱，夺走了六百多条人命。\n\n## 他没能等到答案\n\n只是，斯诺始终没能向世人证明凶手长什么样。他用显微镜没找到病菌，只留下那句老老实实的话：可能是我取的水里，刚好没有。四年后，他死于中风。又过了三十年，德国医师柯霍才在显微镜下看见了霍乱弧菌，证实了他当年的判断。\n\n斯诺等不到答案。但等不到答案的人，也可以提前出发。那幅地图、那些黑点、那把被拆掉的把手，教给后世一套看疫情的方法：不再追问「坏空气从哪来」，而是追踪「每个人喝了哪里的水」。这套方法，后来长成了一门学科，叫流行病学。\n\n他活着的时候，连自己的推断都还没人肯信。现代流行病学之父这个称号，是后人补给他的。\n", "field": "医学/流行病"}, {"title": "把鸽子装进导弹的人", "subtitle": "斯金纳｜3月20日诞辰", "date": "03-20", "slug": "03-20-skinner", "file": "scientists/03/03-20-skinner.md", "content": "# 把鸽子装进导弹的人\n\n## 斯金纳｜3月20日诞辰\n\n二战打到中途，珍珠港被日本偷袭，美国海军急着还击。可问题在于，那时的导弹还没有可靠的导航系统，瞄不准军舰。心理学家斯金纳给军方献了一计：让鸽子来驾驶导弹。\n\n这不是玩笑。鸽子被事先训练过，一看见屏幕上出现日本军舰的图像，就伸头去啄——啄一下，就有一份食物奖励。把它们固定在导弹里，对着屏幕，鸽子一啄，颈部动作牵动机件，飞行方向就被一点点修正。斯金纳还在官员面前做了成功的示范，证明这事真能成。\n\n好在雷达技术发展太快，海军用上了更可靠的制导方式，这群鸽子才免于冲进战场当「神风特攻队」。斯金纳的疯狂点子胎死腹中，但它不是凭空冒出来的。\n\n## 一条没人走过的路\n\n斯金纳读研究所那会儿，心理学界还是弗洛伊德学说的天下。心理学和哲学贴得近，离科学远得很。人人都在谈潜意识，谈压抑和欲望，斯金纳偏偏对帕夫洛夫着迷。\n\n帕夫洛夫的狗，一听见铃声就流口水——那是反复训练、刻进神经里的反应。可狗流口水是不自觉的生理反应，斯金纳想知道的是另一件事：有意识的行为，能不能也被改变？\n\n他造了一个箱子，里面有控制杆，有送食器。老鼠放进去，很快学会一压杆子就有吃的，从此保持这套行为。斯金纳接着改规则：要压几下才给吃的、隔多久才给一次。他意外发现，当奖赏来得越迟、越没规律，已经学会的行为就越难消除——哪怕奖励彻底取消，老鼠还是会一遍遍去压那根杆。\n\n一个箱子，几个变量，他硬是把「行为可以被控制」这件事，从一句口号做成了有数据的科学。行为科学的基石，就这么铺下了。\n\n## 马戏团，还是实验室？\n\n这套「增强」机制好用得吓人。斯金纳用它教兔子投币，教猫弹钢琴，教鸽子打桌球。照片流传下来，像极了一场动物马戏。但他要的不是马戏——他真正想问的，是人。\n\n我们的习惯，是不是也是被奖励塑造出来的？如果是，那调整奖励，是不是就能改变人的行为？\n\n这个推论让他声名大噪，也让他备受指责。他的话听起来像在说：人没有自由意志，只是被外部条件牵着鼻子走。加上「改变人类行为」几个字，很容易让人联想到极权国家控制人心的手段。\n\n可反过来想，我们身边哪样习惯不是这么长出来的？婴儿用哭闹换哄抱，学生因为老师的关爱而更认真，那些戒不掉的瘾，背后多半也藏着一套越久越没规律的奖励。斯金纳想说的其实是：看穿这套机制，人才能真正做自己的主人——而不是反过来，被它牵着走一辈子。\n\n那只没能上天的鸽子，是他替人类问出的一个问题。\n", "field": "心理学"}, {"title": "实验室里多出来的那点光", "subtitle": "伦琴｜3月27日诞辰", "date": "03-27", "slug": "03-27-roentgen", "file": "scientists/03/03-27-roentgen.md", "content": "# 实验室里多出来的那点光\n\n## 伦琴｜3月27日诞辰\n\n1895 年十一月的一天，年过半百的德国物理学家伦琴，在实验室里忙到了傍晚。他做的是门老实验——阴极射线。这东西从 1869 年希托夫第一次发现它起，吵了二三十年，连它是粒子还是波都没吵出结果。\n\n他刚做完莱纳德那套实验：把阴极射线管阳极那端的玻璃开个小窗，用铝箔封住，管子仍能维持真空；再把一张涂了荧光材料的纸板靠近铝箔窗，纸板亮了，证明射线穿过了铝箔——这支持了「阴极射线是波」的说法。伦琴如法炮制，验证无误。\n\n然后，他换了一根管子，接上电，关了灯。\n\n## 不该出现的荧光\n\n就在黑暗里，他看见一、二公尺外的墙上，有一小片幽幽的荧光。\n\n他开灯一看，发光的不是墙，是他刚刚随手放在旁边的荧光纸板。可这不合理：希托夫管是完全密封的，从来没人见过射线跑到管外来；莱纳德也证明过，阴极射线在空气里走不了几十公分就没了。伦琴索性用黑布把整根管子包起来，纸板照样发光。\n\n那就不是阴极射线。是一种没人见过的东西。他叫不出名字，索性用数学里最常用的记号，管它叫 X。\n\n## 六星期的执念\n\n接下来六个星期，伦琴几乎住在实验室里。他把纸板、木头、金属一样一样横在射线和纸板之间——全挡不住，只在纸板上留下深浅不一的影子。只有铅，能把这道看不见的射线完全截断。\n\n最让他震撼的，是某天他拿一小片铅块挡着时，纸板上竟现出了自己手骨的影像。隔着皮肉，他第一次「看见」了自己的骨头。\n\n到年底，他把发现公之于世，附上一张照片：他的妻子戴着戒指的左手，骨架清晰可见。全世界都愣住了。\n\n## 一发不可收拾的光\n\nX 射线的运气，在科学史上几乎找不到第二例。法国物理学家贝克勒尔只是被震动了，想研究它，两个月后就在顺手的实验里发现了放射性，无意中替居里夫妇指了条路；爱迪生第二年就造出 X 光机，卖给医院；第一次世界大战时，居里夫人改装出 X 光巡回车，开到战场上替伤兵做诊断。\n\n从发现到救人，中间几乎没隔几年。历史上没有任何一样科学新发现，能像 X 射线这样，在这么短的时间里造成这么大的影响，又立刻变成实用的工具。1901 年，第一届诺贝尔物理学奖颁下来，落在伦琴名下，几乎没有任何悬念。\n\n他原本研究阴极射线，只是想做一遍前辈们的旧实验，看能不能瞧出什么端倪。那是一件再普通不过的差事——一个做了一辈子实验、年过半百的物理学家，按理说不该再撞上什么新鲜事。\n\n可偏偏在关了灯的那一刻，墙边多出了一小块本不该有的光。\n", "field": "物理"}, {"title": "十九岁生日前的那个月", "subtitle": "高斯｜3月30日诞辰", "date": "03-30", "slug": "03-30-gauss", "file": "scientists/03/03-30-gauss.md", "content": "# 十九岁生日前的那个月\n\n## 高斯｜3月30日诞辰\n\n1796 年三月三十日，离高斯十九岁生日还有一个月。这一天，他用圆规和直尺，做成了一件两千年没人做成的事：把一个圆十七等分。\n\n自欧几里得时代以来，这个难题就一直挂着，无数聪明人试过，都折了。而高斯用最朴素的两件工具，干净利落地解开了它。\n\n这一天从此成了他生命的转捩点。不是因为解出难题本身，而是它替一个犹豫不决的年轻人，决定了一生。\n\n## 三岁就看穿算错账\n\n高斯的数学天分，来得实在太早。三岁那年，他站在旁边，看当水泥匠工头的父亲给工人算工资，忽然指着数字说：错了。父亲重新一算，果然错。十岁那年，老师想图清静，在课堂上出了道「从 1 加到 100」，话音没落，高斯不到一分钟就交了卷——他看出首尾两两配对都等于 101，答案 5050。十一岁，他已经自己推出二项式定理的一般展开式。\n\n可天分不等于出路。高斯家穷，要不是费迪南公爵愿意资助，他连高等数学都读不起。也正是这份资助，把他推到岔路口：凭这份天分，是去做一份能养家糊口的营生，还是把一生押在看不见收入的数学上？他一直犹豫着。\n\n直到 1796 年的这一天。\n\n## 一本天才的账本\n\n从这一天起，高斯开始往一本日记里记下他的发现，一记就是十八年。这本日记一百年后才被人发现，如今叫《科学笔记》，一共一百四十六则，每一则，都是足以让别的数学家耗尽毕生的成果。\n\n第九天，他记下二次互反律；第一百天，他证明任何自然数最多只需用三个三角形数之和就能表示。开头七个月，他记了四十多则。第二年，他把前人没能证明的代数基本定理证了出来，当博士论文用，日后又换三种方法各证了一遍。\n\n1801 年，二十四岁的他把数论成果汇集成书。霍金后来评价：在高斯的《算术研究》之前，所谓数论，不过是无数孤立研究的杂烩；是他引入「同余」的概念，才搭出完整的结构。\n\n## 没有望远镜的天文学家\n\n也是 1801 年，意大利天文学家皮亚齐发现了小行星谷神星，可它很快被太阳遮住，消失在星空里。高斯只凭皮亚齐的三次观测记录，用自己早先发明的最小平方法，硬生生推算出它的运行轨道，算出了它该在哪儿。后来，人们果然在他预告的位置上重新找到了谷神星。\n\n一个连望远镜都没有的人，就这样跻身一流理论天文学家的行列。\n\n高斯的成就多到写不完：代表常态分布的高斯曲线、给复数安家的复平面、为后来非欧几何铺路的曲面研究、电磁学里的高斯定理，还有和韦伯一起发明的发报机、第一张地球磁场图、用于大地测量的镜式六分仪。任何一项，都够另一个人名垂青史。\n\n可他晚年最想刻在墓碑上的，偏偏还是那个十七等分圆的正十七边形。石匠看了看图纸，劝他：刻出来看着跟个圆没两样，何必呢。于是作罢。\n\n他念念不忘的，不是那道题本身有多难，而是那年春天，一个年轻人在圆上留下的那道刻痕，替他选好了往后所有的路。\n", "field": "数学"}, {"title": "一条回到坐标原点的路", "subtitle": "笛卡尔｜3月31日诞辰", "date": "03-31", "slug": "03-31-descartes", "file": "scientists/03/03-31-descartes.md", "content": "# 一条回到坐标原点的路\n\n## 笛卡尔｜3月31日诞辰\n\n1618 年十一月，荷兰布雷达城。二十二岁的笛卡尔在城中闲逛，路过市集公告栏，被上面一张布告吸引住了——那上面印着一道数学题。\n\n他出身法国贵族豪门，两年前刚拿到法律学位，可他对学校里那一套早就失望透顶，干脆抛下书本四处旅行，想靠自己的双脚和眼睛去认识世界。此刻，他站在公告栏前，向一位正在读布告的路人请教这题到底是什么意思。对方告诉他：这是一道悬赏征解的题目。而这位路人不是别人，正是当地大学的助理校长贝克曼。\n\n贝克曼的鼓励，把笛卡尔拽回了数学和物理。而这一步，拐弯了他整个后半生。\n\n## 一个不眠之夜\n\n一年后，笛卡尔派驻德国，经历了他口中著名的「神启之夜」。那一夜他彻悟：要用数学的原理，把人类的知识重新搭一遍——从最坚固的地基开始，一层一层盖上去。他把这当作一生的志业。\n\n1620 年，他离开军队，继续游历欧陆。又过了八年，他在荷兰定居，开始动手把他头脑里那座大厦写成书。\n\n## 把图形翻译成数字\n\n1637 年，《方法导论》问世。书后附了三篇论文，其中一篇叫《几何》，悄悄种下了现代数学的第一块里程碑。\n\n过去，几何题靠的是直觉和巧思，一条辅助线想不到，就卡死在那里。笛卡尔把直角坐标系引进图里，让每个点都有了坐标，每根线段都有了对应的数字和式子——几何图形从此可以翻译成代数方程式，一道难题，变成一套按部就班的计算。这就是解析几何，它替后人铺平了微积分的路。直到今天，那套坐标系还挂着他的名字，叫笛卡尔坐标系，整个现代物理都踩着它起跳。\n\n## 怀疑到底，剩下一个「我」\n\n1641 年的《沉思录》，把怀疑推到了底。他说：我们应该怀疑一切，包括所有从感官得来的知识——你怎么知道，这个世界不是一个法力无边的恶灵造出来的幻象？就像《黑客帝国》里的母体。\n\n可再往下想一步，他找到了唯一牢靠的桩：就算一切都是假的，那个正在怀疑的「我」，总不可能是假的吧？怀疑的念头，总得有个地方长出来。于是有了那句流传至今的话：「我思，故我在。」\n\n这句话，把西方哲学从教会的禁锢里撬了出来，理性第一次有了理直气壮的资格。后人因此叫他「现代哲学之父」。\n\n可惜，一生清醒的人，结局却不太清醒。1649 年，他应瑞典女王之邀北上，担任私人教师。他身体本就不结实，扛不住北欧的酷寒，很快病倒，次年因肺炎去世。直到 1667 年，遗骸才被运回法国。\n\n一生在外游历的笛卡尔，最后还是回到了原点——坐标的原点，也是他一切思辨的起点。\n\n## 他说过\n\n> 我思，故我在。\n", "field": "数学/哲学"}, {"title": "大学不是澡堂", "subtitle": "埃米·诺特｜4月14日忌日", "date": "04-14", "slug": "04-14-noether", "file": "scientists/04/04-14-noether.md", "content": "# 大学不是澡堂\n\n## 埃米·诺特｜4月14日忌日\n\n1915 年，德国哥廷根大学，著名数学家希尔伯特想请一位数学天才来任教。同事们的反对却炸了锅，理由出奇一致：她是个女人。一旦给她正式教席，将来就有机会升任教授，有资格进评议会，去评判男同事的成果。希尔伯特当场拍桌：「我看不出这跟性别有什么关系，毕竟我们这儿是大学，又不是澡堂！」\n\n气话归气话，反对依然奏效。这位天才最终没能拿到正式教席，只能以希尔伯特的名义开课，以「助教」的身份站上讲台。她叫埃米·诺特，时年三十三岁，已经做出了后来让整个物理学界都离不开的工作。\n\n## 七年没薪水的数学家\n\n诺特并非从小就显露出数学天赋。直到 1900 年德国大学开始允许女性旁听，她才在爱尔朗根与哥廷根接触到了高等数学。1904 年，爱尔朗根大学向女性开放，她得以注册入学，成为数学系唯一的女生。三年后，她以不变量理论的论文拿到博士学位。\n\n毕业之后，她本可以去找一份体面的工作，但她决心把一生献给数学，于是留在学校，没有职位，没有薪水，一边研究一边帮忙代课，一干就是七年。不变量理论上的声望，就是在这七年里一点一点垒起来的。\n\n1915 年，正为广义相对论挠头的希尔伯特想到了她，这才有了开头那一幕。澡堂风波之后，诺特又回到无职无薪的状态。直到一战折损了大量男丁，她才在 1919 年获得正式教席；四年后转任领微薄薪水的专任教席，此后再无升迁。\n\n## 撑起整个现代物理的定理\n\n1918 年，诺特发表了她最重要的成果「诺特定理」：数学上的连续对称性，与物理上的守恒定律一一对应。平移对称对应动量守恒，旋转对称对应角动量守恒，时间对称对应能量守恒。\n\n这句话听起来平淡，分量却重得惊人。从爱因斯坦的广义相对论，到量子力学的标准粒子模型，现代物理的每一块地基都踩在这条定理上。它说明一件事：宇宙里那些「不变」的量，根子不在别的，就在自然界规律的对称性里。多少物理学家终其一生追问守恒定律从何而来，答案早在 1918 年就写好了。\n\n## 命运没有给她时间\n\n1933 年，纳粹以她是犹太人为由，将她逐出校园。在同事的帮助下，她避走美国。一年半后，她因子宫肌瘤开刀，手术很顺利，六天之后却因栓塞去世。这一天是 1935 年 4 月 14 日。\n\n她留下了一个价值难以衡量的定理，也留下了一个时代对女性的亏欠。今天她被公认为「史上最重要的女数学家」，可这样的尊崇来得太迟，迟到她活着的时候，连一张有薪水的讲台都得不到。澡堂最终没有拦住她，可惜命运也没有多给她一点时间。\n", "field": "数学"}, {"title": "一个被困在古代的未来人", "subtitle": "莱昂纳多·达芬奇｜4月15日诞辰", "date": "04-15", "slug": "04-15-da-vinci", "file": "scientists/04/04-15-da-vinci.md", "content": "# 一个被困在古代的未来人\n\n## 莱昂纳多·达芬奇｜4月15日诞辰\n\n翻开达芬奇留下的手稿，你会看见一个奇怪的世界：纸上写满了镜像字，画着直升机、坦克、机关枪、双层船壳轮船、会自动行走的车。那是十五世纪的意大利，这些图纸像一封封写给未来世界的信，而收信人迟到了几百年。\n\n两幅画，《蒙娜丽莎》与《最后的晚餐》，就足以让达芬奇跻身最伟大画家的行列。可他同时还身兼雕刻家、建筑家、工程师、发明家、地质学家与解剖学家。这个史上最全能的天才身上，最动人的地方不是才华，而是才华被时代锁住的样子。\n\n## 画出了别人半世纪后才发现的人体\n\n达芬奇研究解剖，最初是为了画画。为了掌握人体的肌理线条，他一生解剖了不下三十具尸体，后来干脆纯粹是出于好奇。他画遍肌肉、骨骼、血管、神经、生殖系统与大脑，是第一个画出视神经如何从眼球连到大脑的人，也是第一个画出子宫内胎儿的人。半个世纪之后，解剖学之父维萨留斯才出版经典巨著《人体的结构》。\n\n## 大地、水与光的先行者\n\n他的目光从不只落在人体上。现代地质学提出地壳变动说之前三百年，他就有了一样的想法；他早就发现了水压的变化、连通器原理与大气压力。为了在画里如实呈现光影，他研究光的反射与折射，还画出了反射式望远镜的设计图，比荷兰人的折射望远镜早一个世纪，比牛顿的反射望远镜早了一个半世纪。\n\n他的手稿里还有水泵、城市下水道、跨度两百四十米的大桥，以及直升机、坦克、机械鼓、自动车一类的动力机械。其中许多设计并不符合力学原理。这只能怪他生错了时代，也生错了家庭。\n\n## 天才之殇：看不懂拉丁文，手稿又散落四方\n\n达芬奇是农妇所生的私生子，无法像父亲的其他孩子那样进城读书，所以不会拉丁文。而那个时代的学术著作全部用拉丁文写成，一整个知识体系对他关上了门。他的发明大多只能凭直觉设计，不是他算错了，而是他根本没有机会读到该读的书。\n\n更可惜的是手稿的遭遇。意大利城邦之间的战乱，让手稿在他生前就已遗落大量；去世后，后人也未能妥善保管，直到今天，发现的手稿估计不到三分之一。假如这些图纸能早些出版流传，人类的科学进展至少能提早一个世纪。\n\n1959 年，英国作家史诺说，科学与人文是互不通气的「两种文化」。半个多世纪过去，鸿沟没有缩小，反而连科学内部都越分越细。像达芬奇这样横跨两边、还在每个领域都走到前沿的人，成了再也回不去的时代的绝响。他来自未来，却被困在古代，而未来的我们，至今还没有追上他。\n", "field": "科学/艺术"}, {"title": "点着了火，不肯进门的人", "subtitle": "马克斯·普朗克｜4月23日诞辰", "date": "04-23", "slug": "04-23-planck", "file": "scientists/04/04-23-planck.md", "content": "# 点着了火，不肯进门的人\n\n## 马克斯·普朗克｜4月23日诞辰\n\n十九世纪末，一个年轻人想学物理，跑去请教一位物理教授。教授告诉他：「这门科学里的一切都已经被研究完了，只剩一些不重要的空白等着填补。」言下之意：别来了。\n\n年轻人没听。他叫马克斯·普朗克。如果他当时被说服，量子力学的诞生不知要推迟多少年。\n\n## 一个稍微加热就会致死的悖论\n\n普朗克最早显露的是音乐天赋，会弹多种乐器，还会作曲，但他更倾心物理。而他碰上的，是当时物理学最头疼的问题：黑体辐射。把密封金属容器开一个小孔，加热后从小孔发出的光就是黑体辐射。按能量均分定律，辐射应当平均分配到各种波长的电磁波上，可波长越短能量越强，也就是说，稍微加热就会产生足以致命的伽马射线。这显然荒唐，却难倒了所有物理学家，被称为「紫外灾变」。\n\n当时有两个理论各管一段：维恩定律只能解释高频区段，瑞利金斯定律在中低频区段与数据吻合。普朗克把两个定律放在一起研究，最终发现，出路在于放弃一个默认的常识，能量是连续变化的。只要假设能量像粒子一样有最小不可分割的基本单位，正确的黑体辐射定律就出现了。\n\n## 一个谁都不敢信的常数\n\n1900 年底，普朗克发表了这个大胆的假说，并给出著名的公式：每个量子的能量，等于其频率乘以一个固定常数，后人把这个常数命名为普朗克常数。它小到只有十的负三十四次方量级，却是物理学的一座巨大里程碑。量子革命，就此揭幕。\n\n可这个观念实在太惊世骇俗。直到 1905 年爱因斯坦用它解释光电效应，1916 年密立根以实验证实，普朗克才在 1918 年拿到诺贝尔物理奖。\n\n讽刺的是，普朗克本人始终不肯接受量子力学。他坚持认为，量子只是描述能量吸收与发射过程的一种方便写法，并不意味着光真的是粒子。他和爱因斯坦一样，亲手点燃了量子革命，却一生拒绝走进自己点燃的火焰。晚年他回顾这一生，叹息着说，他试图把基本量子作用塞进古典理论，长年旷日费时只是徒劳，被大部分同事当成一场悲剧。\n\n## 支撑他走完一生的是什么\n\n而他的一生，何尝不是悲剧。长子死于一战战场；次子因试图刺杀希特勒被处死；两个女儿先后死于难产。四个子女全部死于非命。住家在盟军空袭中被毁，所有藏书与研究笔记付之一炬。国破，家亡，支撑他的只剩一个使命：复兴德国的科学。\n\n1947 年 10 月，大战结束两年后，普朗克病逝，享年 89 岁。德国最高研究机构以他的名字改名为普朗克研究院。他的姓氏，则随普朗克常数永远流传，那个他亲手写下、却用半生试图抹掉的东西，最终成了他的名字。\n\n## 他说过\n\n> 我尝试将基本的量子作用纳入古典理论中，然而长年的旷日费时只是徒劳，被大部分同仁当成悲剧看待。\n", "field": "物理"}, {"title": "他先一步知道：未来不可预测", "subtitle": "亨利·庞加莱｜4月29日诞辰", "date": "04-29", "slug": "04-29-poincare", "file": "scientists/04/04-29-poincare.md", "content": "# 他先一步知道：未来不可预测\n\n## 亨利·庞加莱｜4月29日诞辰\n\n1887 年，瑞典国王悬赏征解「三体问题」：三个天体在互相的引力下，究竟如何运动。法国数学家庞加莱接下这道题，却撞见了一个比答案本身更惊人的事实。\n\n他甚至把问题一再简化，让其中一个天体小到质量近乎为零，方程仍然复杂到无法求解。也正是在那里，他第一次瞥见了后来被称为「混沌」的东西。\n\n## 差之毫厘，失之千里\n\n庞加莱发现，有些系统的运动对初始条件敏感得可怕：起点上一丁点的差别，会随时间放大成完全不同的结局。三体系统正是如此，它的轨道根本无从预测。他在 1908 年出版的《科学方法》中写道：「有时初始条件的微小差异，将造成最终现象的极大改变。前者的小误差，会引出后者极大的错误。预测将成为不可能的事。」\n\n这句话等于给「拉普拉斯的恶魔」判了死刑。拉普拉斯曾假设，只要知道宇宙里每个粒子的位置与速度，未来就能被完全推算出来。庞加莱用一个三体问题，就堵死了这条决定论的路，他甚至比海森堡的测不准原理更早戳破了那个梦。\n\n问题在于，这是一个来自未来的理论。混沌真正被物理学界重视，已是七八十年之后的事，到那时人们才发现，庞加莱留下的方法与概念依然够用。\n\n## 差一步就先到相对论\n\n庞加莱的「先见」不止这一次。爱因斯坦的狭义相对论建立在劳伦兹变换之上，而劳伦兹变换其实得助庞加莱的不少贡献。他在 1898 年就建议把光速视为恒定不变，甚至在爱因斯坦发表论文之前，就阐述过类似的相对性原理。只差最后一步：他的理论架构仍然以「以太」的存在为前提，于是与这场改写物理史的发现擦肩而过。\n\n1904 年，他又抛出一道悬置百年的难题「庞加莱猜想」，涉及四维空间的拓扑。无数数学家前赴后继想证明它，过程中发展出的数学工具，后来被物理的弦论拿去处理高维空间。直到 2006 年，俄国数学家佩雷尔曼在 2002 至 2003 年完成的证明才被确认为正确，而这位佩雷尔曼转身隐居，连一百万美元的奖金都拒绝领取。\n\n庞加莱一生发表论文近五百篇，著作三十部，几乎覆盖数学所有领域，物理上则横跨天体力学、流体力学、电磁学、热力学。他被称为继高斯之后，对纯数学及其应用都有全面知识的最后一人。他比时代早走了八十年，而时代追上来之后，用的还是他留下的路标。\n\n## 他说过\n\n> 有时初始条件的微小差异，将造成最终现象的极大改变。前者的小误差，会引出后者极大的错误。预测将成为不可能的事。\n", "field": "数学"}, {"title": "一张 21 岁的论文，预言了今天的电脑", "subtitle": "克劳德·香农｜4月30日诞辰", "date": "04-30", "slug": "04-30-shannon", "file": "scientists/04/04-30-shannon.md", "content": "# 一张 21 岁的论文，预言了今天的电脑\n\n## 克劳德·香农｜4月30日诞辰\n\n1930 年代的麻省理工，实验室里躺着一台叫「微分分析仪」的机器：满身继电器和齿轮，是第一台能解微分方程的模拟计算机。年轻的研究生克劳德·香农在导师布希手下研究它，盯着那满墙的开关和齿轮，忽然看穿了一件没人注意到的事。\n\n那些继电器开开关关之间传递的，根本不是电，而是「开」与「关」两个状态。能表达这两个状态，就能表达一切。\n\n## 用逻辑电路拼出电脑的图纸\n\n香农马上想起大学学过的布尔代数：开与关，正好对应 1 与 0；串联与并联，正好对应「与」和「或」。再配上二进制算术，再复杂的数学运算都能用电路拼出来。1937 年，他把这个想法写成硕士论文。那时他才 21 岁，晶体管还没有发明，但他已经提前勾勒出数字电脑的完整蓝图。\n\n无独有偶，图灵前一年刚提出可编程的通用计算机概念。两个人像两位先知，各自写下指导后人发动计算机革命的箴言。二战期间他们都在做通讯加密与解密，还见过面，只是碍于保密规定，聊得最多的竟是人工智能。\n\n战时的密码工作让香农明白，加密与破译可以不再靠灵感碰运气，而是一门能算、能衡量、能证明的科学。正是这段经历，让他后来想通了信息最本质的那个问题。\n\n## 信息，从这一刻开始可以称量\n\n正是研究密码学，启发了香农的信息理论。1948 年他发表《通讯的数学理论》，一门前所未有的科学就此诞生，而且一出生就是完整的、立即可用的。\n\n这篇文章处处与常识作对。工程师绞尽脑汁要抑制杂讯，他说杂讯根本无需消除；数学家想删掉多余的字元提高效率，他说冗余正是克服杂讯的法宝；所有人都认为讯息的本义绝不能被牺牲，他却说意义在通讯过程中无关紧要。他甚至借来热力学里「熵」的概念与公式，让主观抽象的「信息量」第一次可以被量化。信息从此不再是一种感觉，而是可以计算的数字。\n\n## 会走迷宫的老鼠，和藏在赌场的电脑\n\n香农还是人工智能的先驱。1950 年他写论文讨论如何让电脑下国际象棋，又发明了一只会自己学习走出迷宫的机械老鼠，成为第一台人工智能装置的雏形。1961 年，为了挑战拉斯维加斯的赌场，他做出世界上第一台隐藏式的可穿戴电脑。\n\n今天，每一台电脑的处理器都在用他规划的布尔代数与二进制运算；每一次通话、上网、听歌、看片，每一次文件的压缩与解压，都建立在他的信息理论之上。声音、图像、文字，在机器眼里都不过是一串串可以计算的数字。有人这样形容他的贡献：就像用「发明字母的人对文学的影响」来衡量一个人。香农发明的不只是工具，而是让整个数字时代得以开始的那张字母表。\n", "field": "信息论"}, {"title": "你不是自己心灵的主人", "subtitle": "西格蒙德·弗洛伊德｜5月6日诞辰", "date": "05-06", "slug": "05-06-freud", "file": "scientists/05/05-06-freud.md", "content": "# 你不是自己心灵的主人\n\n## 西格蒙德·弗洛伊德｜5月6日诞辰\n\n你躺上心理医生的沙发，对着空气不停地说：最近的怪梦、遥远的童年。白胡子医生在旁边做笔记，等你讲完，点起一支雪茄，不紧不慢地告诉你：这个梦没有表面看起来那么简单，它替你藏着你自己都不知道的欲望和恐惧。\n\n这套场景熟悉到几乎成了「心理治疗」的同义词。而把它变成这样一场戏的人，是奥地利人西格蒙德·弗洛伊德。\n\n## 冰山底下还有一个你\n\n弗洛伊德最革命的概念是「潜意识」。他把人格拆成三层：本我，是原始的欲望与情绪；超我，是社会塞给你的道德规范；自我，是两者反复妥协的结果。白天被压住的本我，到了夜里趁超我松懈，就从梦里披着各种伪装冒出来。所以那些光怪陆离、看似毫无意义的梦，其实深具意义，它反映的是连你自己都不知道的东西。\n\n他说，你意识得到的那点想法，只是冰山露出水面的一个尖角；水面之下，还藏着看不见的潜意识。这句话颠覆了一个延续千年的假设：人以为自己理性、以为心里有数。弗洛伊德说，不是的，你在很多时候是被另一个人做主的，一个你自己都不知道的他。\n\n直到今天，一提到「心理治疗」，人们脑海里浮现的还是那张沙发、那个做笔记的白胡子医生、那支雪茄。这套场景能成为集体想象，全是弗洛伊德留下的。他的精神分析方法虽然早已不是主流，却深深嵌进了电影、小说与每个人的口耳相传里。\n\n## 一切都指向性的执念\n\n弗洛伊德的问题也出在这里。他近乎偏执地把一切归因于「性」，梦里任何意象都能被他解释成性的象征。这种完全依赖医生主观解读的理论，连他最得意的弟子都受不了，荣格、阿德勒先后与他决裂。后世更批评他的学说缺乏可证伪性，经不起科学检验，如今早已不是心理学的主流。\n\n但即便如此，他依然是历史上影响最深远的心理治疗开创者。潜意识、恋母情结、性压抑这些概念渗透进哲学、文学、电影、音乐与绘画，成了整个二十世纪文化的地基。\n\n把弗洛伊德放进科学史，人们常常把他与哥白尼、达尔文并列。哥白尼把人赶出宇宙中心，达尔文否定人是上帝造的，弗洛伊德则再推一步：人根本不是你心里的主人。三个人做的是同一件事，一次次打掉人类的骄妄，逼我们重新认识自己。地球不是宇宙中心，人不是上帝造物，连自己的心都不是自己说了算，人类就这样被一而再、再而三地请下神坛。这话不中听，可后来的心理学、文学乃至整个时代，都在慢慢证明他戳中的那个痛点是真的。\n\n## 他说过\n\n> 有时候，雪茄就只是雪茄。\n", "field": "心理学/医学"}, {"title": "记住那个不怕波耳的小伙子", "subtitle": "费曼｜5月11日诞辰", "date": "05-11", "slug": "05-11-feynman", "file": "scientists/05/05-11-feynman.md", "content": "# 记住那个不怕波耳的小伙子\n\n## 费曼｜5月11日诞辰\n\n二战末期，一群顶尖物理学家秘密聚集在新墨西哥州的洛斯阿拉莫斯，参与曼哈顿计划——造原子弹。这里的任何一个人，都够格拿诺贝尔奖。\n\n有一天，量子力学的执牛耳者波耳主持完一场会议，把当助理的儿子叫到一旁，交代了一句奇怪的话：「记住坐在后面那个小夥子的名字，只有他不怕我。下次要讨论什么，先找他来。」\n\n波耳是谁？连爱因斯坦都跟他辩论过，同僚见了他大气不敢出。但那个坐后面、只有 25 岁的小伙子，见到这位物理学泰斗，既不紧张，也不奉承，该怎么争论怎么争论。\n\n他叫理查·费曼，一年前刚拿到博士学位，却已经是曼哈顿计划理论部门的小组长。\n\n## 一个拆保险柜的科学家\n\n费曼在洛斯阿拉莫斯的日子，一半是科研，一半是捣乱。\n\n他不怕波耳，更不怕军队。机密文件的保险柜锁得越严，他越要证明它不保险——他常常当众打开那些柜子，因为太简单了，他甚至为此无师自通成了开锁专家。他给家里写信故意写满暗号，就为了逗一逗军方负责检查信件的人。\n\n军队气得跳脚，却也拿他没办法。这个年轻人用最不正经的方式，一次次戳穿权威的严肃面具。\n\n## 用图画数学的人\n\n1948 年，一场研讨会上，费曼要讲自己如何解决量子力学的困境。全场的反应，从他走上台那一刻起就变了——他没有写满一整墙的公式，而是拿起粉笔，在黑板上画了一堆点和扭曲的线。\n\n台下坐的是奥本海默、波耳、费米、狄拉克。这些大师见过各种演讲，但从没见过有人用\"画画\"来讲物理。提问一波接一波，费曼讲得有点狼狈。但狼狈归狼狈，他没放弃。\n\n两年后，他把那套\"画\"发展成了「费曼图」——用几笔线条画出粒子的轨迹与相互作用，让原本一团乱麻的量子电动力学计算，变成看得见的图解。这套方法后来被整个物理学界接受，成为粒子物理的通用语言。1965 年，他凭此获得诺贝尔物理学奖。\n\n## 一杯冰水，证明 NASA 错了\n\n费曼的才华远不止物理。他打巴西鼓打到了能组队比赛夺冠；他的画开过画展；度蜜月时一时兴起，顺手破解了玛雅文明的象形文字。\n\n1986 年，挑战者号航天飞机升空后爆炸，七名宇航员遇难。调查组里，费曼做了一件让全美国记住的事：他拿起一个 O 形密封圈，放进一杯冰水里，然后当众演示——橡胶在低温下会失去弹性。航天飞机升空时正是严寒天气，密封圈失效，燃料泄漏，爆炸。\n\n他没有用任何高深的术语。一杯冰水，一个橡胶圈，让全美国都看懂了这场灾难的根源。\n\n## 他把人生过成了\"好玩\"\n\n费曼生前最后一本书《别闹了，费曼先生》，记录的就是他这一生：开保险柜、打鼓、画画、破译玛雅文、跟爱因斯坦的后辈们抬杠。他把每一件\"好玩\"的事，都认真做到了极致。\n\n他曾说：「物理就如同性爱，或许能带来一些实际的成果，但那并不是我们喜欢它的原因。」\n\n1988 年，费曼因癌症去世。他留给世界的不只是量子电动力学——那套让后来无数物理学家站在肩膀上继续走的数学工具。他留给我们更大的遗产，是他这个人本身：一个永远好奇、永远不怕、永远把生活过成好玩模样的自由灵魂。\n\n## 他说过\n\n> 我宁愿要那些我回答不了的问题，也不愿意要那些我无法质疑的答案。\n", "field": "物理"}, {"title": "天使手里，除了灯还有统计图", "subtitle": "弗洛伦斯·南丁格尔｜5月12日诞辰", "date": "05-12", "slug": "05-12-nightingale", "file": "scientists/05/05-12-nightingale.md", "content": "# 天使手里，除了灯还有统计图\n\n## 弗洛伦斯·南丁格尔｜5月12日诞辰\n\n1854 年的克里米亚，战地医院里躺满了伤兵。南丁格尔提着一盏灯，在夜里巡房。这是每个人都知道的画面。但很多人不知道的是，她同时也是个统计学家，而她以统计学家的身份救下的人，远比她亲手照护的多，她用来救人的工具，是一张统计图。\n\n## 一个「不听话」的贵族小姐\n\n南丁格尔出生在英国的富裕家庭。那个年代，贵族小姐的人生范本只有一条：学点才艺，嫁个好人家。她不。在女性普遍没有受教权的时代，她自学语言、历史、哲学、数学；在所有人把护士当成与女仆一样卑贱的职业时，她偏偏立志去做护士。她磨了很久，直到 31 岁才说服父母放行。\n\n克里米亚战争爆发，她志愿上前线。眼前的景象远比想象中可怕：医疗物资匮乏、医护人员不足、就地挖出的污水沟里全是排泄物，蚊蝇群聚、虫鼠乱窜。许多士兵并不是死在战场上，而是死在感染、霍乱与伤寒里。细菌学说尚未问世，可南丁格尔凭经验就知道，干净卫生是救命的关键。\n\n## 一盏灯数不清的，一张图算得清\n\n战争结束后，南丁格尔把自己调查的结果和军方数据放在一起，用统计学的眼光重新审视，确认了那个结论：死于疾病的人数，远远超过直接死于战争的人数。人们一向以为士兵是死在战场上，她用数字指出，真正的杀手是疾病，而疾病是可以被卫生打败的。\n\n可问题是，国会的老爷们懒得看，也看不懂统计分析。1858 年，南丁格尔想出一个办法：她把饼图改造成一种形似花瓣的新图，相当于圆形的直方图，按月份呈现不同死因造成的士兵死亡人数，哪个季节、哪种病夺走了最多的人，一眼扫过去清清楚楚。这种后来被称为「鸡冠花图」的图表，成功唤起了政府对公共卫生的重视，英国国民的平均寿命因此提高。驻扎印度的英军自 1863 年实施卫生改革后，十年间死亡率从 6.9% 降到 1.8%。\n\n1859 年，她成为英国皇家统计学会第一位女性会员，不久后又成为美国统计协会的荣誉会员。1860 年，她创办了全世界第一所正规护士学校，把护理从打杂升级成专业，也把「白衣天使」的形象刻进了公共记忆。\n\n她一边提灯照顾病人，一边用图表推动改革，成了资讯可视化的开山鼻祖，也为如何在公益运动中善用科学做出了示范。那些被画成花瓣的数字，替她在灯照不到的地方，救下了多得多的生命。灯光照亮的是一张病床，统计图照亮的，是一整个国家的卫生政策。\n", "field": "医学/统计"}, {"title": "她推翻了宇宙的镜子，却没有拿到奖", "subtitle": "吴健雄｜5月31日诞辰", "date": "05-31", "slug": "05-31-wu", "file": "scientists/05/05-31-wu.md", "content": "# 她推翻了宇宙的镜子，却没有拿到奖\n\n## 吴健雄｜5月31日诞辰\n\n1956 年 5 月，哥伦比亚大学，34 岁的杨振宁走进吴健雄的办公室，带着一个谁都不敢信的问题：大自然真的左右对称吗？\n\n吴健雄比他大十岁，已是核物理领域的重量级人物，人称「中国的居里夫人」。\n\n## 原子弹里的关键一环\n\n吴健雄的声望来自一场硬仗。当年曼哈顿计划在核分裂的连锁反应上卡了壳，计划主持人奥本海默点名要她加入，理由是「她知道所有关于中子吸收截面的知识」。那时她才来美国八年，是难得以外国人身份中途进入这项绝密计划的人。她解决了连锁反应的问题，原子弹得以完成，她的地位也因此更加牢固。\n\n## 一个没人敢碰的猜测\n\n杨振宁和同事李政道怀疑的，是物理学一条屡试不爽的定律：宇称守恒。它说自然是左右对称的，物理定律对左旋和右旋的粒子一视同仁，重力、电磁、强核、弱核四种力都验证过。可有一个谜始终解不开：θ 和 τ 两种介子，自旋、质量、电荷完全一样，衰变方式却不同。杨李二人从理论上推出一个惊人的结论：弱相互作用不遵守宇称守恒。\n\n他们是理论物理学家，于是特地来请教做过无数弱作用实验的吴健雄。吴健雄很快设计出实验方法。杨李的论文发表后招来一片质疑与嘲笑，量子力学大师泡利甚至说这纯属浪费时间，愿意拿全部身家赌宇称守恒必然成立。\n\n吴健雄没有动摇。她张罗器材、召集人手，在圣诞节前就观察到了宇称不守恒的现象。但她太严谨，仍要求成员多方查证、反复验算，直到 1957 年 1 月中旬，才把论文提交《物理评论》。\n\n结果公布，物理学界炸了锅：那条被深信不疑的对称性，真的被推翻了。杨振宁与李政道史无前例地火速拿下当年诺贝尔物理奖，可几乎所有人都在惊讶另一件事：亲手用实验证明这一切的吴健雄，不在这份名单里。\n\n## 一封信里的遗憾\n\n许多物理大师为她抱不平。她后来获得了无数殊荣，可这个缺憾终究没有消失。1989 年，她给多年同事史坦伯格写信：「我从来没有为了得奖而去做研究工作，但是，当我的工作因为某种原因而被人忽视，依然是深深地伤害了我。」\n\n1997 年，她因中风去世，享年 85 岁。人们将永远记得这位「核子研究的女王」。她推翻了宇宙的镜子，让世界看见不对称的那一面，而她的名字，终究没能登上那份最重要的名单。\n\n## 他说过\n\n> 我从来没有为了得奖而去做研究工作，但是，当我的工作因为某种原因而被人忽视，依然是深深地伤害了我。\n", "field": "物理"}, {"title": "他本可以把全世界握在手里，却松开了手", "subtitle": "伯纳斯-李｜6月8日诞辰", "date": "06-08", "slug": "06-08-berners-lee", "file": "scientists/06/06-08-berners-lee.md", "content": "# 他本可以把全世界握在手里，却松开了手\n\n## 伯纳斯-李｜6月8日诞辰\n\n1989 年春天的日内瓦，欧洲核子研究中心里，一个 34 岁的物理学家正对着屏幕敲一份文件。办公室安静得能听见风扇声，他把自己关了一整个上午，写出的东西题目冗长拗口：《关于信息管理的提案》。文件在同事间传了一圈，多数人看不懂，只有一个人读过之后在封面批了一行字：很模糊，但令人兴奋。\n\n那行批注，是历史轻轻叩门的声音。\n\n## 每台电脑都是一座孤岛\n\n那时候，科学家的电脑里存着海量的数据，却彼此隔绝。你在这一台机器上查到的东西，另一台机器上没有，也不可能有。信息像货物一样被锁在一座座孤岛上，搬运全靠人力，重复又浪费。伯纳斯-李在实验室里受够了这种折磨，他想要的东西其实很简单：让所有电脑能互相说话，让人点击一个词，就能跳到世界上任何一处的资料上去。\n\n当时没人觉得这事值得做。他只能在下班之后自己动手，把想法变成一台能看、能编辑网页的机器，顺手发明了网址、超链接、网页语言这三样今天的常识。1991 年，全世界第一个网站在他手里上线，地址叫 info.cern.ch，页面内容简单到近乎可笑：教你怎么使用万维网。\n\n这个简单到可笑的东西，后来吞掉了整个人类文明。\n\n## 他本可以收下全世界的钱\n\n最容易被忽略的一步，发生在一个办公室里。别人做发明，想的是专利、授权费、成立公司、赚到盆满钵满。伯纳斯-李也清楚这条路能带来多少财富，他完全可以像同时代的软件大亨一样，靠一张张授权书成为亿万富翁。但他没有。他把万维网的核心技术无条件公之于众，不收一分钱，不要任何回报，还牵头成立了中立的万维网联盟，让这张网不被任何一家公司据为己有。\n\n他后来说过，当初要是收费，今天的世界会是另一副模样，网络会分裂成互不相通的付费岛屿。而他最怕的，正是那副模样。\n\n代价是真实的：他没靠发明富起来，几十年如一日守在这件事旁边，为一件自己早已送出去的东西操心。如今他是麻省理工的教授，还在为网络的开放四处奔走。看着 1989 年那份提案长成全世界离不开的血管网，他比谁都清楚，这条河正在变脏，也正在被少数巨头的堤坝收拢。他一边庆祝，一边战斗。\n\n## 活着见证自己的发明，是另一种奢侈\n\n这个专栏里写的大多数人，都是死后几十年才被重新记起。伯纳斯-李是少有的例外：他亲眼看着自己 1989 年的构想，长成几十亿人每天离不开的东西。2012 年伦敦奥运会开幕式，全世界的注视中，场馆的屏幕上滚过一行字。那是他写给全世界的信，也是他一生最准确的一句自我总结。\n\n## 他说过\n\n> 这一切，是为了每一个人。\n", "field": "计算机"}, {"title": "一束光，从两条缝里同时穿过", "subtitle": "托马斯·杨｜6月13日诞辰", "date": "06-13", "slug": "06-13-young", "file": "scientists/06/06-13-young.md", "content": "# 一束光，从两条缝里同时穿过\n\n## 托马斯·杨｜6月13日诞辰\n\n1803 年，一间遮得严严实实的暗室里，一束细细的光被挡板切成两半，同时穿过两条缝隙，落在远处的屏幕上。屏上出现了一道道明暗相间的条纹。站在屏前的年轻人知道，自己刚刚做了一件得罪整个科学界的事：他用一束光，证明了牛顿说错了。\n\n可当时没有一个人相信他。\n\n## 六岁就把《圣经》读了两遍的孩子\n\n托马斯·杨几乎是被知识喂养大的。两岁能阅读，六岁把《圣经》从头到尾读了两遍，还顺手开始自学拉丁文；少年时代精通十二种语言，亲手做显微镜和望远镜，除了历史、法律、音乐，还自己啃下了牛顿那套艰涩的微积分和《光学原理》，以及拉瓦锡的化学。这样的天才，日后被称作\"世界上最后一个无所不知的人\"。\n\n可他最初的正业是医生。从十八岁到二十八岁，他发表的论文都围绕视觉：研究眼球的水晶体怎么调焦，并率先提出眼睛靠三种感光细胞接收不同波长的色光，才产生彩色视觉。这套理论，让他成了生理光学的开创者。没人想到，一个研究眼睛的人，会反过来挑战物理学的圣人。\n\n## 全世界都信牛顿，他偏要当唯一的反方\n\n牛顿说过，光是一颗颗微粒。这个说法统治了科学界一百多年，没人敢质疑，也没人想质疑。1800 年，杨发表了科学史上第一篇描述波的干涉现象的论文，然后一路追下去，用绕射、干涉的证据证明：光是一种波，不是粒子。\n\n1803 年的双缝实验，是他手里最重的一张牌。光同时穿过两条缝，在屏上留下的不是两道光斑，而是明暗相间的条纹。这只能用波来解释，粒子做不到。他把证据摆得清清楚楚，可权威比证据更重。粒子说的拥护者搬出牛顿的名头，一次又一次把他按下去。直到多年后，法国物理学家菲涅耳拿出更严密的理论和实验，波动说才从十九世纪二十年代起逐渐被接受。也就是说，杨是对的，但他一个人对了将近二十年。\n\n## 一百多年后，物理学家在他身后排队\n\n故事最离奇的部分，杨本人永远看不到了。一个世纪以后，物理学家把双缝实验换了换主角，不再用光，改用电子、质子，甚至由六十个碳原子组成的巴克球，让它们一个个穿过两条缝。结果它们全都留下了干涉条纹，全都表现得像波。\n\n一道光、一条缝、一次固执的实验，成了量子力学最经典的证明，也是哥本哈根诠释最强有力的佐证。当年被嘲讽的\"疯子\"，给后世留下了至今还在让物理学家挠头的谜。杨还做过别的：他发挥语言天赋，率先认出罗塞塔石碑上重复出现的外框符号是\"托勒密\"这个名字的读音，为商博良破译埃及象形文字递上了第一把钥匙；材料力学、表面张力、血液流动、音乐的平均律，他都留下过手笔。\n\n可惜这位无所不知的人，没能活到五十六岁。他太早出生，也太早离开，像一束穿过缝隙的光，明明照着远处，却要等很久，人们才看见那道亮。\n", "field": "物理/医学"}, {"title": "基因纹丝不动，她偏说它在跳", "subtitle": "麦克林托克｜6月16日诞辰", "date": "06-16", "slug": "06-16-mcclintock", "file": "scientists/06/06-16-mcclintock.md", "content": "# 基因纹丝不动，她偏说它在跳\n\n## 麦克林托克｜6月16日诞辰\n\n1983 年，斯德哥尔摩的领奖台上，一位 81 岁的美国老太太独自走上前。她是史上唯一一位独自获得诺贝尔生理或医学奖的女性。而这份荣耀所嘉奖的发现，她早在三十二年前就已经做出来，并为此挨了整整几十年的白眼。\n\n麦克林托克的一生，就是一部\"对得太早\"的故事。\n\n## 短头发、长裤子，和一个不肯认输的女儿\n\n二十世纪二十年代的美国，母亲盼她像别的女孩一样，结婚生子、相夫教子。她偏要念大学，走上学术之路；一进大学就剪了短发、穿上长裤，任周围的目光扫过。博士毕业后，性别歧视挡在面前，她拿不到大学教职，只能接受一个研究助理的职位，只为能继续摆弄她的玉米。\n\n玉米是她的田野，也是她的命。靠着对玉米基因重组和减数分裂一连串先驱性的研究，她很快在二十世纪三十年代被公认为遗传学大师。这个位置，她坐得理直气壮，没人质疑。\n\n## 1951 年，她宣布基因会\"跳\"\n\n1951 年，麦克林托克把多年的实验结果摆了出来：基因不是老老实实待在染色体上，它们会从原来的位置\"跳\"到别处去。当时的主流共识是，基因的排列顺序固定不变，只会单向下达指令去制造蛋白质，绝不可能像她说的那样，细胞还会回头给基因下命令换位置。\n\n结论一公布，学界炸了锅。这不是新发现，这是异端邪说。麦克林托克从此被科学界冷落、忽视。冷泉港实验室里，同门的华生和克里克在 1962 年捧回诺贝尔奖，受尽簇拥与掌声；她的实验室，名副其实成了冷宫。双螺旋破解之后，整个遗传学狂飙突进冲进分子生物学的深海，大家拼命往最底层去挖遗传密码，她偏要逆流而上，去研究更高层次的适应与调控，去追问基因在生命整体里怎么动。她的学说本来就晦涩复杂，如今更显得不合时宜。\n\n她没有辩解，也没有回头，只是回到玉米田里，一个人继续数着那些斑驳的籽粒。\n\n## 三十年，足够证明一个异端\n\n之后的二三十年里，分子生物学家们一个接一个撞上解释不了的例外情况，越来越多的证据指向同一个方向：那些会\"跳\"的基因，普遍存在。人们这才想起那个被冷落多年的老太太，才发现她说的都是真的。转位因子，如今已经是教科书里的常识。\n\n1983 年，她终于拿到应得的肯定。那一年她 81 岁，头发全白，独自站在全世界的目光里。有人问她，被误解这么多年是什么滋味。她没有诉苦，因为在那些寂寞的年月里，她从来没怀疑过自己。后来她总结自己的一生时说，她只是比其他人更有耐心，更愿意在一个问题上多待一会儿。\n\n她提前三十年看见了生命的真相，然后独自站在原地，等世界追上来。\n\n## 她说过\n\n> 我并不是特别聪明，我只是比其他人花更长的时间，钻研同一个问题。\n", "field": "生物/遗传"}, {"title": "那个让机器开始思考的人", "subtitle": "图灵｜6月23日诞辰", "date": "06-23", "slug": "06-23-turing", "file": "scientists/06/06-23-turing.md", "content": "# 那个让机器开始思考的人\n\n## 图灵｜6月23日诞辰\n\n他留下了两个词，一个改变了战争，一个定义了未来。\n\n战争那个词叫「图灵机」——它不只是二战的密码破译机，它是今天每一台电脑的祖先。未来那个词叫「图灵测试」——直到今天，人类判断一台机器是否「会思考」，用的还是他七十多年前设计的游戏。\n\n但图灵本人的人生，却是一个被时代辜负的故事。\n\n## 中学时代：一段没能说出口的初恋\n\n1926 年，14 岁的图灵进入英国谢伯恩中学，遇见了一个叫莫康的少年。莫康和他一样痴迷科学，却比他更耀眼。在图灵眼里，莫康浑身发光，让周围的一切都黯淡下去。他们成为知己，但图灵只能把爱慕藏在心里。\n\n三年半后，莫康死于肺结核。图灵连开口的机会都没有了。\n\n这个打击改变了他。从悲痛里爬出来的图灵，把自己活成了两个人的份量。1931 年，他考进了莫康生前获得奖学金的剑桥大学——同一所学校，替好友走完没走完的路。而就在这一年，哥德尔提出了不完备定理：数学体系不可能既完备又一致，数学家的「圣杯」碎了。\n\n五年后，图灵用一篇论文回应了这个困局。\n\n## 一张纸上的机器\n\n这篇论文叫《论可计算的数字》，里面设想了一台机器：它有一条无限长的纸带，机器按规则在纸带上印下符号，符号既是它的状态，也是它下一步动作的依据。这台能用二进制程序模拟任何数学运算的机器，就是后来著名的「图灵机」。\n\n它从未被造出来，它只是被「想」了出来。但图灵证明了：有些问题，任何机器都永远算不完；而且你根本没法提前判断一台机器会不会停下来。这意味着数学里有「无法被证明、也无法被否定」的界限——用计算机的语言，重新演算了一遍哥德尔的定理。\n\n图灵机是纯理论。但正是这个理论，成了后来所有电子计算机的设计蓝图。\n\n## 一战封神的破译：靠炸弹机赢下战争\n\n二战爆发，图灵被征召去破译德军的密码。德军的「谜」加密机（Enigma）用多重字母加密，盟军即使缴获了机器本体，也解不开上面上百万种设定。\n\n图灵不止搞数学，他直接造了一台名叫「炸弹」的机器，模拟谜机的运作规律，把上百万种组合穷举过去。密码破了。盟军从此能提前读到德军的军事部署，战争提前结束，无数生命因此得救。\n\n但这段功绩被英国政府捂了几十年。战争结束后，他们甚至把缴获的谜机分发给殖民地政府，谎称这是最安全的通讯方式，好用来监听对方。\n\n## 一个时代最可耻的审判\n\n战后，图灵继续研究电脑。1949 年，他抛出一个问题：机器能思考吗？他设计了一个模仿游戏——如果你跟一台机器对话，却分辨不出它是人是机器，那它就具备思考能力。这就是「图灵测试」，今天人工智能领域仍在用它，你每天上网填的验证码，也是同一个概念的产物。\n\n如果没有 1952 年那场窃案，他或许会一直研究下去。\n\n那一年，图灵家中失窃。警察来调查时，他坦承了自己与一名男子的恋人关系——那个年代的英国，同性恋是犯罪。他面临两个选择：入狱，或接受「治疗」。他选了治疗，然后被注射了整整一年雌激素。\n\n激素摧毁了他的身体，也摧毁了他的意志。他被赶出实验室，被贴上性罪犯的标签。\n\n1954 年 6 月 7 日，41 岁的图灵在卧室里，咬了一口浸过氰化物的毒苹果。一代「计算机科学之父」，就这样离开人世。\n\n## 迟到的公道\n\n图灵死后五十年，真相才开始浮出水面。1970 年代，谜机全部退役，英国政府才公布破译密码的历史——人们这才知道，这个被国家羞辱的人，曾是这个国家最伟大的战争功臣之一。\n\n2009 年，英国首相公开道歉；2013 年，英国女王赦免了他的罪名。\n\n如今，图灵机是现代计算科学的基石，图灵测试是人工智能的终极考题。而他自己的故事，成了整个科技史里最让人痛心的一课——天才可以改变世界，却不一定救得了自己。\n\n## 他说过\n\n> 我们只能看到前方很短的距离，但可以看到那里有很多值得做的事。\n", "field": "计算机/数学"}, {"title": "九万六千六百二十盏灯，同时亮起", "subtitle": "特斯拉｜7月10日诞辰", "date": "07-10", "slug": "07-10-tesla", "file": "scientists/07/07-10-tesla.md", "content": "# 九万六千六百二十盏灯，同时亮起\n\n## 特斯拉｜7月10日诞辰\n\n1886 年，纽约的一处建筑工地上，一个日薪两美元的工人正跟同事大吐苦水。他带着塞尔维亚口音，一边咒骂着爱迪生的可恶，一边兴奋地讲他的发电梦想。旁边的工人只当他在说疯话，没人知道这个扛着砖头的人，脑子里装着一整套足以改写世界的图纸。\n\n他叫特斯拉，是那个时代最耀眼的发明家，也是被那个时代辜负得最彻底的人。\n\n## 被同一个雇主，骗了两次\n\n四年前，特斯拉在爱迪生的欧洲分公司工作。他解决了一个又一个工程难题，还挽救过一次重大危机，满心以为能拿到高额奖金，去造他梦寐以求的交流发电机。结果公司食言了。他忍了两年，揣着分公司总经理的推荐信去了美国，到纽约投奔爱迪生本人。\n\n爱迪生热情接待了他，却压根不信他。在爱迪生眼里，这位满嘴理论的高个子是个不切实际的空谈家，自己那套试错出来的直流电才是真理。爱迪生丢给他一个悬赏五万美金的难题：让直流发电机同步运转。特斯拉把它解决了。然后爱迪生哈哈大笑，说这是美国人的幽默，奖金当然没有。\n\n他连着被骗了两次，这次头也不回地走了。他决定一个人，把交流电做出来。\n\n## 一个建筑工人，点亮了一座城\n\n积蓄很快花光，他只能去工地搬砖，一天两美元。这一搬就是一年，他把苦水倒给工友，也把梦想说给他们听。没想到这些话传到西联电报公司一位主管的耳朵里。1887 年，资金来了，公司成立了，发电机原型做出来了。他在一场演讲里讲得眉飞色舞，台下坐着西屋公司的创办人威斯汀豪斯，一听就拍板，要全力资助交流电。\n\n爱迪生不会坐视不理。他通过媒体夸大交流电的致命危险，还游说纽约监狱改用交流电执行死刑，想用恐惧杀死这门技术。可直流电天生的短板，挡不住交流电的优势。1893 年芝加哥万国博览会，西屋公司用特斯拉的系统点亮了九万六千六百二十盏灯泡，宣告家庭照明新纪元的到来。那是交流电的胜利，也是特斯拉对爱迪生的复仇。\n\n## 他想要的，是整个世界的免费电\n\n特斯拉的野心比这大得多。1891 年他造出特斯拉线圈，能隔空产生感应电流，顺路还发明了广播、无线电、遥控器。他梦想建一座高塔，把消息直接发到大西洋对岸，再造三十座这样的塔把全世界连起来，让每个人都能免费获得无线电力。\n\n这个梦太大了。1904 年，他的无线电专利突然被撤销，转授给了后发先至的马可尼。金主们立刻掉头，资金断了，积蓄耗尽，他只能变卖所有设备和资产。1934 年，他搬进纽约一家小旅馆，靠西屋公司每月一百二十五美元的接济过活。1943 年，他独自死在旅馆房间里，身边只有他平时喂食的鸽子。\n\n爱迪生成了教科书里的伟人，特斯拉被历史遗忘了数十年。直到今天，人们才慢慢想起，那个在工地上讲疯话的人，才是把整个世界带进电气化时代的先知。\n\n## 他说过\n\n> 现在属于他们，而我真正为之工作的未来，属于我。\n", "field": "物理/工程"}, {"title": "他种了八年的豌豆，换来三十四年的沉默", "subtitle": "孟德尔｜7月20日诞辰", "date": "07-20", "slug": "07-20-mendel", "file": "scientists/07/07-20-mendel.md", "content": "# 他种了八年的豌豆，换来三十四年的沉默\n\n## 孟德尔｜7月20日诞辰\n\n1856 年，奥地利一座修道院的后院里，一个修士正蹲在豌豆田边，拿着小刷子小心翼翼地给花授粉。花园不大，种的都是最不起眼的豌豆，没有人在意这个人在做什么，也没有人愿意多看他一眼。他在这里蹲了八年，数了大约两万九千株豌豆，记下每一颗种子的形状和颜色。\n\n当时没人知道，人类关于遗传的全部秘密，就藏在这片没人搭理的花园里。\n\n## 一个考不上教师资格的穷学生\n\n孟德尔出生在捷克的一户农家，家境贫寒，靠妹妹拿出嫁妆资助，才勉强读完了三年地区学院。后来他进了修道院当见习僧，才得以免费跟着院里那些钻研科学的修士学习。试了一年的神职，他发现自己并不适合，便请求去中学当代课老师。他教得很好，口碑极佳，学校请他参加资格考试转正，他却偏偏栽在生物学和地质学上，没考过。\n\n教会看中他的才华，送他去维也纳大学进修。在那里，他从物理学学到的实验方法，从数学学到的统计学，成了日后解开遗传之谜的两把钥匙。他自己大概也没想到，一场失败的考试，竟把他推上了那条通往真理的路。\n\n## 两万九千株豌豆，和一条被拒绝的真理\n\n1854 年，他在院里辟出一块园地种豌豆，先花两年确认了七种可以追踪的特征：种子的形状与颜色、豆荚的形状与颜色、花的位置与颜色，以及茎的长短。1856 年起，他一遍遍人工杂交，让豌豆相互配对，再清点每一代后代的性状和数量。八年，约两万九千株，他像记账一样记满了每一个数字。\n\n结论终于浮出水面：每一种性状都由一对因子决定，这对因子分别来自上一代的某一个，来自哪个、如何配对都是随机的；因子有显性和隐性之分，只有两个隐性配在一起，隐性性状才显现。这套规律，就是今天人人都听过的\"基因\"。1865 年，他读完了自己的论文，把它发表出去。\n\n然后，世界沉默了很久。也许因为他只是个修士，不在学术圈内；也许因为他随后当上修道院院长，被行政事务缠身，拿不出后续的系列研究；也许因为他超前太多，同时代的人根本理解不了。总之，这篇论文躺了三十四年，无人问津。连达尔文都没读到过它，演化论提出之后，达尔文一直苦于说不清遗传的机制，只能用一套笨拙的猜想硬撑。两位改变世界的人，就这样错过了彼此。\n\n## 1900 年，三个人同时想起他\n\n1900 年，三位做遗传研究的科学家对着自己困惑的实验结果，各自翻资料，竟不约而同地找到了孟德尔三十四年前的那篇论文。答案就在那里，一字不差。遗传学由此真正开启，孟德尔也成了后世尊称的\"遗传学之父\"。\n\n只是这一切，他已经看不到了，他去世于十六年前。那个用八年光阴和两万九千株豌豆叩问生命的人，用一句今天读来仍然发烫的话，给自己的一生做了注脚。\n\n## 他说过\n\n> 我的时代终将到来。\n", "field": "生物/遗传"}, {"title": "他们先学会了，从月球撤退", "subtitle": "人类登月｜7月21日事件", "date": "07-21", "slug": "07-21-moon-landing", "file": "scientists/07/07-21-moon-landing.md", "content": "# 他们先学会了，从月球撤退\n\n## 人类登月｜7月21日事件\n\n1969 年 7 月 20 日，阿波罗 11 号的登月舱「鹰」在月球静海降落。全世界 6 亿人守在电视机前，看着模糊的电视画面里，一个白色身影沿着梯子走下，在灰色月面上踩下第一个脚印。\n\n但很少有人记得：就在那之前几分钟，这趟旅程差点以另一种方式结束。\n\n## 燃料只够 25 秒\n\n登月舱的电脑比今天任何一台手机都简陋得多。降落过程中，系统一路报警，主电脑反复过载。更要命的是，预先选定的降落点是一片布满巨石的区域，鹰号如果落到那里，起落架会折断，任务直接报废。\n\n阿姆斯特朗接管了手动操作，在月面上空多飞了几百米，避开巨石，才找到一块平坦的着陆点。等鹰号落地时，机上的燃料只剩下够支撑 25 秒的量。从启动着陆程序到踩到地面，一共用了 12 分钟，这 12 分钟里，地球上所有人心都悬着。\n\n## 40 万人，8 年，一次\"要活着回来\"的赌注\n\n整个登月计划背后，是 1961 年肯尼迪的宣言：十年内把人送上月球，再安全带回来。此后 8 年间，美国动员了 40 万人、2 万家企业、上百所大学和研究中心。\n\n这不是一次技术表演，是一场赌上国运的赌注——而赌局真正的规则，从肯尼迪那句话里就写死了：不是\"上去\"，是\"上去再回来\"。后来所有载人航天任务都把「安全返航」放在第一位，就是从这次起定的规矩。\n\n## 带回 21.5 公斤的答案\n\n鹰号离开月球时，带走了 21.5 公斤月岩。这些石头后来被证明约有 45 亿岁，几乎和地球一样古老。它们帮人类第一次搞清楚：月球和地球的成分惊人地相似，极可能诞生自同一场撞击。\n\n登月舱留在月球上的那面脚印，被 6 亿人见证了第一脚，却再没有第二个人去踩——1972 年之后，人类再没踏上过月球半步。那一段又短又长的记忆，成了全人类共有的、关于\"我们曾经去过更远的地方\"的证据。\n\n## 他们说\n\n> 这是个人迈出的一小步，却是人类迈出的一大步。——阿姆斯特朗\n", "field": "航天"}, {"title": "一张编号为 51 的照片", "subtitle": "罗莎琳·富兰克林｜7月25日诞辰", "date": "07-25", "slug": "07-25-franklin-rosalind", "file": "scientists/07/07-25-franklin-rosalind.md", "content": "# 一张编号为 51 的照片\n\n## 罗莎琳·富兰克林｜7月25日诞辰\n\n1952 年，伦敦国王学院的一间暗室里，一个年轻女人正在冲洗一张底片。等影像浮出来，她屏住了呼吸：画面上是清晰的十字形衍射图案，像一朵被冻住的黑白雪花。后来有人把这照片称为\"几乎是有史以来最美的一张 X 光照片\"。\n\n她不知道，这张编号第 51 号的照片，会成为二十世纪最著名的一次科学\"失窃\"的物证，也会写就她一生的遗憾。\n\n## 一场从安排错位就开始的战争\n\n富兰克林 1951 年年初来到国王学院时，已经是 X 光晶体绕射技术的高手。她原本以为要研究的是蛋白质结构，谁知主任兰道一开口，就让她接手威尔金斯手里的 DNA 研究。她听了安排，兰道却忘了通知正在度假的威尔金斯。威尔金斯回来发现自己的地盘被占了，自然不甘，两个人就这样结了梁子。\n\n兰道只好把项目一分为二：富兰克林负责 A 型 DNA，威尔金斯负责 B 型 DNA。这是她自己发现的分野，DNA 在干燥和潮湿状态下结构不同，前者短而粗，后者细而长。她在暗室里一点点调整水分，把样品拍得越来越清晰，誓要拍出铁证。\n\n## 她拍了真相，却迟迟不肯说\n\n富兰克林做实验的毛病，后来被历史反复提起：她太小心了。到了 1951 年底，威尔金斯几乎已经确定 B 型 DNA 是螺旋状，只是结构不明；富兰克林其实也有同样的念头，但她坚持要搜集更多证据，怕误判，怕草率，迟迟不肯发表。对她来说，一张漂亮的照片不等于一个可信的结论。\n\n1953 年 1 月 30 日，改变历史的一幕发生了。威尔金斯没经过富兰克林同意，把那张第 51 号照片拿给登门求合作的华生看。华生只看了一眼就恍然大悟，回去跟克里克连夜搭出了 DNA 双螺旋模型，三月份就投给了《自然》。论文发表后，富兰克林看了一眼，只说了句：它很美丽，但他们要怎么证明？她一直都有同样的想法，只是她不肯在没有证据的时候抢先开口。\n\n## 迟来四五十年的道歉\n\n后来的事，写进了所有生物学课本：1962 年，华生、克里克和威尔金斯共同登上诺贝尔奖的领奖台。富兰克林没有资格了，她在四年前因卵巢癌去世，年仅三十七岁。诺贝尔奖不颁给逝者，而她在生前，也一直没有得到应有的承认。获奖者在致辞里没有感谢她，华生甚至在自己的自传里，用男权主义的腔调嘲讽过她。直到四五十年后，他才公开承认，富兰克林的研究成果是他们破解双螺旋的关键。\n\n那张她亲手拍下的照片，被没有她同意的人拿走了，换来了三个人的荣耀，和她自己的被遗忘。人们记住华生、记住克里克，却很少记得那个在暗室里冻红手指的女人。所幸还有人在一遍遍提起她的名字，像反复冲洗一张底片，让真相慢慢显影。\n\n## 她说过\n\n> 它很美，但他们要怎么证明？\n", "field": "生物"}, {"title": "一篇被弄丢的论文，和一个迟到的教授聘书", "subtitle": "阿贝尔｜8月5日诞辰", "date": "08-05", "slug": "08-05-abel", "file": "scientists/08/08-05-abel.md", "content": "# 一篇被弄丢的论文，和一个迟到的教授聘书\n\n## 阿贝尔｜8月5日诞辰\n\n1826 年 10 月，巴黎科学院，一个二十四岁的挪威青年交上一篇论文，题目是《关于一类广泛的超越函数》。他想，这篇文章足够他体面地留在巴黎，也足够还清游学的债。他把稿子交给科学院，回家等消息，一等就是一年。后来人们才知道，稿子被带回家的评审柯西随手搁在一边，弄丢了。\n\n## 穷牧师家的孩子，遇上一个认字的老师\n\n阿贝尔出身挪威芬岛一个牧师家庭，父亲教书，也穷得叮当响。他十三岁进奥斯陆的天主教学院，成绩平平，直到数学老师霍尔姆伯发现这个沉默寡言的少年总在课堂上答出他想都没想到过的解法。霍尔姆伯把大学数学的藏书一本本借给他，还垫钱替他买了欧拉的《无穷小分析引论》。\n\n十九岁那年，阿贝尔进了大学，一边读书一边到处借钱。家人等着他毕业后找份差事养活全家，他却一头扎进数学最硬的骨头：一般的五次方程，到底能不能用根式求解？\n\n## 薄薄一本小册子，寄给高斯就没了下文\n\n1824 年，他给出了答案：不能。他自费印了一本六页的小册子，证明一般五次方程没有根式解，寄给高斯、勒让德这些当时最权威的数学家。结果，一个回音都没有。高斯后来整理遗物时，人们发现那本小册子还带着寄出的封口，根本没被拆开。\n\n1825 年，挪威政府批下一笔游学经费，他揣着钱去了柏林，结识了正筹备创办数学杂志的克雷勒。克雷勒一眼看出这个年轻人的分量，把杂志的第一卷几乎都留给了他的椭圆函数论文。在柏林，阿贝尔的证明第一次有了知音，却依然换不来一份糊口的工作。\n\n## 巴黎的冬天，和他擦肩而过的大奖\n\n1826 年夏天他南下巴黎。那时巴黎学派的数学正处在高峰，柯西、勒让德都在科学院，他满心以为，一篇够分量的论文足够打开法国学界的大门。可法国人没空理一个从北欧来的穷小子，稿子又偏偏落到柯西手里，被带回家弄丢了。他等了一年，一文钱的报酬也没等到，盘缠耗尽，又病倒了。\n\n1827 年他拖着病体回到挪威，靠给军事学院代课勉强度日。冬天咯血，病情一次次加重。1829 年 4 月 6 日，阿贝尔死在奥斯陆，二十六岁。他死后两天，克雷勒的信到了，信上说，柏林大学决定聘他当教授。\n\n死讯传到巴黎，科学院追授他大奖，与雅可比分享。他没能活着看到自己预言的椭圆函数理论成为一门学科，也没能用上那份聘书。一百七十四年后，挪威政府以他的名字设立了数学界最重的奖项之一，阿贝尔奖。\n\n## 他说过\n\n> 要想在数学上取得进展，就要去研究大师，而不是大师的学生。\n", "field": "数学"}, {"title": "一坨发霉的意外，改写了人类命运", "subtitle": "弗莱明｜8月6日诞辰", "date": "08-06", "slug": "08-06-fleming", "file": "scientists/08/08-06-fleming.md", "content": "# 一坨发霉的意外，改写了人类命运\n\n## 弗莱明｜8月6日诞辰\n\n1928年9月初，英国细菌学家弗莱明结束假期，回到伦敦圣玛丽医院的实验室。工作台角落堆着一叠培养皿，其中一只，是他离开前忘了收好的葡萄球菌培养皿。他无奈地打算清理，手却停在了半空：培养皿里本该长满葡萄球菌，唯独一团绿色霉斑的周围干干净净，像是被谁悄悄擦掉了一块。\n\n他盯住那圈异常的空白，心里浮起一个念头：莫非这种霉菌，能杀死葡萄球菌？\n\n## 七年，才换来这一眼\n\n弗莱明把霉菌分离出来，反复实验后发现，它会分泌某种物质，不仅杀得死葡萄球菌，对其他多种革兰氏阳性菌也有效。他把这种分泌物命名为青霉素，也就是后来通称的盘尼西林。人类历史上第一种抗生素，就这样在一只忘收拾的培养皿里出生。\n\n很多人说他运气好，接住了一场天降的意外。但请记住：在霉菌的孢子落进培养皿之前，弗莱明已经埋头于抗菌研究整整七年。正因为那些年磨出来的一双眼睛，他才能在一堆脏兮兮的培养皿中间，一眼认出那圈空白意味着什么。科学从来没有什么侥幸，先有七年的准备，才有资格谈那一秒钟的幸运。\n\n## 挖到金矿，却十年搬不动\n\n然而发现之后，是更长的冷板凳。\n\n第二年他发表论文，却再没了下文。他的化学基础不够，提不出大量提纯青霉素的办法；手头又没有临床案例佐证疗效，医学界根本没把这篇论文当回事。到了1935年，又有一种磺胺剂被发现能杀菌，他这条线索更被挤到了角落。他明明挖到了一整座金矿，却怎么都撬不动——这大概是弗莱明一生最憋闷的几年。\n\n直到1939年，牛津大学的病理学教授弗洛里偶然翻到他的论文，与旅居英国的德国生化学家钱恩合作，才打通了批量生产青霉素的路，并用临床实验证明了它的疗效。青霉素随即在第二次世界大战里，救回无数受伤感染的士兵。1945年，三个人共同登上诺贝尔医学奖的领奖台。\n\n## 一语成谶的警告\n\n功成名就的弗莱明，没有一丝得意。他反而一次次站在演讲台上提醒人们：不要轻易使用青霉素，否则会养出产生抗药性的细菌。这个警告在当时听来近乎扫兴，可几十年过去，抗生素被滥用后酿成的后果，一字一句地验证了他当年的远见。\n\n大多数人都看得见霉斑，只有他看懂了霉斑周围那片空白。七年隐忍，换来一眼；一眼背后，是一场迟到了十一年的胜利。所谓幸运，其实长在日复一日的专注里。\n\n## 他说过\n\n> 这真有趣。\n", "field": "医学"}, {"title": "一块头骨，一个家族，和人类起源的地图重绘", "subtitle": "李基家族｜8月7日诞辰", "date": "08-07", "slug": "08-07-leakey-family", "file": "scientists/08/08-07-leakey-family.md", "content": "# 一块头骨，一个家族，和人类起源的地图重绘\n\n## 李基家族｜8月7日诞辰\n\n1959 年 7 月 17 日，坦桑尼亚奥杜威峡谷。玛丽·李基趴在地上，刮开一层火山灰，露出一块牙床完整的头骨化石。她的丈夫路易斯·李基正病在床上，是儿子开车狂奔回来报的信。路易斯从床上跳起来，用基库尤语冲着女儿喊：快拿水来！他太激动了，只能用部落的语言说话。\n\n## 传教士的儿子，长成了基库尤人\n\n路易斯·李基 1903 年出生在肯尼亚，父亲是英国传教士，他却在基库尤人的部落里长大。他讲基库尤语像讲英语一样流利，十几岁就参加了部落的成年仪式，夜里睡在茅屋里，学会了用部落的方式看世界。这段经历给了他一个后来影响深远的直觉：非洲不是文明地图上的空白，而是人类真正的老家。\n\n在剑桥读完人类学后，他几乎把一生都交给了东非。1931 年他第一次走进奥杜威峡谷，这片被水冲出的峡谷像一本翻开的地层书，他在这里一挖就是三十多年。\n\n## 三十年的冷板凳，等一个证据\n\n当时的主流观点是，人类起源于亚洲。北京猿人、爪哇猿人的头骨早已轰动世界，非洲则被认为只是人类演化的旁观者。路易斯不信这套，但证据迟迟不出现。他挖了几十年，骨头挖出不少，够分量的一件没有。学术界笑他是「那个总在东非挖石头的传教士儿子」。\n\n1959 年，连路易斯自己都病倒在家，命运却选了这一天。玛丽在峡谷里发现的那块头骨，距今约一百七十五万年，比亚洲任何一块人类化石都古老得多。他们给它取名「东非人」，又叫它「亲爱的男孩」。人类起源的指针，第一次被一块来自非洲的化石拨了回来。\n\n## 三代人，把答案钉在非洲大陆上\n\n紧接着，1960 年，路易斯的团队又发现了一副更惊人的骨架：能人。这个名字的意思是「手巧的人」，约一百九十万年前，是目前已知最早会制造工具的人属成员。原来早在北京猿人之前几十万年，非洲的祖先已经开始使用石头。\n\n路易斯 1972 年去世后，接力棒传给了儿子理查德·李基。理查德在肯尼亚图尔卡纳湖东岸发掘，1972 年找到了著名的 1470 号头骨，把人类的历史又往前推了推。玛丽则继续守着奥杜威，晚年又带队发现了距今三百五十万年的拉多利脚印，两行脚印踩在火山灰上，证明那时的人类祖先已经直立行走。\n\n这个家族还做了一件少有外人知道的事：路易斯晚年一手资助了三位年轻女性，珍·古道尔研究黑猩猩，黛安·福西研究山地大猩猩，比鲁特·加尔迪卡斯研究猩猩。今天说起灵长类研究，绕不开她们三个的名字。\n\n三代人，一个峡谷，一片湖岸。他们用一百多年，把人类起源的地图从亚洲重新画回非洲。今天每一个关于「我们是从哪来的」的答案里，都有李基家族铲子的痕迹。\n\n## 他说过\n\n> 非洲是人类的摇篮。\n", "field": "人类学"}, {"title": "沉默到极致的预言家", "subtitle": "狄拉克｜8月8日诞辰", "date": "08-08", "slug": "08-08-dirac", "file": "scientists/08/08-08-dirac.md", "content": "# 沉默到极致的预言家\n\n## 狄拉克｜8月8日诞辰\n\n一场物理学演讲结束，听众提问。有人举起手，说自己不懂黑板右上方那条方程式。台上的狄拉克看着他，一言不发，盯了超过一分钟。主持人打圆场，请他回应，他这才摇了摇头，吐出两句轻飘飘的话。\n\n这位物理学家以沉默闻名，剑桥的同事甚至发明过一个单位：一小时说一个字，就是一个「狄拉克」。谁也没想到，正是这样一个惜字如金的人，在三十一岁那年，改写了量子力学的版图。\n\n## 一份找不到的工作，逼出一个天才\n\n1921年，电机系毕业的狄拉克原本想顺着专业当个工程师。可战后的英国经济还没缓过气，他竟找不到工作。权衡之下，他索性回校重读数学系——不用交学费，还有机会拿奖学金。两年后他顺利取得学位，又靠着奖学金进了剑桥攻读物理。\n\n他原本钟情相对论，在老师建议下接触到刚萌芽的量子力学，很快便看出：海森堡的矩阵力学与薛定谔的波动方程，其实是同一件事的两种说法。1928年，他把薛定谔方程与狭义相对论结合到一起，写下影响深远的狄拉克方程。这个方程不仅统一了量子力学的两块碎片，还预言了一种没人见过的粒子——电子的反物质。1932年，安德森真的在宇宙线里找到了它，取名正子。第二年，三十一岁的狄拉克与薛定谔共同站上诺贝尔领奖台。\n\n## 连诺奖都懒得领的怪人\n\n拿到诺奖，他的第一反应是拒领——怕自己成了众人围观的焦点。是卢瑟福劝他：你若真拒领，只会更出名。他这才打消念头。\n\n他到普林斯顿当访问学者时，担心报社不等他校稿就把访谈刊出去，跑去隔壁请教同事。同事建议他先发函要求报社「不得以任何形式发表」。他沉默了，和两位同事大眼瞪小眼。足足过了约十五分钟，他才开口：「你们不觉得『以任何形式』这几个字是多余的吗？」\n\n玻尔说他拥有物理学家中「最纯净的灵魂」，又叫他「最奇怪的人」。可这个怪人并非没有生活：他读书极广，从世界文学名著到间谍小说都读，爱看米老鼠卡通，还是歌星雪儿的粉丝。\n\n## 不肯妥协，是他的光也是他的影\n\n正是这份执拗，最后成了他的代价。他反对用「重整化」这种消除无穷大的计算技巧，与物理主流渐行渐远，此后一生，再没能做出重大的研究成果。唯一的悬念，留给他另一个预言——磁单极。只要它被证实，一切都另当别论。\n\n沉默是狄拉克的风格，也是他的牢笼。他把世界压缩进最简洁的方程，也因此在最该松口的地方，依然不肯多说一个字。一个用静默思考宇宙的人，最终被自己的静默困住了。\n\n## 他说过\n\n> 那并不是个问题，那只是评语。\n", "field": "物理"}, {"title": "那个被忽视了半个世纪的数字", "subtitle": "阿伏伽德罗｜8月9日诞辰", "date": "08-09", "slug": "08-09-amedeo-avogadro", "file": "scientists/08/08-09-amedeo-avogadro.md", "content": "# 那个被忽视了半个世纪的数字\n\n## 阿伏伽德罗｜8月9日诞辰\n\n1811年，一篇论文安静地出现在法国期刊《物理学杂志》上。作者是意大利都灵的一位律师出身的物理学教授，名叫阿梅代奥·阿伏伽德罗。他在文章里提出了一个当时几乎没有人愿意认真对待的想法：在相同温度和压力下，等体积的任何气体，含有相同数目的分子。这句话听起来平淡，却是整个现代化学的地基。没有人鼓掌。没有人回应。论文就这样沉进了学术史的泥沙里。\n\n## 他站在两个错误之间，选择了第三条路\n\n1811年之前，化学界有两个权威：道尔顿和盖-吕萨克。道尔顿用原子论解释物质，但他拒绝承认同种原子能结合在一起；盖-吕萨克用实验数据证明气体反应时体积成简单整数比，却解释不了为什么。两人的理论互相打架，谁也说服不了谁。\n\n阿伏伽德罗看出了症结：只要承认气体的基本粒子不是单个原子，而是由多个原子组成的「分子」，两边的矛盾就迎刃而解。氢气不是一个氢原子，而是两个氢原子结合的分子；氧气也是。这样，一体积氢气加一体积氯气，恰好生成两体积氯化氢，数字对上了。\n\n这个逻辑今天看来几乎是常识。但在1811年，他是在向道尔顿的权威开炮。道尔顿本人明确反对，认为同种原子之间没有结合的理由。欧洲化学界的主流选择站在道尔顿那边。\n\n## 沉默持续了整整四十九年\n\n阿伏伽德罗没有放弃。他在都灵大学教了将近三十年书，继续发表论文，继续完善分子假说。但欧洲大陆的化学家们开会、争论、制定原子量标准，从来没有把他的名字放进讨论中心。\n\n1856年，阿伏伽德罗去世。他没有等到那一天。\n\n1860年，德国卡尔斯鲁厄召开了第一届国际化学家大会。会议的核心议题，正是原子和分子的定义之争，化学界乱成一锅粥。意大利化学家坎尼扎罗在会上散发了一份小册子，系统整理了阿伏伽德罗四十九年前的假说，并用新的实验数据逐一验证。与会者当场被说服。那一年，「分子」这个概念才真正进入化学的官方语言。\n\n阿伏伽德罗已经死了四年。\n\n后来，科学家们用他的名字命名了那个数：每摩尔物质所含的粒子数，约为6.02×10²³。这个数字大到难以想象，一摩尔沙粒铺开可以覆盖整个地球表面数米深。它被刻进每一本化学教材，成为连接宏观世界和微观粒子的桥梁。\n\n他用一生等来的，是身后的承认。\n\n## 他说过\n\n> \"我们必须承认，等体积的不同气体，在相同温度和压力下，含有相同数目的分子。\"\n\n这句话写于1811年，被忽略了将近半个世纪，然后变成了整个化学的基石。\n\n<!-- 本卡由自动补写引擎生成，事实与引语请人工核对 -->\n", "field": "化学/物理"}, {"title": "天平之上，头颅之下", "subtitle": "拉瓦锡｜8月26日诞辰", "date": "08-26", "slug": "08-26-lavoisier", "file": "scientists/08/08-26-lavoisier.md", "content": "# 天平之上，头颅之下\n\n## 拉瓦锡｜8月26日诞辰\n\n十八世纪的化学，还是罩着神秘与魔幻外衣的炼金术。连牛顿那样的人物都曾沉浸其中，却始终没能像他在物理里创造奇迹那样，把它变成一门清楚的科学。直到一个巴黎人出现，迷雾才被一点点拨开。\n\n他叫拉瓦锡，后世称他「现代化学之父」。而他生命的结局，是一把落下的铡刀。\n\n## 为了养实验室，他把自己押上赌桌\n\n拉瓦锡生在巴黎的富裕人家。家人盼他当律师，他却常在课余研读化学、植物学、数学，毕业后也不急着执业，跑去考察矿区。二十六岁那年，他撞见一个「绝佳」的机会——税务官：只要预先垫付一笔税款给皇室，就能替皇家收税，多收的全进自己口袋，还免税。靠着这份稳定丰厚的收入，他买得起仪器，养得起一间像样的实验室，从此无后顾之忧地做学问。\n\n他以为这是通往科学殿堂的捷径。那一天他不会想到，这纸契约日后会写成他自己的死刑判决书。\n\n当上税务官的同年，他因研究石膏入选法国科学院院士。第二年，他把矛头对准「四元素说」的证据——「水经长时间加热会变成土」。他把实验里每一份质量的增减都称得清清楚楚，发现那些「土」根本不是水变的，而是来自装水的容器。一个流传数百年的说法，被一把天平轻轻推翻。\n\n## 一把天平，称碎了燃素说\n\n1772年，他向更大的庞然大物发难：燃素说。当时人们相信，物质燃烧时，会释放出藏身其中的「燃素」。拉瓦锡依然用定量的老办法，用一连串简洁的实验证明：金属燃烧后增加的重量，恰好等于空气减少的重量。没有燃素。他把参与燃烧的那种气体命名为「氧气」，算出它在空气中的比例，连「空气是单一元素」的旧观念一并推翻。他甚至指出，呼吸不过是体内的碳与氧结合，生成二氧化碳与热量——和燃烧一模一样。\n\n靠着这些实验，他坐实了质量守恒定律，又制定出统一的化学命名规范，让散落各地的科学家第一次有了共同语言。1789年，他出版史上第一本系统化的化学教科书《化学要论》，定义了元素的概念，首次列出三十三种元素。两年后，他以科学院院士的身份，起草了公制。\n\n## 革命的账，不认科学的功\n\n可惜，天平能称出氧气，称不出时代的癫狂。1793年，法国大革命向皇室清算，身为税务官的拉瓦锡跟着遭殃：科学院先被勒令关闭，接着他被逮捕拘禁，半年后走上断头台。他头颅落地的次日，数学家拉格朗日叹道：「砍下这颗头颅只需一瞬间，可是即使再过一百年，只怕再也找不到这样的头脑。」一年半后，他虽获平反，人却早已不在。\n\n他用一份聪明的契约换来了实验室，也亲手把自己的命押给了权力。化学从此成了一门精确的科学，而它的奠基人，倒在了革命最锋利的刀刃下。天平和铡刀，一样都不留情面。\n", "field": "化学"}, {"title": "射向纸巾的炮弹，弹了回来", "subtitle": "卢瑟福｜8月30日诞辰", "date": "08-30", "slug": "08-30-rutherford", "file": "scientists/08/08-30-rutherford.md", "content": "# 射向纸巾的炮弹，弹了回来\n\n## 卢瑟福｜8月30日诞辰\n\n1909年，研究助理盖格走进实验室，向卢瑟福报告一个古怪的结果：一些α粒子打在薄薄的金箔上，竟然被反弹了回来。\n\n卢瑟福的脑子里，立刻蹦出一个荒诞的画面——「这简直就像是朝着一张纸巾发射十五吋炮弹，结果炮弹却弹回来打到你自己！」他怔住了：原子里面到底藏着什么，能把这么重的粒子弹开？\n\n## 一颗比想象中更沉的「梅子」\n\n当时主流信奉的，是卢瑟福的老师汤姆森的原子模型：带正电的物质均匀铺满整个原子，电子像梅子一样，镶嵌在布丁里。可实验的结果摆在眼前：绝大多数α粒子穿过金箔毫无阻碍，说明「布丁」根本挡不住它们；而电子的质量小得可怜，绝不可能弹开比自己重三千多倍的α粒子。\n\n那么，那些被弹回来的粒子，究竟撞上了什么？\n\n卢瑟福给出了一个石破天惊的答案：原子内部，带正电的物质全部挤在极小的一处——原子核；电子则像行星绕着太阳，围着它打转。被弹回来的极少数α粒子，正是结结实实撞上了金原子的原子核。各种角度的散射，都和这套模型算出来的结果对得上。\n\n## 一场「弑父」般的犹豫\n\n模型是对的，卢瑟福却迟迟不敢发表。不是怕挑战权威，而是因为那位「权威」，是他的恩师。\n\n1895年，他从新西兰远渡重洋来到剑桥，跟着汤姆森做研究。在许多人眼里，他就是个从边陲来的土包子，等着看他的笑话。是汤姆森无私地指点他，帮他分辨出两种放射线，分别命名为α与β；他这才得以远赴加拿大担任系主任。后来他又发现α射线就是氦原子核，并利用半衰期算出地球上的一块岩石已有五亿年历史，一举打破「地球只有几千万岁」的迷信，1908年捧回诺贝尔化学奖——他自己也想不通，为何不是物理奖。\n\n如此恩师，让他公开打脸，多少带点弑父的味道。他一直在等一个不那么残忍的时机。两年后机会来了：汤姆森的一名学生发表了支持「正电均匀分布」的实验结果，卢瑟福便借驳斥这个结论，顺势亮出自己的实验与模型，避免正面攻击老师。1911年5月，论文正式发表。\n\n## 无人喝彩的真理，与桃李满天下的后来\n\n这篇划时代的论文，却没激起多大的波澜。它太反直觉了——原子内部空空荡荡，我们怎么不会一脚踩穿地板？它还带着一个致命硬伤：绕核旋转的电子，应当很快耗尽能量，一头栽进原子核，可这种事并没有发生。后来是卢瑟福的学生波耳，用量子力学修正了这个模型，「卢瑟福—波耳模型」成了此后数十年公认的原子图景，直到轨道让位给电子云。\n\n而在带学生这件事上，他更是惊人：他门下走出过足足十位诺贝尔奖得主。一个当年被人当笑话看的土包子，后来成了无数天才的引路人——他推翻了恩师的图景，也教会了更多年轻人，怎样亲手去推翻老师的图景。\n", "field": "物理"}, {"title": "他把地球拼成了一张网", "subtitle": "洪堡｜9月14日诞辰", "date": "09-14", "slug": "09-14-humboldt", "file": "scientists/09/09-14-humboldt.md", "content": "# 他把地球拼成了一张网\n\n## 洪堡｜9月14日诞辰\n\n1769 年出生在柏林一个贵族家庭，亚历山大·洪堡本可以什么都不用做。哥哥威廉·洪堡后来成了普鲁士的教育大臣，创立柏林大学，是那个时代最有权力的人之一。家里给弟弟安排的路也很顺：进矿务局做官，体面、稳定、前途无量。\n\n但他二十岁那年，在哥廷根大学听了一堂课。讲课的老师叫福斯特，三十岁出头，曾经跟着库克船长环游过世界。福斯特站在讲台上，讲他见过的南太平洋岛屿、没听过的植物、地图上找不到的地方。二十二岁的洪堡坐在台下，第一次意识到两件事：这个世界可以被一个人亲自走一遍；而且已经有人这么做了。\n\n这堂课之后，他的人生变了方向。\n\n## 他把自己的一切押在\"走一趟\"上\n\n洪堡先辞掉了矿务局的差事，花了几年时间当矿场督察，自学矿物学、地质学、植物学、物理学。那几年他在矿井里测量地温、记录空气成分，把\"一个受过教育的人\"该会的东西，硬生生学成了一个科学家的全套工具箱。\n\n1799 年，他三十岁，办成了两件当时几乎不可能的事：说服西班牙王室允许他进入南美洲殖民地考察；把自己继承的遗产大半捐了出去，换成一支探险队和一船仪器。\n\n那艘船离开西班牙港口时，他的行李箱里装满了温度计、气压计、罗盘、显微镜。他要去的地方，当时欧洲地图上还是一片模糊。\n\n## 五年，九千六百公里\n\n他带着法国植物学家邦普兰在南美洲登陆，开始了五年、九千六百公里的远征。他们深入亚马逊流域，得过疟疾，遭过鳄鱼，多次在生死边缘走了一遭。他爬上 5878 米高的钦博拉索山，徒手，创下三十年内无人超越的纪录。同行的人高山反应严重，他却坚持一路测量。\n\n但洪堡真正厉害的，不是吃苦，而是他看世界的方式。\n\n别人登一座山，看见的是\"我征服了一座山\"。洪堡登山，沿途记录每一个海拔高度的温度、气压、植物种类。他第一次画出\"等温线\"，把地球上相同温度的地方连起来；他第一次系统描述\"植被垂直带\"，山顶的植物和山脚的植物为什么不一样。他在秘鲁海岸发现那股寒冷的洋流，现在叫\"洪堡洋流\"；他发现火山分布与地磁异常有关，顺手把地球的地磁场画出了第一张图。\n\n他不是在收集零散的知识，他在做一件事：**把孤立的事实连成一张网**。山、海、空气、植物、岩石、磁力，在他眼里不是各管各的东西，而是一个整体在呼吸。\n\n## 他说过\n\n> 大自然是一个活生生的整体，一切都在彼此关联。\n", "field": "地理/自然"}, {"title": "一场没人听懂的演讲，改写了宇宙", "subtitle": "黎曼｜9月17日诞辰", "date": "09-17", "slug": "09-17-riemann", "file": "scientists/09/09-17-riemann.md", "content": "# 一场没人听懂的演讲，改写了宇宙\n\n## 黎曼｜9月17日诞辰\n\n1854年，哥廷根大学，一个不到三十岁的年轻人站上讲台，做生平第一次就职演讲。台下的教授们大概不会想到，就在这一场演讲里，纵横了两千年的欧氏几何，从「绝对真理」跌成了「特殊情况」；他们更想不到，五十年后，有人会靠着这套东西，推翻牛顿的万有引力。\n\n这个年轻人叫黎曼。他活着的时候穷困潦倒，死后却让整个物理学界都记住了他的名字。\n\n## 从神学院里「逃」出来的数学家\n\n黎曼的父亲是牧师，一心想让儿子继承神职。进了哥廷根大学，黎曼只能修神学与哲学——可他真正的兴趣在数学，而「数学王子」高斯，恰好就在这所学校任教。高斯一眼看出这个学生非同小可，积极鼓励他放下神学，投身数学。也许是冲着高斯的名声，父亲终于松了口。黎曼改学最爱的数学，在高斯的指导下完成论文，1851年拿到博士学位。\n\n## 平行线，为什么会「相遇」\n\n在他之前，俄国的罗巴切夫斯基已经质疑过平行公设，提出「过直线外一点，可以作不止一条平行线」的双曲面几何。但他仍停留在二维的观念里，试着在曲面上重建欧几里得的定理。黎曼走得更远：他革命性地引入拓扑的概念，定义了张量与曲率，造出一整套能完整描述空间的数学工具。\n\n这套工具在物理学界沉寂了许多年，直到爱因斯坦撞上一堵墙——广义相对论需要一门能描述「被扭曲的时空」的几何，而传统语言做不到。经一位数学家朋友介绍，爱因斯坦读到了黎曼几何，这才推导出重力场方程式，完成了广义相对论，把统治了两百多年的牛顿引力拉下王座。\n\n## 贫病交加，却留下一道百年天堑\n\n黎曼的遗产远不止几何。数学里堆满了以他命名的名词，其中最著名的，是黎曼猜想。希尔伯特把它列为1900年提出的二十三个世纪问题之一，曾放话：若他沉睡千年后醒来，第一个要问的就是黎曼猜想有没有被证明。如今它又跻身克莱数学研究所悬赏百万美元的七大难题，一百多年过去，依然无人能解。\n\n可这些成就，没能换来他的好日子。他长期担任没有薪水、只能向学生收费的讲师，收入微薄，生活困苦，直到三十三岁才当上有固定收入的正教授，而身体早已垮掉。不到四十岁，他因肺结核离开人世。\n\n他生前饿着肚子把几何翻了个底朝天，身后用一个猜想，难住了全世界一百多年。命运欠他的体面，历史用另一种方式，加倍还给了他。\n", "field": "数学"}, {"title": "在黑暗中，他一年写八百页", "subtitle": "欧拉｜9月18日诞辰", "date": "09-18", "slug": "09-18-euler", "file": "scientists/09/09-18-euler.md", "content": "# 在黑暗中，他一年写八百页\n\n## 欧拉｜9月18日诞辰\n\n一个数学家失明了，接下来的日子该怎么过？欧拉给出的答案是：继续算。\n\n他人生最后十几年近乎完全失明，眼前只剩一片黑暗，却凭着惊人的记忆力与心算能力，一刻不停地往外吐论文。今天你翻开任何一本数学书，几乎都能撞见他留下的痕迹——这个瑞士人，是数学史上最不可思议的一架机器。\n\n## 一辈子没停过笔的人\n\n欧拉出生于瑞士，二十岁起先后应邀前往俄国与普鲁士的皇家科学院做研究，从那时起直到七十六岁去世，笔就没停过。从二十岁踏上这条路，到七十六岁合眼，中间五十六年，他几乎没有一天放下过笔。他一生留下约八十巨册论文，摊开来算，相当于每年都要写满八百页——多数人一辈子写不完的量，他一年就要写完。\n\n更难的是，他不是在写重复的东西。微分方程、无穷级数、三角函数、图论、拓扑学，再到流体力学、刚体运动，处处都有他的开创性贡献。他像是把自己的精力活活烧进了整个数学的地基里，多产到后世几乎没有对手——只有艾狄胥靠着大量与人合著，才在数量上反超了他。\n\n## 你天天在用他造的符号\n\n欧拉最厉害的地方，还不是算得多。他给数学装上了一整套「通用语言」：f(x)、π、e、sin、cos、Σ、i……这些如今人人习以为常的符号，全出自他的手。在他之前，不同的数学家各说各话，同一个记号可能有十几种写法；在他之后，这些符号成了全世界的默认配置。今天任何一个学生落笔做题，第一行往往就是 f(x) 或 π——这些记号里，还留着他的指纹。\n\n他留下的最高成就，是被称为「最优美的公式」的欧拉恒等式：五个数学里最基本的常数，被他用最简洁的方式拧成一束，像夜空中五颗亮星拼出的星座，神秘又精确。全世界的数学系里，几乎都挂着这一行短短的式子。\n\n## 黑暗夺走他的眼睛，夺不走他的数\n\n人到晚年，疾病一步步吞噬他的视力，直到近乎全盲。可记忆成了他的第二双眼睛，心算成了他的第二支笔。别人要一步步写在纸上的东西，他在脑子里就能完成，然后口述出来，照样一年八百页。别人到了晚年是休息，他的晚年，是另一种全速运转。\n\n欧拉活了七十六岁，几乎没有一天不在算。他拿失明换来的，是八十巨册著作，和一个被符号填满的数学王国。也许他生来就是要算的——眼睛闭上之后，他反而更专注地看见了数学本身的样子。后人常想：若他眼睛一直好好的，数学又会多出多少页？\n", "field": "数学"}, {"title": "连公式都写不利索的时代转折点", "subtitle": "法拉第｜9月22日诞辰", "date": "09-22", "slug": "09-22-faraday", "file": "scientists/09/09-22-faraday.md", "content": "# 连公式都写不利索的时代转折点\n\n## 法拉第｜9月22日诞辰\n\n爱因斯坦的书房墙上，挂着三张肖像：牛顿、麦克斯韦、法拉第。前两位是理论世界的巨匠，唯独法拉第像个异类——他没有雄厚的理论基础，全部的数学功底，只够应付简单的代数。\n\n可正是这个连方程都写不利索的人，把人类送进了电力时代。\n\n## 从订书工到皇家学会讲台\n\n法拉第出生在伦敦一个贫寒的家庭，只受过最基本的教育，全靠自学。十四岁那年，他进了一家书商当学徒。七年的学徒生活，最值钱的报酬不是薪水，而是摸得到的书：他借着装订、送书的机会拼命地读，对科学的兴趣，就在那一摞摞纸页间悄悄长了起来。\n\n二十岁那年，有人送了他一张皇家学会的演讲门票。他认真记下的笔记，引起了时任会长戴维爵士的注意——这位发现钙、镁、钠、钾等十五种元素、被后人称为「无机化学之父」的科学家，收他做了助理。助理之余还要兼当仆人，但不管怎样，他终于能一头扎进科学研究里了。\n\n## 一块磁铁，让电从玩具变成了时代\n\n当时人类对电的认识还很浅。安培发现电线通了电，四周会产生磁场，可这一点和更早的莱顿瓶、伏特堆一样，除了新奇有趣，好像没什么用处。1831年，法拉第补上了反转的一步：磁铁反过来，也能让电线产生电流。他据此做出了人类第一部发电机，从此电不再只是实验室里的玩具，而是能点亮一座城市的动力。\n\n巧的是，就在同一年，麦克斯韦出生了。二十四年后，麦克斯韦写下《论法拉第力线》，用精确的数学语言，把法拉第那些没有公式的观念一一翻译出来，因此深得法拉第赏识。此后麦克斯韦成为皇家学会院士，两人常交换意见；1865年，麦克斯韦发表电磁方程组，若干年后，它又启发了爱因斯坦提出狭义相对论。这条链条从一块磁铁开始，绵延了一个多世纪。\n\n## 把所有的荣誉，都推了回去\n\n法拉第还发现了静电的遮蔽效应，后来衍生出防触电的「法拉第笼」；他发现了苯和电解定律，甚至做过本生灯的雏型。但他花最多心血的，是把科学讲给普通人听。\n\n从1825年起，他在皇家研究院操持两个系列演讲：「星期五之夜讨论会」面向社会各阶层，邀请各路科学家来讲自己的研究，数十年如一日，一直办到1862年；「圣诞节讲座」专门讲给青少年，用实验演示深入浅出的科学，这个传统一直延续到今天。\n\n皇家学会两次推举他当会长，他两次推辞；皇室要封他爵位，他婉拒；临终前，他还特意交代，不要把自己葬进尊荣的西敏寺。他不要头衔，不要墓地，只一心要把知识送还给那些像当年的自己一样、求知若渴的穷孩子。因为他比谁都清楚，那扇门若不开，天赋就永远只是天赋。\n", "field": "物理/化学"}, {"title": "一只流口水的狗，照见你我不愿承认的真相", "subtitle": "巴甫洛夫｜9月26日诞辰", "date": "09-26", "slug": "09-26-pavlov", "file": "scientists/09/09-26-pavlov.md", "content": "# 一只流口水的狗，照见你我不愿承认的真相\n\n## 巴甫洛夫｜9月26日诞辰\n\n科学史上最出名的两只宠物，是薛定谔的猫和巴甫洛夫的狗。前者是虚构的，只活在思想实验里；后者却是货真价实、活生生的一只狗，唯一的绝活，是流口水。\n\n可名气大了也有代价。全世界都记住了这条会流口水的狗，反而没人记得，它身后那个人到底在做什么。\n\n## 在清醒的狗身上，开一道门\n\n巴甫洛夫原本研究的，是狗的胃液。当时人们已经知道，食物进入胃之后，会刺激胃液分泌。他好奇的是更早一步的问题：食物还没到胃，胃会不会就提前分泌了？\n\n要观察答案，只能拿清醒的活狗做实验。巴甫洛夫用一双巧手，把狗的食道和胃各开了几条瘘管接到体外：狗咽下的食物从食道瘘管直接排出，根本进不了胃；而胃里分泌的胃液，则从胃部的瘘管流出来。实验结果证实了他的猜想——食物根本不用进胃，光是看见、闻到、尝到，胃液就已经开始分泌。他还进一步比较了不同食物让胃液分泌的快慢、多少与持续的时间。\n\n这套严谨的消化实验，为他赢得了1904年的诺贝尔生理或医学奖。但站在领奖台上，他讲的主题却是另一件事。\n\n## 台上领诺奖，心里念着流口水\n\n那是他在实验室里顺手记下的一个细节：每当负责喂食的工作人员走进房间，狗就开始分泌唾液。狗分明还没看到食物，只是认出了「喂饭的人要来了」。\n\n巴甫洛夫顺着这个细节追了下去：他在食物出现之前，先给狗视觉或听觉上的信号——图片、哨子、节拍器、音叉。这些信号本来和唾液毫无关系，可连着喂几次之后，狗被「制约」了：就算盘子里没有食物，只要信号一响，它照样口水直流。\n\n有意思的是，后人传说里那枚著名的「铃铛」，从来就没在他的实验里出现过。他用的明明是这些更朴素的工具。\n\n## 别急着笑狗，照照自己\n\n别急着笑话狗笨。后来的实验证实：人同样会被制约。一声毫无来由的响声，一个不起眼的气味，就可能在我们毫无察觉的时候，勾出恐惧、厌恶之类的情绪反应。\n\n这就是「巴甫洛夫的狗」能流传一百年的原因——那条狗用一声哨子、一张图片，轻轻戳破了「人是自己主人」的自信，也照见了一个让人不太舒服的事实：我们并不完全是自己情绪的主人。在理性、意志力、甚至自由意志够不到的地方，还藏着一片由条件反射织成的幽暗角落。狗用口水回答的问题，最后落在了每个人自己身上。\n", "field": "生理/心理学"}, {"title": "一张纸，称出了爆炸的重量", "subtitle": "费米｜9月29日诞辰", "date": "09-29", "slug": "09-29-fermi", "file": "scientists/09/09-29-fermi.md", "content": "# 一张纸，称出了爆炸的重量\n\n## 费米｜9月29日诞辰\n\n1945 年 7 月 16 日清晨五点，内华达州的沙漠里没有风。曼哈顿计划的人挤在掩体后，等着人类第一颗原子弹点火。倒计时还没走完，费米掏出一张纸，撕成碎片，举过头顶松手，纸屑飘落。几秒钟后冲击波卷过，他又撕了一把，抛起来。第三次，是在爆炸结束后。\n\n他是在测威力。纸片被冲击波推出去多远，在地上位移多少，换算一下，核爆的能量就出来了。后来他算出的数字，和仪器实测落在同一个数量级。\n\n在场的人不意外。这个人被选作曼哈顿计划的负责人之一，靠的就是这种把理论揣进兜里、随手就能摸出答案的本事。\n\n## 懂理论的很多，能动手的很少\n\n费米厉害在哪儿，一句话说不完。物理学家通常分两种，一种是纸上推公式的，一种是钻进实验室拧螺丝的，他两个都干，而且都干到顶尖。\n\n别人研究原子核，用的是带正电的 α 粒子，撞来撞去撞不进去。费米先看出来：中性的中子没有电荷阻碍，反而更容易钻进球，轰出核裂变。为了控制反应速度，他发明用石墨给中子减速的办法；为了中子的来源不靠运气，他自己动手做实验，找出制造中子源的方法。1942 年，芝加哥大学的地下室里，人类第一个核反应堆在他手里开始工作。\n\n因为这一串中子研究，1938 年他拿到了诺贝尔物理学奖。\n\n## 二十四岁的深夜，和一个他起的名字\n\n费米的天才，早在他二十几岁就露了底。二十一岁拿物理学博士；二十四岁那年，他把泡利刚提出的不相容原理用在气体上，算出一套统计规律，比狄拉克早几个月。后来这套东西叫费米—狄拉克统计，遵守它的粒子，电子、夸克、微中子，今天统一叫费米子。微中子这个名字，也是他当年解释 β 衰变时取的。\n\n那年他才二十多岁，已经给半个粒子世界命了名。\n\n## 离开故土的人，带出了一片森林\n\n1938 年拿奖那阵子，费米已经在盘算离开意大利。原因很简单：妻子是犹太人，而墨索里尼正在向纳粹靠拢。他怕，于是带着全家去了美国，此后再没回头。\n\n在美国教书的年月，他带出七个诺贝尔奖学生，李政道和杨振宁都在其中。他的名字，挂进了将近三十个物理名词：费米能量、费米能阶、费米气体、费米黄金定则……他甚至留下一个让所有人睡不着的问题：宇宙这么大，为什么我们始终见不到外星文明？这个问句，后来叫费米悖论。他那种不靠数据、靠常识估算的本事，还成了求职面试的标准玩法，比如「芝加哥有多少名钢琴调音师」，这类题至今叫费米问题。\n\n一个物理学家，活着的时候改变了物理学，走了以后，还顺手定义了别人找工作。\n\n参考：PanSci《科学史上的今天》〈费米诞辰〉（本地素材：source_texts/09-29-费米.txt）\n", "field": "物理"}, {"title": "宇宙可能是个左撇子", "subtitle": "杨振宁｜10月1日诞辰", "date": "10-01", "slug": "10-01-yang", "file": "scientists/10/10-01-yang.md", "content": "# 宇宙可能是个左撇子\n\n## 杨振宁｜10月1日诞辰\n\n1956 年，物理学界面前摆着一桩怪案。实验里出现两种介子，θ 和 τ，自旋一样，质量一样，电荷一样，怎么看都是同一个粒子照镜子的样子。可它们的衰变方式，一个像往左拐，一个像往右拐，完全对不上。\n\n这桩矛盾让物理学家们寝食难安，一群人被这件事卡了三十年。没人愿意承认：同一件事物照出的两个镜像，居然会做出不一样的事。\n\n## 三十年没人敢碰的对称\n\n因为宇称守恒，在当时的物理学里，分量跟能量守恒、动量守恒、电荷守恒平起平坐。它的意思是：大自然不分左右，把一套物理实验整个翻成镜像，应该得到一模一样的结果。这几乎是「显然」的常识，是写在教科书底层的底牌。\n\n可 θ 和 τ 这两只「老鼠」，除了左右键调了个方向，其余一模一样，动起来却南辕北辙。所有人都看见了矛盾，但所有人都在给矛盾找补，没人敢去掀那张牌桌。\n\n## 敢掀牌桌的两个年轻人\n\n1956 年，杨振宁和李政道动手了。他们提出：宇称守恒也许只是看起来普遍，在弱相互作用里，它可能根本不成立。他们还贴心地在论文里写好了怎么用实验验证。\n\n学界一片哗然。要知道，宇称守恒在教科书里躺了几十年，无数实验为它背书，敢公开质疑它，等于把自己摆在整个物理界的对面。费曼觉得想法有意思，说可以试试，但掏出五十美元打赌宇称守不住这关；泡利更直接，说他可不相信上帝是个左撇子。\n\n结果，半年后，吴健雄用实验把这个「左撇子」钉死了。论文发表第二年，诺贝尔物理学奖就落到杨振宁和李政道头上。从发表到拿奖只隔一年，这在诺奖史上从来没有过。而自诺贝尔奖设立超过半个世纪以来，华人在物理奖上的长期缺席，也从这一年开始结束。\n\n## 另一颗被忽略的炸弹\n\n但真正让杨振宁站上物理学顶峰的，可能不是这次风光。1954 年，他和米尔斯一起发表杨-米尔斯规范理论，当年因为算不下去，没什么人当回事。谁能想到，它后来成了量子电动力学的骨架，一路长成了整个标准模型的基石。论分量，它不在宇称不守恒之下。\n\n## 一张牌桌，两个人散场\n\n可惜的是，两位合作十余年的搭档，没能把这份荣耀分享到底。论文的排名、功劳的归属，早就悄悄在两人之间划开裂缝，拿了奖之后，干脆互不往来，形同陌路。\n\n外人很难说清谁对谁错，只是免不了感叹：原来科学家在追求真理的时候，也是会追名逐利的。他们推翻了物理学的左右对称，却没守住自己之间的那份对称。\n\n参考：PanSci《科学史上的今天》〈杨振宁生日〉（本地素材：source_texts/10-01-杨振宁.txt）\n", "field": "物理"}, {"title": "世界不是伴着巨响结束的", "subtitle": "钱德拉塞卡｜10月19日诞辰", "date": "10-19", "slug": "10-19-chandrasekhar", "file": "scientists/10/10-19-chandrasekhar.md", "content": "# 世界不是伴着巨响结束的\n\n## 钱德拉塞卡｜10月19日诞辰\n\n1930 年夏天，一艘从印度开往英国的轮船上，一个年轻人半夜走上甲板。头顶是密密麻麻的星，他要去剑桥读博士。书上说，所有恒星烧完燃料后，归宿都一样：塌缩成一颗白矮星，安静地熄灭。\n\n可那天晚上，他盯着星空，算出了一个书本上没有的答案。他怀里抱着一本天文学权威爱丁顿的书，那是他在印度参加物理竞赛赢的奖品。他盘算着到了剑桥，一定要找机会当面请教这位老先生。\n\n## 一个没人要的答案\n\n他学得快，三年读完博士，成了三一学院研究员，也如愿认识了爱丁顿。1935 年 1 月，皇家天文学会的会场，他要把自己多年的心血当众宣读：一颗质量超过太阳 1.44 倍的恒星，不会停在那里当白矮星，它会在自己的引力下继续塌缩，缩到半径只剩几公里。\n\n在 1935 年，这说法近乎妖言惑众。那几公里，今天有个名字叫黑洞。\n\n## 晚宴上那只神秘的笑容\n\n会议的种种都准备好了。会前他突然发现，爱丁顿的演讲排在他后面，题目一模一样。可这几个月他几乎每周都和爱丁顿见面，从没听对方提起过一个字。晚宴上他想问，张了张嘴又咽回去。爱丁顿倒是带着一种神秘的笑，鼓励他第二天畅所欲言。\n\n第二天，他战战兢兢读完论文。接着爱丁顿上台，把他那套理论批得一文不值：他相信一定有条自然法则，会阻止恒星按钱德拉塞卡那种荒谬的方式演化。说完，当着所有人的面，把论文撕成两半。笑声轰然而起。\n\n很多年后他依然记得自己当时脱口而出的话：世界就是这样结束的，不是伴着一声巨响，而是伴着一声呜咽。\n\n## 一场迟到了三十年的欢呼\n\n天文学界的最高权威敲下了锤子，这个话题从此没人敢碰。他那个大胆的答案，被雪藏了三十多年，直到天文学家发现脉冲星，确认中子星真的存在，才被翻出来郑重对待。1.44 倍太阳质量，被写进每一本教科书，叫钱德拉塞卡极限。1983 年，他拿到诺贝尔物理学奖，这时离船上那个夜晚，已经过了半个多世纪。他去世四年后，以他命名的钱德拉 X 射线太空望远镜升空，传回大量黑洞观测数据。\n\n当年他不得不放弃黑洞研究，远走芝加哥。晚年他终于回头，隔着岁月看那场羞辱，说得异常平静。\n\n## 他说过\n\n> 如果爱丁顿当时承认了黑洞理论，黑洞的许多性质将会提前二三十年被发现，这对天文学是有益的。但我不认为对我个人有益。赞美会根本改变我的地位，我确实不知道，在那份诱惑面前我会怎么样。毕竟，有多少年轻人在功成名就之后，还能长久保有青春活力呢？\n\n参考：PanSci《科学史上的今天》〈钱德拉塞卡诞辰〉（本地素材：source_texts/10-19-钱德拉塞卡.txt）\n", "field": "天体物理"}, {"title": "别哭，我需要全部的勇气", "subtitle": "伽罗瓦｜10月25日诞辰", "date": "10-25", "slug": "10-25-galois", "file": "scientists/10/10-25-galois.md", "content": "# 别哭，我需要全部的勇气\n\n## 伽罗瓦｜10月25日诞辰\n\n1832 年 5 月 31 日，巴黎郊外的清晨，一个二十岁的年轻人捂着腹部倒在地上。前一天他与人决斗，腹部中了一枪。临死前，他转过头对守在身边的弟弟说：别哭，阿弗莱德，我需要全部的勇气，才能在二十岁死去。第二天，他就走了。\n\n他叫伽罗瓦，死的时候，手里攥着一整套当时整个数学界都读不懂的思想。\n\n## 一个没能进名校的少年\n\n伽罗瓦在家受启蒙，中学时代换了个新数学老师，才开始对数学着迷。那阵子，另一位数学天才阿贝尔也正在巴黎，两个世纪级的头脑只隔着几公里，半年里始终没有碰面。有些遗憾，是历史替他留下的。\n\n他那时已开始啃数学经典原著，高中就敢去挑战五次方程式的公式解。自己试出来的解法发现有错，他没退缩，反而下了更狠的决心：这一题，非解开不可。\n\n## 他造出了一个数学里没有的词\n\n阿贝尔已经证明，五次方程没有通用的简单公式解。但「没有通用解」不代表「每个都解不了」，欧拉等人就找出过一些特殊类型的公式解。伽罗瓦盯上了更狠的问题：怎么判断任意一个五次方程，到底有没有公式解？\n\n他没有沿着旧路走，而是自己发明了一个全新的概念——群。诀窍在对称性：把方程的根互相置换，看结果变不变。在他的眼里，方程不再按几次方分家，而是按「能保持对称的置换有几种」来分。用置换群、子群一通运算，五次以及更高次方程的判别问题，被他干净利落地解决。\n\n后世数学家看到这套东西，几乎不敢相信出自一个高中生之手，说它足以媲美广义相对论。\n\n## 命运在塌方\n\n可这个天才的少年，人生在现实里一路塌方。考巴黎综合理工，口试惨败；两篇论文先后寄给科学院，石沉大海；第二年，父亲被保守派逼到自杀，他还是没考上，只能去管理严格的师范学院。\n\n亲眼见过这些不公，他成了激进的共和派，跟保守派的校长针锋相对。1831 年初，他被学校除名，干脆加入了主张推翻政权的共和派军队，为此两度入狱。\n\n## 最后一夜，三封信\n\n他没死在狱中。出狱后，一场决斗找上门来。起因是谁，对手是谁，至今没有定论，只知道他极不情愿。\n\n决斗前夜，他像是预见了结局，写了三封遗书，其中一封里夹着三篇论文。他简述了内容，在末尾用潦草的字迹写道：可是我……没有时间了，而对那个浩瀚的领域，我还有些不成熟的想法。\n\n第二天早上，他死在决斗场上。那三篇急就章，后来被人整理成伽罗瓦理论，成了群论的源头，又一路长成粒子物理标准模型与超弦理论的地基。他临死前说「不成熟」的那些想法，至今仍在被后人一遍遍开采。\n\n## 他说过\n\n> 别哭，阿弗莱德！我需要全部的勇气，才能在二十岁死去。\n\n参考：PanSci《科学史上的今天》〈伽罗瓦诞辰〉（本地素材：source_texts/10-25-伽罗瓦.txt）\n", "field": "数学"}, {"title": "她把自己也搭了进去", "subtitle": "玛丽·居里｜11月7日诞辰", "date": "11-07", "slug": "11-07-curie", "file": "scientists/11/11-07-curie.md", "content": "# 她把自己也搭了进去\n\n## 玛丽·居里｜11月7日诞辰\n\n一张一百多年前的老照片，玛丽·居里站在实验室里，围裙上沾着灰尘，眼睛盯着手里的试管。她的目光里没有一丝笑意，只有一种接近固执的专注。看照片的人很难想象，这个沉默的女人，是人类历史上第一个拿两次诺贝尔奖的人——而且是物理、化学两个不同领域各拿一次，至今无人复制。\n\n但照片里没有笑，或许因为她的路，从来都不是一条被祝福的路。\n\n## 六年的家庭教师，换一张大学的入场券\n\n1867 年，玛丽·斯克沃多夫斯卡出生在波兰华沙。她的母亲在她出生后不久感染了肺结核，为了不传染给女儿，刻意与她保持距离。玛丽一辈子没怎么得到过母亲的拥抱。11 岁那年母亲病逝，三年之前，她刚目睹大姊死于伤寒。\n\n命运没有打算放过她。当时华沙被俄国占领，女人不许上大学。家里穷，也供不起她出国。于是她跟二姊立了个约定：她先去当家庭教师赚钱，供二姊去巴黎读医学院；等二姊毕业了，再回头资助她读大学。\n\n这一等，就是六年。她当了六年家庭教师，白天教课，夜里自学。24 岁那年，她终于攒够钱去了巴黎。六年的中断没有摧毁她——她只花两年就拿到了物理学学位，又用一年拿下了数学学位。\n\n1894 年，她遇见了一个叫皮埃尔·居里的年轻人。第二年，他们结婚。她从此成为玛丽·居里。\n\n## 从沥青里，刨出两种新元素\n\n1896 年，法国物理学家贝克勒发现铀盐能发出一种神秘射线。居里夫妇决定搞清楚：这射线到底从哪来。\n\n答案不是查资料查出来的，是刨出来的。他们买来成吨的沥青铀矿，在一个漏雨的棚屋里，日复一日地煮沸、过滤、沉淀、结晶。那是世界上最笨重的实验——没有助手，没有资金，只有两口大锅和一个不断欠债的家。皮埃尔后来写道，那几年他们「像牛马一样工作」。\n\n两年多以后，他们从几吨矿石里，刨出了两种全新元素。一种命名为钋，纪念她的祖国波兰；一种命名为镭。更重要的发现是：辐射来自原子本身，而不是来自什么化学变化。世界第一次知道，原子内部藏着一座随时可能释放能量的火山。\n\n1903 年，他们与贝克勒共同获得诺贝尔物理学奖。\n\n## 丈夫去世后，她一个人把镭提了出来\n\n那是她人生里最好的两年半：功成名就，家庭圆满，经济宽裕。然后，1906 年 4 月的一天，皮埃尔过马路时被一辆马车撞死。\n\n玛丽·居里没有停下来。她接下了丈夫在索邦大学的教席——成为法国第一位女教授——继续做一件所有人都觉得不可能的事：把镭从化合物里分离出纯金属。因为当时的科学界还在质疑：你发现的镭，真的是元素吗？\n\n她又用了四年，在丈夫留下的实验室里，一个人完成了分离。1911 年，她独自获得诺贝尔化学奖。\n\n## 她把生命也献给了放射线\n\n一战爆发时，她组装了一批 X 光车开往前线，为医生诊断伤员提供设备。那时的她并不知道，自己研究了一辈子的辐射，正在慢慢杀死自己。\n\n她做实验从不做防护——没有人警告过她。数十年接触放射性物质，让她视力严重受损、血液病变，直到 1934 年 7 月 4 日，她在病床上停止了呼吸，享年 66 岁。她没来得及看到第二年，长女伊雷娜和女婿也一起获得诺贝尔化学奖——居里家族成为科学史上最传奇的家族。\n\n她研究辐射，被辐射照亮，最后也被辐射带走。她的笔记本到今天仍然带有放射性，被锁在铅盒里，需要穿防护服才能翻阅。\n\n## 他说过\n\n> 没有什么值得惧怕的，只有需要去理解的东西。现在该增加理解的，是更多的东西。\n", "field": "物理/化学"}, {"title": "漂流四万年的瓶中信", "subtitle": "卡尔·萨根｜11月9日诞辰", "date": "11-09", "slug": "11-09-sagan", "file": "scientists/11/11-09-sagan.md", "content": "# 漂流四万年的瓶中信\n\n## 卡尔·萨根｜11月9日诞辰\n\n2013 年，航海家一号正式飞出了太阳系。此后它每年前进 5.4 亿公里，扑向未知的星际空间。如果一切顺利，四万年后它会抵达 17.6 光年外的 Gliese 445，下一个行星系。\n\n它身上戴着一块金唱片。里面收着不同民族的问候语和音乐，收着大自然与动物的声音，收着人类生命的图像和地球的位置。那是我们投进宇宙大海的一封瓶中信，赌有一天，某个路过的外星文明会把它捞起来，读懂上面的信息，知道宇宙里曾经有过我们。\n\n这样的瓶子其实一共有四封，分别搭着航海家二号、先锋十号、先锋十一号，朝着不同方向漂。而出这个主意的人，正是美国天文学家卡尔·萨根。\n\n## 地面上，还有一群听了三十年的人\n\n就在瓶子漂流的同时，萨根还推动了另一件事。SETI，也就是搜寻地外智慧生命计划，用地面的无线电望远镜，听了整整三十年的太空，就盼着哪一天，电波里混进一个来自其他文明的信号。\n\n他深信我们并不孤单。亿万颗星球之间，不可能只有地球这一盏灯亮着。\n\n## 一个认真的怀疑者\n\n但萨根绝不是只会幻想外星人的人。他骨子里是怀疑论者，那句被说烂了的「超乎寻常的主张，需要超乎寻常的证据」，正是他在节目里反复念叨，才传遍世界的。\n\n当美国民众相信金星上气候宜人、住着金星人，他第一个站出来：金星表面又干又热，人根本待不住。对那些信誓旦旦说见过飞碟的，他从不留情面，一句「一派胡言」打发掉。\n\n一个人越是渴望宇宙里不孤单，就越要先学会对证据斤斤计较。\n\n## 五亿人看过的宇宙\n\n萨根写了二十多部著作，发表过六百多篇论文与文章。1980 年，他制作并主持的电视节目《宇宙》开播，先后在六十多个国家播出，观众超过五亿。\n\n他讲宇宙，从来不只为讲知识。从星球到恒星到银河，他层层讲下去，落到最后总是一个问题：人类，你这个宇宙尘埃里的小点，你到底是谁？在他眼里，寻找外星文明就是探索宇宙，也是探索人类这个物种在宇宙里的自我定位。人越是抬头看星空，越该低头重新认识自己。\n\n多年以后，那封金唱片还在飞。四万年，是一代人的文明听不见的距离。但萨根大概从没怀疑过一件事：该把它投出去。\n\n## 他说过\n\n> 我们身在宇宙之中，就像漂浮在尘埃里的一颗微粒。而我相信，人类的未来会如何，端看我们对宇宙的了解有多透彻。\n\n参考：PanSci《科学史上的今天》〈卡尔·萨根诞辰〉（本地素材：source_texts/11-09-卡尔·萨根.txt）\n", "field": "天文/科普"}, {"title": "一次测不准的会面", "subtitle": "海森堡｜12月5日诞辰", "date": "12-05", "slug": "12-05-heisenberg", "file": "scientists/12/12-05-heisenberg.md", "content": "# 一次测不准的会面\n\n## 海森堡｜12月5日诞辰\n\n1941 年 9 月，纳粹德国占领丹麦已经快一年半。德国物理学家海森堡踏进哥本哈根大学的校园，来见玻尔。\n\n这个校园他太熟了，十九年前，他在这里度过了改变一生的一年。可这次不一样。此刻的海森堡，是德国原子弹计划的负责人，而玻尔，多半已经对他失望透顶。会面结束，海森堡沮丧地告辞，心里清楚，那位亦师亦友的老先生，从此跟自己恩断义绝。\n\n## 改变一生的一学年\n\n十九年前，海森堡还是个博士生，跟着老师去哥廷根听玻尔讲学，就此结识了这位物理巨擘。他给玻尔留下的印象显然不错，两年后，玻尔专程通知他，有一笔奖学金，可以来哥本哈根接受他一年的指导。\n\n就是这一学年。海森堡把玻尔的氢原子模型翻来覆去地想：教科书说电子像行星一样，沿特定轨道绕行，可轨道到底多宽、存不存在，谁也没见过。人能观测到的，只有电子跃迁前后的能量差，以及发出的电磁波频率。他干脆主张：把行星轨道这种假设扔掉，只用观测到的能量和频率来描述粒子。\n\n回到德国，在玻恩和约尔丹的帮助下，1925 年，他用矩阵把这一套算了出来。矩阵力学诞生，量子力学正式开张。\n\n## 玻尔浇下来的那盆冷水\n\n第二年，玻尔力邀他来哥本哈根讲课、做助理。1927 年，他抛出更让古典物理坐不住的东西，测不准原理：粒子的位置和动量，不可能同时被确定。\n\n他讲得很通俗：想知道位置，就得用更短波长的光去照，波长越短能量越大，越会撞乱粒子的动量，所以永远顾此失彼。玻尔却给他当头一棒：你这个说法，等于承认粒子本来有位置、有动量，只是量不出来，这还是古典物理的老脑筋。真相是，粒子本来就没有什么精确的位置和速度。\n\n海森堡豁然开朗：不确定性不是测量的误差，而是万物的本质。问客观事实是什么毫无意义，只有观测者量到的结果才有意义。从此它改名「不确定性原理」，成为哥本哈根学派的地基，他和玻尔并列为学派的创立者。1932 年，他拿到诺贝尔物理学奖，前途一片光明，直到纳粹崛起。\n\n## 留下的人\n\n纳粹上台后，他的科学家朋友们各奔东西：有的为保命，有的不愿给纳粹卖命。海森堡却出于爱国情结留了下来，后来还接受征召，主持了德国原子弹计划。为此，许多科学家唾弃他，其中就有玻尔。\n\n他 1941 年飞去丹麦，为的就是当面解释。但玻尔不接受，从此再没有见他。那场谈话的具体内容，两人都没有多说。海森堡是来向玻尔讨教、突破原子弹的研发瓶颈？还是来告诉玻尔「我绝不会让原子弹成功」，求一份谅解？到今天，科学家和历史学家仍然各执一词。\n\n一桩悬案，像极了他最著名的原理：有些真相，也许永远测不准。\n\n参考：PanSci《科学史上的今天》〈海森堡诞辰〉（本地素材：source_texts/12-05-海森堡.txt）\n", "field": "物理"}, {"title": "机器还没造出来，程序已经写好了", "subtitle": "爱达·勒芙蕾丝｜12月10日诞辰", "date": "12-10", "slug": "12-10-lovelace", "file": "scientists/12/12-10-lovelace.md", "content": "# 机器还没造出来，程序已经写好了\n\n## 爱达·勒芙蕾丝｜12月10日诞辰\n\n2014 年 12 月 8 日，美国总统奥巴马在镜头前现学现写，用 JavaScript 在屏幕上画了一个色块，成了史上第一位写代码的美国总统。编程，就这样成了我们这个时代最显赫的本事。\n\n可全世界第一个写出程序的人，比这场秀早了一百多年。她叫爱达·勒芙蕾丝，一位两百年前出生的英国女性，一辈子没进过大学。\n\n## 一台永远没完工的机器\n\n故事得从一台造不出来的机器说起。1822 年，英国发明家巴贝奇设计了差分机：全凭齿轮带动，反复计算多项式的差值，再反推出函数的近似值。用机器代替人力算数，省时间，还不会出错。可这台机器要用两万多个零件，每个都得磨到极高精度，做了十年，只完成七分之一。资助它的英国政府终于没了耐心，断了钱。\n\n巴贝奇的梦没有死，因为他遇见了爱达。\n\n## 拜伦的女儿，从没见过父亲\n\n爱达本来姓拜伦，对，就是诗人拜伦的女儿。可她从没见过父亲。母亲在她出生后不久，就受够了拜伦的喜怒无常和不负责任，带着她离开。她遗传了母亲的数学天赋，从小显露头角。\n\n十七岁那年，爱达在巴贝奇那里看到差分机的半成品，当场就被吸住了。两人开始密集通信，讨论这台机器的未来。巴贝奇从她的信里得到灵感，决定设计一台更强大的「分析机」。\n\n## 两万字的一篇注脚\n\n巴贝奇构想的分析机，用蒸汽驱动，用打孔纸带输入不同的程序，还有存放数据的寄存器，说白了，这就是现代电脑的雏形。为了拉资金，巴贝奇跑到欧陆宣讲。一位意大利数学家把他的构想写成一篇八千字的法文报告，介绍给欧洲科学界。\n\n爱达把这份报告翻译成英文，然后在译文里加上自己的注解。结果，注解比原文还长，整本变成两万字的小书。就在注解里，她做了一件惊人的事：为了让分析机算出一串无限数列，也就是伯努利数，她一个步骤一个步骤地写下了指令。这些指令一环扣一环，会自己循环算下去。\n\n这就是程序。后人说，世界上第一支计算机程序，写在一个从未运行过的机器上，出自一位从未上过大学的女性之手。\n\n## 从未运行，却写进了历史\n\n分析机最终因为太过庞大复杂，从来没有被造出来，那两万字也就只能躺在纸上。可爱达依然被公认为第一位程序员。\n\n在那个女性进不了大学的时代，她是两个孩子的母亲，靠书信和自学，把别人想都不敢想的东西想清楚了。可惜她的人生太短：三十七岁患上宫颈癌，医生用当时流行的放血疗法给她治病，结果失血过多，要了她的命。\n\n她写下的程序，注定跑不了，因为那台机器从来不存在。可她的眼光比机器早了一百多年：机械不只是用来算数，它可以按人给的一串指令，自己一步步走完全程。这正是后来所有电脑在做的事。\n\n参考：PanSci《科学史上的今天》〈爱达·勒芙蕾丝诞辰〉（本地素材：source_texts/12-10-爱达·勒芙蕾丝.txt）\n", "field": "计算机"}, {"title": "七十个圆，一条椭圆", "subtitle": "开普勒｜12月27日诞辰", "date": "12-27", "slug": "12-27-kepler", "file": "scientists/12/12-27-kepler.md", "content": "# 七十个圆，一条椭圆\n\n## 开普勒｜12月27日诞辰\n\n1577 年，一颗明亮的彗星突然划破欧洲的夜空。德国有个六岁的小男孩，在母亲的指引下仰头看那颗星。与此同时，丹麦的天文学家第谷，正把望远镜对准同一个方向。两个素不相识的人，视线在一颗彗星上相遇。他们谁也不知道：二十三年后，他们的人生轨道也将短暂叠合，而人类看清宇宙的方式，将从此改变。\n\n那个小男孩，就是开普勒。\n\n## 用正多面体搭宇宙的人\n\n开普勒研究星星，是为了更了解上帝。只是他心里的上帝，跟教会讲的不太一样，他笃信哥白尼的日心说。二十五岁那年，他出版《宇宙的奥秘》：太阳在中心，当时已知的六大行星绕行，它们的轨道是六个嵌套的圆球，而这些圆球之间，恰好能严丝合缝地放进五种正多面体，一层套一层。他相信，完美对称的几何，才是上帝给宇宙的礼物。\n\n他把这本书寄给了第谷。第谷回了信，邀请他去布拉格新建的天文台。\n\n## 捂得最紧的一抽屉数据\n\n开普勒求之不得，因为第谷手里握着全世界最丰富、最精确的观星资料。但他到了布拉格才发现，第谷把这批数据看得比命还重，处处设防。直到第二年第谷病逝，那些记录才全部落到开普勒手上。\n\n于是，整个宇宙的秘密，在一堆堆数字里等着他去翻。\n\n## 七十个圆，一条椭圆\n\n开普勒一开始也戴着「圆才配得上上帝」的枷锁。他对着火星，先后试了七十种圆形轨道，拿去和第谷的数据比对，没有一种对得上。\n\n他终于醒悟：答案不是圆，是椭圆。1609 年，他发表了行星运动的前两条定律：行星沿椭圆轨道绕太阳运行，太阳位于椭圆的一个焦点；行星与太阳的连线，在相同时间里扫过相同的面积，所以行星离太阳远时走得慢，近时走得快。他又埋头十年，找到了第三条：公转周期的平方，等于椭圆轨道半长轴的立方。人类第一次，用一条简洁的数学公式，精确描述了大自然的运行。\n\n## 被磨坏的人生\n\n他小时候感染天花，视力和双手都受了损，按说根本不适合研究天文。可他就是凭一股劲，独自一人，前前后后花了十八年，从第谷积累的二十年观测数据里，把三条定律一点点抠出来。\n\n而他的命，一直很苦。挚友被人谋杀，六岁的儿子死于天花，妻子死于伤寒，母亲被诬为女巫、受尽拷打。他站出来为母亲辩护，把人救了出来，母亲却在半年后也去世了。可就是这样一个人，依然相信上帝打造的世界拥有和谐之美。\n\n他晚年流离失所，病死在异乡。但愿他闭上眼睛的那一刻，心里还抱着那句话。\n\n## 他说过\n\n> 让我们蔑视回荡在这片高贵土地上的野蛮叫嚣，重新唤起我们对和谐的了解与期盼。\n\n参考：PanSci《科学史上的今天》〈开普勒诞辰〉（本地素材：source_texts/12-27-开普勒.txt）\n", "field": "天文"}, {"title": "电脑搬进神殿的那年夏天", "subtitle": "冯·诺依曼｜12月28日诞辰", "date": "12-28", "slug": "12-28-von-neumann", "file": "scientists/12/12-28-von-neumann.md", "content": "# 电脑搬进神殿的那年夏天\n\n## 冯·诺依曼｜12月28日诞辰\n\n1946 年 6 月，一堆机械和金属零件陆续运进普林斯顿高等研究院，经过一楼爱因斯坦的办公室，搬进地下室。院里的学者们看着，直皱眉头。这里是让人安静思考的圣地，爱因斯坦这样的天才，只需要纸笔和黑板，搞台电脑进来，算怎么回事？\n\n话是这么说。可提出要造这台电脑的，是建院时和爱因斯坦一起被请来的四位教授之一。再说了，谁能拒绝冯·诺依曼？\n\n## 被误认成研究生的天才\n\n他不是靠资历压人。那年他不过四十出头，当年刚出现在研究院时，还被人误认成研究生。他只是天赋太吓人：六岁能心算八位数除法，八岁就会微积分；过目不忘，读过的书全记得，连电话簿都能背下来；别人向他请教，他五分钟内抓住问题关键，见解常常比提问者还深。\n\n二十二岁，他拿到数学博士，去柏林大学任教，成了这所学校有史以来最年轻的教授，三年发表了三十二篇数学论文。而在四十岁之前，他已经把好几门学问都趟了一遍：用希尔伯特空间证明矩阵力学与波动方程等价，给刚出生的量子力学铺上严谨的数学骨架；又把数学系统地搬进经济学，给赛局理论立起第一套模型，后世尊他「赛局理论之父」。\n\n## 一台让他昏倒的机器\n\n好吧，物理和经济学再怎么说都沾着数学的边。那电脑呢？\n\n1944 年 8 月，冯·诺依曼听说军方正在造世界第一台通用电脑 ENIAC，兴冲冲跑去看。结果差点昏倒：机器又大又费电不说，每次换一个程序，要重新设上千个开关、插拔上百条电缆。他回去动了动脑，第二年就发表了一篇里程碑论文：把电脑的硬件分成五大组件，同时定义了软件的逻辑结构。现代电脑的基本架构，就这么定了下来。于是他的头衔里，又多了一个「电脑之父」。\n\n## 从不纸上谈兵\n\n冯·诺依曼显然不想只写论文。他坚持让学校真把电脑造出来，这正是 1946 年那批零件搬进地下室的原因。而在他找来的同事赶工的时候，他又把兴趣转向了一个更疯狂的方向：自我复制的机器。\n\n他设想：一台机器从漂浮的零件堆里挑出合适的零件，拼出和自己一样的硬件，再把自己的软件拷进后代，于是每个后代都能再复制自己，数目按指数疯长。四年之后，华生和克里克揭开了 DNA 的秘密，生命繁衍的方法，跟他构想的竟然不谋而合。也就是说，这个数学家在造计算机的空当，顺手把生命的复制原理提前想了一遍。\n\n可惜他走得太早。五十三岁，骨癌。化疗期间，他正在研究怎么让电脑学会人脑的思考方式。要是没有病魔，也许他的名字后面，又要多挂一个「某之父」的头衔了。\n\n参考：PanSci《科学史上的今天》〈冯·诺依曼诞辰〉（本地素材：source_texts/12-28-冯·诺依曼.txt）\n", "field": "计算机/数学"}]
</script>

<script>
const ARTICLES = JSON.parse(document.getElementById('articles-data').textContent);
const POOL = JSON.parse(document.getElementById('pool-data').textContent);
const FIELDS = ["人类学", "信息论", "化学", "医学", "发明", "地理", "天体物理", "天文", "宇宙学", "工程", "心理学", "数学", "物理", "生物", "生理", "科学", "航天", "计算机"];

document.getElementById('stat-n').textContent = ARTICLES.length;
document.getElementById('stat-f').textContent = FIELDS.length;
document.getElementById('stat-m').textContent = new Set(ARTICLES.map(a=>a.date.slice(0,2))).size;

/* ---------- 今日科学家 ---------- */
function todayString() {
  const d = new Date();
  return ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function renderToday() {
  const t = todayString();
  const a = ARTICLES.find(x => x.date === t);
  const el = document.getElementById('today-content');
  const kicker = document.getElementById('today-kicker');
  if (a) {
    kicker.textContent = '今天 · ' + a.date.slice(0,2) + '月' + a.date.slice(3) + '日';
    el.innerHTML = `<div class="today-card today-done" data-slug="${a.slug}">
      <div class="today-left">
        <p class="today-name">${esc(a.subtitle.split('｜')[0])}</p>
        <h3>${esc(a.title)}</h3>
        <p class="today-desc">${esc(a.subtitle)}</p>
        <span class="today-cta">点开，读他的一生 →</span>
      </div>
      <div class="today-right">
        <span class="today-bigdate">${a.date.slice(3)}</span>
        <span class="today-month">${a.date.slice(0,2)}月</span>
      </div>
    </div>`;
    el.querySelector('.today-card').onclick = () => openArticle(a.slug);
  } else {
    const p = POOL.find(x => x.date === t.replace('-','/'));
    kicker.textContent = '今天 · ' + aDateCN(t);
    if (p) {
      const ty = {'birth':'诞辰','death':'忌日','event':'事件'}[p.type] || '';
      el.innerHTML = `<div class="today-card today-preview">
        <div class="today-left">
          <p class="today-name">${esc(p.person)}</p>
          <h3>${esc(p.one_line)}</h3>
          <p class="today-desc">${esc(p.field)} · ${ty}</p>
          <span class="today-cta muted">今天这篇还在写，明天见</span>
        </div>
        <div class="today-right">
          <span class="today-bigdate">${t.slice(3)}</span>
          <span class="today-month">${t.slice(0,2)}月</span>
        </div>
      </div>`;
    } else {
      el.innerHTML = `<div class="today-card today-preview">
        <div class="today-left"><p class="today-name">今天</p><h3>没有特别的日子</h3>
        <p class="today-desc">但科学每天都在发生</p></div>
        <div class="today-right"><span class="today-bigdate">${t.slice(3)}</span><span class="today-month">${t.slice(0,2)}月</span></div>
      </div>`;
    }
  }
}
function aDateCN(t) { return t.slice(0,2) + '月' + t.slice(3) + '日'; }
renderToday();

/* ---------- 名人堂 ---------- */
const HALL = [
  "01-04","02-12","03-14","04-15","05-11","06-23","07-10","08-26","09-22","10-25","11-07","12-27"
];
function renderHall() {
  const grid = document.getElementById('hall-grid');
  const people = HALL.map(d => ARTICLES.find(x => x.date === d)).filter(Boolean);
  grid.innerHTML = people.map((a,i) => {
    const name = a.subtitle.split('｜')[0];
    return `<article class="hall-card" data-slug="${a.slug}" style="--n:${i+1}">
      <span class="hall-num">0${i+1}</span>
      <h3>${esc(name)}</h3>
      <p>${esc(a.title)}</p>
      <span class="hall-date">${a.date.slice(0,2)}月${a.date.slice(3)}日</span>
    </article>`;
  }).join('');
  grid.querySelectorAll('.hall-card').forEach(c => c.onclick = () => openArticle(c.dataset.slug));
}
renderHall();

const nav = document.getElementById('field-nav');
const allBtn = document.createElement('button');
allBtn.textContent = '全部';
allBtn.className = 'active';
allBtn.onclick = () => render();
nav.appendChild(allBtn);
FIELDS.forEach(f => {
  const b = document.createElement('button');
  b.textContent = f;
  b.onclick = () => render(f);
  nav.appendChild(b);
});

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function mdToHtml(text) {
  const lines = text.split('\n');
  let out = [];
  for (let ln of lines) {
    if (ln.startsWith('# ')) continue;
    if (ln.startsWith('## ')) { out.push('<h3>' + esc(ln.slice(3)) + '</h3>'); }
    else if (ln.startsWith('> ')) { out.push('<blockquote>' + esc(ln.slice(2)) + '</blockquote>'); }
    else if (ln.trim() === '') { out.push('<br>'); }
    else if (ln.startsWith('参考')) { }
    else { out.push('<p>' + esc(ln) + '</p>'); }
  }
  return out.join('\n');
}

function render(field) {
  const gal = document.getElementById('gallery');
  const list = ARTICLES.filter(a => !field || a.field.split('/')[0] === field);
  let months = {};
  list.forEach(a => {
    const mm = a.date.slice(0,2);
    (months[mm] = months[mm] || []).push(a);
  });
  const mmKeys = Object.keys(months).sort();
  gal.innerHTML = mmKeys.map(mm => {
    const cards = months[mm].map(a => {
      return `<article class="card" data-slug="${a.slug}">
        <div class="card-date">${a.date.slice(5)}</div>
        <h2>${esc(a.title)}</h2>
        <p class="card-sub">${esc(a.subtitle)}</p>
        <span class="tag">${esc(a.field)}</span>
      </article>`;
    }).join('');
    return `<section class="month" id="m${mm}"><h2 class="month-head">${mm} 月</h2><div class="cards">${cards}</div></section>`;
  }).join('');
  gal.querySelectorAll('.card').forEach(c => c.onclick = () => openArticle(c.dataset.slug));
}

function openArticle(slug) {
  const a = ARTICLES.find(x => x.slug === slug);
  if (!a) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const color = 'var(--ink)';
  overlay.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <button class="close">×</button>
    <p class="modal-date">${a.date}</p>
    <h1>${esc(a.title)}</h1>
    <h2 class="modal-sub">${esc(a.subtitle)}</h2>
    <div class="modal-body">${mdToHtml(a.content)}</div>
  </div>`;
  overlay.onclick = () => overlay.remove();
  overlay.querySelector('.close').onclick = () => overlay.remove();
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

render();
</script>
